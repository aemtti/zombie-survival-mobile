<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#07080b">
<title>해로 크릭 · Harrow Creek</title>
<meta name="description" content="밤이 오는 작은 마을에서 10분을 버티고 구조 헬기에 올라타는 좀비 생존 게임. 혼자 또는 친구 2~4명이 온라인 협동으로, 폰과 PC에서 바로 플레이. A top-down zombie survival game, solo or online co-op for 2-4 friends.">
<meta property="og:type" content="website">
<meta property="og:title" content="해로 크릭 · Harrow Creek">
<meta property="og:description" content="밤이 오는 마을에서 10분을 버티고 헬기에 올라타라. 혼자 또는 친구와 온라인 협동(2~4명)으로, 폰과 PC에서 바로 플레이하는 좀비 생존 게임.">
<meta property="og:image" content="https://aemtti.github.io/zombie-survival-mobile/preview.png">
<meta property="og:url" content="https://aemtti.github.io/zombie-survival-mobile/">
<meta name="twitter:card" content="summary_large_image">
<!-- Anton stands in for Impact on phones, which don't ship Impact. Black Han Sans draws the Korean headings;
     offline, Korean headings fall back to a heavy system face ('HC Head KO' below) and Latin to sans-serif -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Black+Han+Sans&display=swap" rel="stylesheet">
<style>
  @font-face { font-family: 'HC Head KO'; font-weight: 400; unicode-range: U+1100-11FF, U+3130-318F, U+AC00-D7AF;
    src: local('Malgun Gothic Bold'), local('MalgunGothicBold'), local('Apple SD Gothic Neo Heavy'), local('AppleSDGothicNeo-Heavy'),
         local('Noto Sans KR Black'), local('NotoSansKR-Black'), local('Noto Sans CJK KR Black'), local('NotoSansCJKkr-Black'), local('Malgun Gothic'); }
  html, body { margin: 0; padding: 0; background: #07080b; overflow: hidden; height: 100%; }
  html, body, canvas { touch-action: none; overscroll-behavior: none; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; }
  canvas { display: block; position: fixed; left: 0; top: 0; width: 100vw; height: 100vh; cursor: none; outline: none; transform-origin: 0 0; }
  /* the online room screen, drawn over the title */
  #lobby { position: fixed; inset: 0; z-index: 5; overflow-y: auto; -webkit-overflow-scrolling: touch; touch-action: pan-y; display: flex; align-items: flex-start; justify-content: center;
    padding: max(14px, env(safe-area-inset-top)) 16px 20px; box-sizing: border-box; background: rgba(5,6,12,0.55); color: #e8e4d8;
    font: 15px/1.45 'Segoe UI', Tahoma, 'Helvetica Neue', Arial, 'Malgun Gothic', 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif; -webkit-user-select: text; user-select: text; }
  #lobby[hidden] { display: none; }
  .lb-card { width: 100%; max-width: 520px; margin: auto 0; background: rgba(14,16,22,0.94); border: 1px solid rgba(255,255,255,0.12); border-radius: 14px; padding: 18px 20px; box-shadow: 0 10px 40px rgba(0,0,0,0.5); }
  .lb-card h1 { margin: 0 0 6px; font: 30px/1.15 Impact, Anton, 'Black Han Sans', 'HC Head KO', sans-serif; letter-spacing: 0.5px; color: #f2eee4; }
  .lb-card p { margin: 6px 0 10px; }
  .lb-card button { display: block; width: 100%; margin: 8px 0; padding: 11px 14px; border-radius: 9px; border: 1px solid rgba(255,255,255,0.25); background: rgba(255,255,255,0.08); color: #fff; font: inherit; font-weight: 700; cursor: pointer; }
  .lb-card button.primary { background: rgba(106,255,176,0.22); border-color: rgba(106,255,176,0.6); }
  .lb-card button.ghost { background: transparent; color: #bbb; }
  .lb-card button.small { display: inline-block; width: auto; margin: 8px 0 0; padding: 7px 12px; }
  .lb-card button:active { transform: translateY(1px); }
  .lb-row { display: flex; gap: 8px; align-items: center; }
  .lb-row > * { flex: 1; }
  .lb-row input { flex: 1.4; }
  .lb-card input { box-sizing: border-box; width: 100%; padding: 10px 12px; border-radius: 9px; border: 1px solid rgba(255,255,255,0.25); background: rgba(0,0,0,0.35); color: #fff; font: inherit; font-weight: 700; letter-spacing: 1px; -webkit-user-select: text; user-select: text; }
  .lb-l { display: block; margin: 10px 0 4px; font-size: 13px; color: #c9c3b8; }
  .lb-l input { margin-top: 4px; letter-spacing: 0; }
  .lb-link { padding: 10px 12px; border-radius: 9px; background: rgba(0,0,0,0.4); font: 600 14px/1.3 monospace; word-break: break-all; color: #ffe9a8; -webkit-user-select: all; user-select: all; }
  .lb-warn { padding: 8px 12px; border-radius: 9px; background: rgba(232,133,58,0.14); border: 1px solid rgba(232,133,58,0.4); color: #ffd9bf; font-size: 13px; }
  .lb-warn ul { margin: 6px 0 2px; padding-left: 18px; }
  .lb-seats { list-style: none; margin: 10px 0; padding: 0; }
  .lb-seats li { display: flex; align-items: center; gap: 8px; padding: 7px 10px; margin: 4px 0; border-radius: 8px; background: rgba(255,255,255,0.06); font-weight: 700; }
  .lb-seats i { width: 14px; height: 14px; border-radius: 50%; flex: none; }
  .lb-seats em { font-style: normal; font-weight: 600; color: #9a9; font-size: 12px; }
  .lb-seats em.lb-off { color: #e99; }
  .lb-big { font-size: 17px; font-weight: 700; }
  .lb-dim, .lb-ver { color: #888; font-size: 12px; }
  .lb-ver { text-align: right; margin: 6px 0 0 !important; }
  .lb-note { color: #7affc0; font-weight: 700; }
  .lb-spin { display: inline-block; width: 14px; height: 14px; border: 2px solid rgba(255,255,255,0.25); border-top-color: #7affc0; border-radius: 50%; animation: lbspin 0.8s linear infinite; vertical-align: -2px; }
  @keyframes lbspin { to { transform: rotate(360deg); } }
</style>

'use strict';
// =====================================================================
//  HARROW CREEK — a top-down zombie survival game in one file.
//  All graphics are drawn with canvas code, all sounds are synthesized
//  with WebAudio. No external assets.
// =====================================================================

// ---------------------------------------------------------------------
// Math / util
// ---------------------------------------------------------------------
const TAU = Math.PI * 2;
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const rand = (a = 1, b) => b === undefined ? Math.random() * a : a + Math.random() * (b - a);
const randi = (a, b) => Math.floor(rand(a, b + 1));
const pick = arr => arr[(Math.random() * arr.length) | 0];
const dist2 = (ax, ay, bx, by) => { const dx = bx - ax, dy = by - ay; return dx * dx + dy * dy; };
const angDiff = (a, b) => { let d = (b - a) % TAU; if (d > Math.PI) d -= TAU; if (d < -Math.PI) d += TAU; return d; };
const easeOut = t => 1 - (1 - t) * (1 - t);
function mulberry32(seed) {
  return function () {
    seed |= 0; seed = seed + 0x6D2B79F5 | 0;
    let t = Math.imul(seed ^ seed >>> 15, 1 | seed);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
function fmtTime(s) {
  s = Math.max(0, Math.ceil(s));
  return String(Math.floor(s / 60)).padStart(2, '0') + ':' + String(s % 60).padStart(2, '0');
}
function makeCanvas(w, h) {
  const c = document.createElement('canvas');
  c.width = Math.max(1, Math.ceil(w)); c.height = Math.max(1, Math.ceil(h));
  return c;
}
function shade(hex, amt) { // lighten (+) / darken (-) a #rrggbb color
  const n = parseInt(hex.slice(1), 16);
  let r = n >> 16, g = (n >> 8) & 255, b = n & 255;
  if (amt >= 0) { r += (255 - r) * amt; g += (255 - g) * amt; b += (255 - b) * amt; }
  else { r *= 1 + amt; g *= 1 + amt; b *= 1 + amt; }
  return 'rgb(' + (r | 0) + ',' + (g | 0) + ',' + (b | 0) + ')';
}

// ---------------------------------------------------------------------
// Audio — everything synthesized
// ---------------------------------------------------------------------
const MASTER_VOL = 0.65;
const Sound = {
  ctx: null, master: null, sfx: null, musicBus: null, musicLP: null, noise: null, muted: false,
  last: {}, flame: null, rotor: null, heartT: 0, lowHp: false,
  music: { on: false, next: 0, step: 0, intensity: 0, drone: null, timer: null, tier: 0, lastI: 0, bpm: 84 },

  init() {
    if (this.ctx) { if (this.ctx.state === 'suspended') this.ctx.resume(); return; }
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    try { this.ctx = new AC(); } catch (e) { this.ctx = null; return; }
    const c = this.ctx;
    const comp = c.createDynamicsCompressor();
    comp.threshold.value = -14; comp.knee.value = 10; comp.ratio.value = 5; comp.attack.value = 0.003; comp.release.value = 0.2;
    const limiter = c.createDynamicsCompressor(); // brick-wall safety stage
    limiter.threshold.value = -3; limiter.knee.value = 0; limiter.ratio.value = 20; limiter.attack.value = 0.001; limiter.release.value = 0.08;
    this.master = c.createGain(); this.master.gain.value = this.muted ? 0 : MASTER_VOL;
    this.master.connect(comp); comp.connect(limiter); limiter.connect(c.destination);
    this.sfx = c.createGain(); this.sfx.gain.value = 1; this.sfx.connect(this.master);
    this.musicBus = c.createGain(); this.musicBus.gain.value = 0.5;
    const hp = c.createBiquadFilter(); hp.type = 'highpass'; hp.frequency.value = 45;
    this.musicLP = c.createBiquadFilter(); this.musicLP.type = 'lowpass'; this.musicLP.frequency.value = 18000;
    this.musicBus.connect(hp); hp.connect(this.musicLP); this.musicLP.connect(this.master);
    const len = c.sampleRate * 2, buf = c.createBuffer(1, len, c.sampleRate), d = buf.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
    this.noise = buf;
    const curve = new Float32Array(256);
    for (let i = 0; i < 256; i++) { const x = i / 128 - 1; curve[i] = Math.tanh(x * 3.5); }
    this.distCurve = curve;
  },
  setMuted(m) {
    this.muted = m;
    if (this.master) this.master.gain.setTargetAtTime(m ? 0 : MASTER_VOL, this.ctx.currentTime, 0.05);
  },
  suspend() { if (this.ctx && this.ctx.state === 'running') this.ctx.suspend(); },
  resume() { if (this.ctx && this.ctx.state === 'suspended') this.ctx.resume(); },
  ok(name, gap) { // rate-limit a sound
    if (!this.ctx || this.muted) return false;
    const t = this.ctx.currentTime;
    if (gap && this.last[name] && t - this.last[name] < gap) return false;
    this.last[name] = t;
    return true;
  },
  at(x, y, maxD = 1400) { return { pan: panOf(x), v: 0.25 + 0.75 * volOf(x, y, maxD) }; },
  out(pan) { // stereo panner (or the bus itself) feeding the sfx bus
    const c = this.ctx;
    if (pan && isFinite(pan) && c.createStereoPanner) { const p = c.createStereoPanner(); p.pan.value = clamp(pan, -1, 1); p.connect(this.sfx); return p; }
    return this.sfx;
  },
  vary(o) { // ±6% pitch and ±2 dB so repeated sounds never sound machine-gunned
    if (o.exact || o.dest === this.musicBus) return [1, 1];
    return [1 + (Math.random() - 0.5) * 0.12, Math.pow(10, (Math.random() * 4 - 2) / 20)];
  },
  envelope(g, t, o, vol) {
    const a = o.a || 0.004;
    g.gain.setValueAtTime(0.0001, t);
    if (o.env === 'hold') { g.gain.exponentialRampToValueAtTime(vol, t + a); g.gain.setValueAtTime(vol, t + o.dur * 0.8); g.gain.exponentialRampToValueAtTime(0.0001, t + o.dur); }
    else if (o.env === 'swell') { g.gain.setValueAtTime(vol * 0.25, t); g.gain.exponentialRampToValueAtTime(vol, t + o.dur * 0.92); g.gain.exponentialRampToValueAtTime(0.0001, t + o.dur); }
    else { g.gain.exponentialRampToValueAtTime(vol, t + a); g.gain.exponentialRampToValueAtTime(0.0001, t + o.dur); }
  },
  noiseHit(o) {
    if (!this.ctx) return;
    if (o.vol !== undefined && (!(o.vol > 0.0005) || !isFinite(o.vol))) return;
    const [pv, vv] = this.vary(o);
    const c = this.ctx, t = c.currentTime + (o.delay || 0);
    const src = c.createBufferSource(); src.buffer = this.noise;
    const rate = (o.rate || 1) * pv;
    src.playbackRate.value = rate;
    const f = c.createBiquadFilter(); f.type = o.type || 'lowpass'; f.Q.value = o.q || 0.7;
    f.frequency.setValueAtTime((o.f0 || 2000) * pv, t);
    if (o.f1) f.frequency.exponentialRampToValueAtTime(o.f1 * pv, t + o.dur);
    const g = c.createGain();
    this.envelope(g, t, o, (o.vol || 0.5) * vv);
    src.connect(f); f.connect(g); g.connect(o.dest || this.out(o.pan));

  },
  tone(o) {

  },

  // --- weapons ---
  shot(kind, pan, interval, v = 1) {
    const gap = interval ? Math.min(0.045, interval * 0.8) : (kind === 'smg' ? 0.045 : 0.03);
    if (!this.ok('shot_' + kind, gap)) return;
    switch (kind) {
      case 'pistol':
        this.noiseHit({ f0: 3200, f1: 500, dur: 0.14, vol: 0.55 * v, pan });
        this.tone({ f0: 180, f1: 50, dur: 0.09, vol: 0.5 * v, pan });
        break;
      case 'shotgun':
        this.noiseHit({ f0: 2200, f1: 180, dur: 0.38, vol: 0.9 * v, pan });
        this.tone({ f0: 110, f1: 35, dur: 0.22, vol: 0.8 * v, dist: true, pan });
        this.noiseHit({ type: 'highpass', f0: 2500, dur: 0.05, vol: 0.12 * v, delay: 0.28, pan }); // pump
        this.noiseHit({ type: 'highpass', f0: 1800, dur: 0.05, vol: 0.12 * v, delay: 0.38, pan });

      case 'smg': {
        const sv = interval ? Math.min(1, Math.sqrt(0.077 / interval)) : 1; // a faster SMG shouldn't just get louder
        this.noiseHit({ type: 'bandpass', f0: 2600, f1: 900, q: 0.9, dur: 0.07, vol: 0.45 * v * sv, pan });
        this.tone({ f0: 160, f1: 70, dur: 0.05, vol: 0.3 * v * sv, pan });
        break;
      }
      case 'gunner':
        this.noiseHit({ type: 'bandpass', f0: 2300, f1: 800, q: 0.9, dur: 0.06, vol: 0.28 * v, pan });
        break;
      case 'rifle':
        this.noiseHit({ f0: 5000, f1: 400, dur: 0.18, vol: 0.6 * v, pan });
        this.tone({ f0: 140, f1: 45, dur: 0.12, vol: 0.55 * v, dist: true, pan });
        break;
    }
  },
  flameStart() {
    if (!this.ctx || this.flame) return;
    const c = this.ctx, src = c.createBufferSource(); src.buffer = this.noise; src.loop = true;
    const f = c.createBiquadFilter(); f.type = 'bandpass'; f.frequency.value = 700; f.Q.value = 0.6;
    const g = c.createGain(); g.gain.value = 0.0001; g.gain.setTargetAtTime(0.35, c.currentTime, 0.04);
    src.connect(f); f.connect(g); g.connect(this.sfx); src.start();

  },
  flameStop() {
    if (!this.flame) return;
    const fl = this.flame; this.flame = null;
    fl.g.gain.setTargetAtTime(0.0001, this.ctx.currentTime, 0.06);
    fl.src.stop(this.ctx.currentTime + 0.4);
  },
  dry() { if (this.ok('dry', 0.15)) this.noiseHit({ type: 'highpass', f0: 3500, dur: 0.03, vol: 0.25 }); },
  lowAmmo(frac) { if (this.ok('lowammo', 0.05)) this.tone({ wave: 'square', f0: 2200 + 300 * (1 - frac), dur: 0.02, vol: 0.04, exact: true }); },
  reloadStart() { if (this.ok('rl0', 0.1)) { this.noiseHit({ type: 'bandpass', f0: 1400, q: 3, dur: 0.05, vol: 0.3 }); this.tone({ wave: 'square', f0: 300, f1: 200, dur: 0.03, vol: 0.05 }); } },
  reloadEnd() { if (this.ok('rl1', 0.1)) { this.noiseHit({ type: 'bandpass', f0: 2200, q: 4, dur: 0.04, vol: 0.35 }); this.noiseHit({ type: 'bandpass', f0: 1200, q: 3, dur: 0.06, vol: 0.3, delay: 0.08 }); } },
  reloadTick() { if (this.ok('rltick', 0.3)) this.tone({ wave: 'sine', f0: 1000, dur: 0.03, vol: 0.08, exact: true }); },
  swap() { if (this.ok('swap', 0.08)) this.noiseHit({ type: 'bandpass', f0: 1600, q: 2, dur: 0.06, vol: 0.2 }); },

  // --- impacts ---
  hit(pan, v = 1) { if (this.ok('hit', 0.035)) { this.noiseHit({ type: 'bandpass', f0: 500 + rand(300), q: 1.2, dur: 0.08, vol: 0.35 * v, pan }); this.tone({ f0: 220, f1: 90, dur: 0.07, vol: 0.18 * v, pan }); } },
  crit(pan, v = 1) { if (this.ok('crit', 0.05)) this.tone({ wave: 'triangle', f0: 1400, f1: 700, dur: 0.08, vol: 0.12 * v, pan }); },
  splat(pan, big, v = 1) {
    if (!this.ok('splat', 0.04)) return;

    this.tone({ f0: big ? 120 : 180, f1: 40, dur: big ? 0.25 : 0.12, vol: (big ? 0.4 : 0.22) * v, pan });
  },
  boom(pan, size = 1, v = 1) {
    if (!this.ok('boom', 0.06)) return;

  groan(pan, vol, pitch = 1) {

  windup(pan, v = 1) { // rammer rearing up

  },
  slamTele(dur, pan) {
    this.tone({ wave: 'sawtooth', f0: 50, f1: 90, dur, vol: 0.35, lp: 500, dist: true, env: 'swell', pan });

  },
  giantThrow(pan) { this.tone({ wave: 'sawtooth', f0: 80, f1: 170, dur: 0.5, vol: 0.3, lp: 900, dist: true, env: 'swell', pan }); },
  roar(pan) {
    if (!this.ok('roar', 0.8)) return;

    this.tone({ wave: 'sawtooth', f0: 104, f1: 55, dur: 1.5, vol: 0.4, dist: true, lp: 700, pan, env: 'hold' });

  stomp(pan, v = 1) {

  plane(pan, v) { if (this.ok('plane', 1.2)) this.noiseHit({ f0: 300, f1: 200, dur: 1.4, vol: 0.2 * v, a: 0.4, pan }); },

  // --- player / ui ---
  hurt() {

    this.noiseHit({ f0: 1500, f1: 300, dur: 0.15, vol: 0.3 });
  },
  dash() { if (this.ok('dash', 0.1)) this.noiseHit({ type: 'bandpass', f0: 600, f1: 2400, q: 1.5, dur: 0.22, vol: 0.35 }); },
  xp(combo) {

  for (const t of e.changedTouches) {
    Touch.ids.delete(t.identifier);
    for (const s of [Touch.move, Touch.aim]) if (s.id === t.identifier) { s.id = null; s.dx = s.dy = 0; }
  }
  if (e.type === 'touchend') { // touchend counts as a user gesture: unlock audio / fullscreen here
    if (G.state !== 'paused') Sound.init();
    if (Touch.wantFS) { Touch.wantFS = false; toggleFullscreen(); }
  }
}
canvas.addEventListener('touchend', touchEnd);
canvas.addEventListener('touchcancel', touchEnd);

// World grid + procedural town
// ---------------------------------------------------------------------
const TILE = 20, MT = 160, WORLD = TILE * MT;          // 3200 x 3200 px world
const BLOCK = 400, STREET = 160, BORDER = 120;
const blockX = i => BORDER + STREET + i * (BLOCK + STREET);
const solid = new Uint8Array(MT * MT);                 // 0 free, 1 building, 2 prop, 3 fence/wall, 4 trunk, 9 border
const tileAt = (x, y) => { const tx = Math.floor(x / TILE), ty = Math.floor(y / TILE); return (tx < 0 || ty < 0 || tx >= MT || ty >= MT) ? 9 : solid[ty * MT + tx]; };
const isSolidT = (tx, ty) => (tx < 0 || ty < 0 || tx >= MT || ty >= MT) ? true : solid[ty * MT + tx] !== 0;

const Town = {
  ground: null, gctx: null,
  buildings: [], props: [], fences: [], trees: [], lamps: [], parks: [], blocks: [], barrelSpots: [],
  occluders: [], start: { x: WORLD / 2, y: WORLD / 2 },
};

function fillSolid(x, y, w, h, v) {
  const x0 = Math.floor(x / TILE), y0 = Math.floor(y / TILE), x1 = Math.ceil((x + w) / TILE), y1 = Math.ceil((y + h) / TILE);
  for (let ty = Math.max(0, y0); ty < Math.min(MT, y1); ty++) for (let tx = Math.max(0, x0); tx < Math.min(MT, x1); tx++) solid[ty * MT + tx] = v;
}
function rectFree(x, y, w, h) {
  const x0 = Math.floor(x / TILE), y0 = Math.floor(y / TILE), x1 = Math.ceil((x + w) / TILE), y1 = Math.ceil((y + h) / TILE);
  for (let ty = y0; ty < y1; ty++) for (let tx = x0; tx < x1; tx++) if (isSolidT(tx, ty)) return false;
  return true;
}

// --- sprite painters for static things ---------------------------------
const ROOFS = [
  { base: '#7a3b32', line: '#5e2b24', ridge: '#94493e' },  // red shingles
  { base: '#4a4f58', line: '#3a3e45', ridge: '#5d636d' },  // slate
  { base: '#6b5540', line: '#54422f', ridge: '#7f6650' },  // brown
  { base: '#3f5560', line: '#31434c', ridge: '#4e6873' },  // blue-grey
  { base: '#5c6048', line: '#484b37', ridge: '#6e7357' },  // olive
];
function paintBuilding(b, rng) {
  const c = makeCanvas(b.w, b.h), g = c.getContext('2d');
  const wall = 12; // south wall face height (inside footprint)
  const roofH = b.h - wall;
  if (b.kind === 'flat') {
    g.fillStyle = b.pal.base; g.fillRect(0, 0, b.w, roofH);
    for (let i = 0; i < b.w * b.h / 60; i++) { g.fillStyle = rng() < 0.5 ? 'rgba(0,0,0,0.06)' : 'rgba(255,255,255,0.04)'; g.fillRect(rng() * b.w, rng() * roofH, 2 + rng() * 3, 2 + rng() * 3); }
    g.strokeStyle = 'rgba(0,0,0,0.35)'; g.lineWidth = 4; g.strokeRect(2, 2, b.w - 4, roofH - 4);
    g.strokeStyle = 'rgba(255,255,255,0.08)'; g.lineWidth = 1; g.strokeRect(6, 6, b.w - 12, roofH - 12);
    const units = 1 + Math.floor(b.w * b.h / 16000);
    for (let i = 0; i < units; i++) { // AC units / vents
      const uw = 18 + rng() * 16, uh = 14 + rng() * 10, ux = 12 + rng() * (b.w - uw - 24), uy = 12 + rng() * (roofH - uh - 24);
      g.fillStyle = 'rgba(0,0,0,0.3)'; g.fillRect(ux + 3, uy + 3, uw, uh);
      g.fillStyle = '#8d9296'; g.fillRect(ux, uy, uw, uh);
      g.fillStyle = '#6d7276'; g.fillRect(ux + 2, uy + 2, uw - 4, uh - 4);
      g.strokeStyle = '#555a5e'; g.lineWidth = 1;
      for (let k = 4; k < uw - 3; k += 3) { g.beginPath(); g.moveTo(ux + k, uy + 3); g.lineTo(ux + k, uy + uh - 3); g.stroke(); }
    }
    if (rng() < 0.6) { g.fillStyle = '#2b2e32'; g.beginPath(); g.arc(b.w * (0.2 + rng() * 0.6), roofH * (0.2 + rng() * 0.6), 5, 0, TAU); g.fill(); }
  } else { // gable roof, ridge along the long axis
    const horiz = b.w >= roofH;
    g.fillStyle = b.pal.base; g.fillRect(0, 0, b.w, roofH);
    // shingle rows
    g.strokeStyle = b.pal.line; g.lineWidth = 1;
    if (horiz) {
      for (let y = 4; y < roofH; y += 6) { g.beginPath(); g.moveTo(0, y + 0.5); g.lineTo(b.w, y + 0.5); g.stroke(); for (let x = (y / 6 % 2) * 5; x < b.w; x += 10) { g.beginPath(); g.moveTo(x + 0.5, y); g.lineTo(x + 0.5, y + 6); g.stroke(); } }
      g.fillStyle = 'rgba(255,255,255,0.10)'; g.fillRect(0, 0, b.w, roofH / 2);           // lit north slope
      g.fillStyle = 'rgba(0,0,0,0.16)'; g.fillRect(0, roofH / 2, b.w, roofH / 2);        // shaded south slope
      g.fillStyle = b.pal.ridge; g.fillRect(0, roofH / 2 - 2, b.w, 4);
    } else {
      for (let x = 4; x < b.w; x += 6) { g.beginPath(); g.moveTo(x + 0.5, 0); g.lineTo(x + 0.5, roofH); g.stroke(); for (let y = (x / 6 % 2) * 5; y < roofH; y += 10) { g.beginPath(); g.moveTo(x, y + 0.5); g.lineTo(x + 6, y + 0.5); g.stroke(); } }
      g.fillStyle = 'rgba(255,255,255,0.10)'; g.fillRect(0, 0, b.w / 2, roofH);
      g.fillStyle = 'rgba(0,0,0,0.16)'; g.fillRect(b.w / 2, 0, b.w / 2, roofH);
      g.fillStyle = b.pal.ridge; g.fillRect(b.w / 2 - 2, 0, 4, roofH);
    }
    if (rng() < 0.7) { // chimney
      const cx = 14 + rng() * (b.w - 36), cy = 10 + rng() * (roofH - 32);
      g.fillStyle = 'rgba(0,0,0,0.35)'; g.fillRect(cx + 4, cy + 4, 14, 14);
      g.fillStyle = '#6e4a3c'; g.fillRect(cx, cy, 14, 14); g.fillStyle = '#2a1d18'; g.fillRect(cx + 3, cy + 3, 8, 8);
    }
    g.strokeStyle = 'rgba(0,0,0,0.45)'; g.lineWidth = 2; g.strokeRect(1, 1, b.w - 2, roofH - 2);
  }
  // south wall face with windows + door
  g.fillStyle = b.wall; g.fillRect(0, roofH, b.w, wall);
  g.fillStyle = 'rgba(0,0,0,0.25)'; g.fillRect(0, roofH, b.w, 2);
  const doorX = b.w * (0.3 + rng() * 0.4);
  for (let x = 10; x < b.w - 14; x += 22) {
    if (Math.abs(x + 6 - doorX) < 14) continue;
    g.fillStyle = '#1d2a33'; g.fillRect(x, roofH + 3, 12, 6);
    g.fillStyle = 'rgba(160,200,220,0.25)'; g.fillRect(x, roofH + 3, 12, 2);
  }
  g.fillStyle = '#3b2a1f'; g.fillRect(doorX - 6, roofH + 2, 12, wall - 2);
  if (rng() < 0.5) { g.strokeStyle = 'rgba(120,20,20,0.8)'; g.lineWidth = 2; g.beginPath(); g.moveTo(doorX - 5, roofH + 3); g.lineTo(doorX + 5, roofH + wall - 1); g.moveTo(doorX + 5, roofH + 3); g.lineTo(doorX - 5, roofH + wall - 1); g.stroke(); } // boarded X
  return c;
}
const CAR_COLORS = ['#8e2d2d', '#2d4f8e', '#c9c3b3', '#3d3d42', '#6b7a3a', '#9a6a2a', '#5a2d6b', '#2e6b64'];
function paintCar(len, wid, color, wrecked, rng) { // drawn facing +x
  const pad = 6, c = makeCanvas(len + pad * 2, wid + pad * 2), g = c.getContext('2d');
  g.translate(pad, pad);
  g.fillStyle = 'rgba(0,0,0,0.35)'; roundRect(g, 3, 4, len, wid, 8); g.fill();
  g.fillStyle = '#151515'; // tires
  g.fillRect(len * 0.14, -2, 14, 5); g.fillRect(len * 0.14, wid - 3, 14, 5); g.fillRect(len * 0.72, -2, 14, 5); g.fillRect(len * 0.72, wid - 3, 14, 5);
  g.fillStyle = color; roundRect(g, 0, 0, len, wid, 8); g.fill();
  g.fillStyle = 'rgba(255,255,255,0.14)'; roundRect(g, 2, 2, len - 4, wid * 0.4, 6); g.fill();
  g.fillStyle = 'rgba(0,0,0,0.18)'; roundRect(g, 2, wid * 0.6, len - 4, wid * 0.38, 6); g.fill();
  // cabin + glass
  g.fillStyle = '#1b2530'; roundRect(g, len * 0.28, 4, len * 0.44, wid - 8, 5); g.fill();
  g.fillStyle = shade(color, -0.15); roundRect(g, len * 0.36, 6, len * 0.26, wid - 12, 3); g.fill();
  g.fillStyle = 'rgba(150,190,210,0.35)'; g.fillRect(len * 0.66, 6, 4, wid - 12); g.fillRect(len * 0.3, 6, 3, wid - 12);
  // lights
  g.fillStyle = '#f5e7a1'; g.fillRect(len - 3, 4, 3, 6); g.fillRect(len - 3, wid - 10, 3, 6);
  g.fillStyle = '#7a1c1c'; g.fillRect(0, 4, 3, 6); g.fillRect(0, wid - 10, 3, 6);
  if (wrecked) {
    g.save(); roundRect(g, 0, 0, len, wid, 8); g.clip();
    for (let i = 0; i < 3; i++) { // soft soot / burn marks, kept on the car body
      const sx = len * (0.6 + rng() * 0.35), sy = wid * (0.2 + rng() * 0.6), sr = 8 + rng() * 10;
      const gr = g.createRadialGradient(sx, sy, 0, sx, sy, sr); gr.addColorStop(0, 'rgba(15,10,8,0.6)'); gr.addColorStop(1, 'rgba(15,10,8,0)');
      g.fillStyle = gr; g.fillRect(sx - sr, sy - sr, sr * 2, sr * 2);
    }
    g.strokeStyle = 'rgba(0,0,0,0.35)'; g.lineWidth = 1.2;
    for (let i = 0; i < 2; i++) { const x = len * (0.1 + rng() * 0.8); g.beginPath(); g.moveTo(x, 1); g.lineTo(x + rng() * 8 - 4, wid * 0.35); g.stroke(); }
    g.restore();
    g.strokeStyle = 'rgba(220,230,235,0.5)'; g.lineWidth = 1;
    for (let i = 0; i < 5; i++) { const x = len * (0.3 + rng() * 0.4), y = 5 + rng() * (wid - 10); g.beginPath(); g.moveTo(x, y); g.lineTo(x + rng() * 10 - 5, y + rng() * 10 - 5); g.stroke(); }
  }
  return c;
}
function roundRect(g, x, y, w, h, r) {
  g.beginPath(); g.moveTo(x + r, y); g.arcTo(x + w, y, x + w, y + h, r); g.arcTo(x + w, y + h, x, y + h, r);
  g.arcTo(x, y + h, x, y, r); g.arcTo(x, y, x + w, y, r); g.closePath();
}
function paintTree(r, rng, tint) {
  const s = Math.ceil(r * 2 + 8), c = makeCanvas(s, s), g = c.getContext('2d'), m = s / 2;
  const cols = tint ? ['#1f3a1f', '#2c4d27', '#3a6130', '#4b7439'] : ['#1c331f', '#284629', '#355a31', '#44703b'];
  for (let layer = 0; layer < 4; layer++) {
    const n = 7 + layer * 2, rr = r * (1 - layer * 0.2);
    g.fillStyle = cols[layer];
    for (let i = 0; i < n; i++) {
      const a = rng() * TAU, d = rng() * rr * 0.55;
      g.beginPath(); g.arc(m + Math.cos(a) * d - layer * 1.5, m + Math.sin(a) * d - layer * 1.5, rr * (0.35 + rng() * 0.25), 0, TAU); g.fill();
    }
  }
  g.fillStyle = 'rgba(255,255,230,0.07)'; g.beginPath(); g.arc(m - r * 0.3, m - r * 0.3, r * 0.45, 0, TAU); g.fill();
  return c;
}

// --- town generation -----------------------------------------------------
function generateTown(seed, depth = 0) {
  const rng = mulberry32(seed);
  solid.fill(0);
  Object.assign(Town, { buildings: [], props: [], fences: [], trees: [], lamps: [], parks: [], blocks: [], barrelSpots: [], occluders: [] });
  // border forest
  fillSolid(0, 0, WORLD, BORDER, 9); fillSolid(0, WORLD - BORDER, WORLD, BORDER, 9);
  fillSolid(0, 0, BORDER, WORLD, 9); fillSolid(WORLD - BORDER, 0, BORDER, WORLD, 9);

  // block kinds
  // online every device must build the same town from the seed: a plain seeded shuffle and seeded colours
  // (sort with a random comparator gives different orders in different browsers)
  const pk = Town.portable ? arr => arr[(rng() * arr.length) | 0] : pick;
  const kinds = new Array(25).fill('houses');
  kinds[12] = 'plaza';
  const cand = [0, 1, 3, 4, 5, 9, 15, 19, 20, 21, 23, 24, 2, 10, 14, 22];
  let shuffled;
  if (Town.portable) { shuffled = cand.slice(); for (let i = shuffled.length - 1; i > 0; i--) { const j = (rng() * (i + 1)) | 0; [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]]; } }
  else shuffled = cand.slice().sort(() => rng() - 0.5);
  const far = shuffled.filter(i => { const bx = i % 5, by = (i / 5) | 0; return Math.abs(bx - 2) + Math.abs(by - 2) >= 3; });
  kinds[far[0]] = 'park'; kinds[far[1]] = 'park';
  const rest = shuffled.filter(i => kinds[i] === 'houses');
  kinds[rest[0]] = 'lot'; kinds[rest[1]] = 'gas'; kinds[rest[2]] = 'warehouse'; kinds[rest[3]] = 'compound'; kinds[rest[4]] = 'park';
  const inner = [6, 7, 8, 11, 13, 16, 17, 18].filter(i => kinds[i] === 'houses');
  if (inner.length) kinds[inner[(rng() * inner.length) | 0]] = 'lot2';

  for (let by = 0; by < 5; by++) for (let bx = 0; bx < 5; bx++) {
    const kind = kinds[by * 5 + bx], x = blockX(bx), y = blockX(by);
    const blk = { kind, x, y, w: BLOCK, h: BLOCK, cx: x + BLOCK / 2, cy: y + BLOCK / 2 };
    Town.blocks.push(blk);
    if (kind === 'park' || kind === 'plaza') Town.parks.push(blk);
  }

  const addBuilding = (x, y, w, h, kind, palIdx) => {
    const b = { x, y, w, h, kind, pal: ROOFS[palIdx !== undefined ? palIdx : (rng() * ROOFS.length) | 0], wall: pk(['#b9a88f', '#9d8f7b', '#a3a8ab', '#c2b59b', '#8f7d6a']) };
    b.canvas = paintBuilding(b, rng);
    Town.buildings.push(b); Town.occluders.push(b); fillSolid(x, y, w, h, 1);
    return b;
  };
  const addCar = (x, y, vertical, wrecked, color) => {
    const len = 96, wid = 44;
    const w = vertical ? wid : len, h = vertical ? len : wid;
    if (!rectFree(x, y, w, h)) return null;
    const p = { type: 'car', x, y, w, h, vertical, canvas: paintCar(len, wid, color || pk(CAR_COLORS), wrecked, rng), flip: rng() < 0.5 };
    Town.props.push(p); fillSolid(x + 2, y + 2, w - 4, h - 4, 2);
    return p;
  };
  const addTree = (x, y, r) => {
    if (tileAt(x, y) !== 0) return;
    Town.trees.push({ x, y, r, canvas: paintTree(r, rng, rng() < 0.5), fade: 1 });
    fillSolid(x - 8, y - 8, 16, 16, 4);
  };
  const addFence = (x, y, len, vertical, gapAt, gapLen = 60, style = 'wood') => {
    // splits into segments leaving a gap
    const segs = gapAt === undefined ? [[0, len]] : [[0, gapAt], [gapAt + gapLen, len]];
    for (const [a, b] of segs) {
      if (b - a < 20) continue;
      const f = vertical ? { x, y: y + a, w: 20, h: b - a, vertical, style } : { x: x + a, y, w: b - a, h: 20, vertical, style };
      Town.fences.push(f); fillSolid(f.x, f.y, f.w, f.h, 3);
    }
  };

  for (const blk of Town.blocks) {
    const { x, y, kind } = blk;
    if (kind === 'houses') {
      const split = rng() < 0.5 ? 'q' : 'h';
      const lots = split === 'q' ? [[0, 0], [200, 0], [0, 200], [200, 200]].map(([ox, oy]) => [x + ox, y + oy, 200, 200])
        : [[x, y, 400, 200], [x, y + 200, 400, 200]];
      for (const [lx, ly, lw, lh] of lots) {
        const bw = Math.min(lw - 60, 20 * Math.floor((100 + rng() * (lw === 400 ? 160 : 60)) / 20));
        const bh = 20 * Math.floor((100 + rng() * 40) / 20);
        const bx = lx + 20 * Math.floor((20 + rng() * (lw - bw - 40)) / 20);
        const byy = ly + 20 * Math.floor((20 + rng() * (lh - bh - 40)) / 20);
        addBuilding(bx, byy, bw, bh, rng() < 0.75 ? 'gable' : 'flat');
        // yard trees
        for (let i = 0; i < 2; i++) if (rng() < 0.55) addTree(lx + 20 + rng() * (lw - 40), ly + 20 + rng() * (lh - 40), 22 + rng() * 12);
      }
      // backyard fences with gaps (chokepoints)
      if (split === 'h') addFence(x + 20, y + 180, 360, false, 60 + 20 * Math.floor(rng() * 12), 60);
      else { addFence(x + 180, y + 20, 360, true, 40 + 20 * Math.floor(rng() * 13), 60); if (rng() < 0.5) addFence(x + 20, y + 180, 160, false, 60, 60); }
    } else if (kind === 'plaza') {
      Town.start = { x: blk.cx, y: blk.cy + 40 };
      // planters in corners + a monument
      for (const [ox, oy] of [[60, 60], [300, 60], [60, 300], [300, 300]]) { addTree(x + ox + 20, y + oy + 20, 26); }
      fillSolid(blk.cx - 20, blk.cy - 60, 40, 40, 2);
      Town.props.push({ type: 'statue', x: blk.cx - 20, y: blk.cy - 60, w: 40, h: 40 });
      for (const [ox, oy, v] of [[150, 40, false], [150, 340, false], [40, 170, true], [340, 170, true]]) {
        Town.props.push({ type: 'bench', x: x + ox, y: y + oy, w: v ? 20 : 60, h: v ? 60 : 20, vertical: v });
        fillSolid(x + ox, y + oy, v ? 20 : 60, v ? 60 : 20, 2);
      }
    } else if (kind === 'park') {
      const n = 5 + ((rng() * 4) | 0);
      for (let i = 0; i < n; i++) {
        const a = rng() * TAU, d = 120 + rng() * 60;
        addTree(blk.cx + Math.cos(a) * d, blk.cy + Math.sin(a) * d, 24 + rng() * 14);
      }
      Town.props.push({ type: 'bench', x: x + 170, y: y + 30, w: 60, h: 20 }); fillSolid(x + 170, y + 30, 60, 20, 2);
    } else if (kind === 'lot' || kind === 'lot2') {
      for (let row = 0; row < 3; row++) for (let col = 0; col < 7; col++) {
        if (rng() < 0.45) continue;
        addCar(x + 22 + col * 52, y + 30 + row * 130, true, rng() < 0.4);
      }
    } else if (kind === 'gas') {
      addBuilding(x + 240, y + 40, 140, 120, 'flat', 1);
      for (const [ox, oy] of [[80, 220], [180, 220]]) { Town.props.push({ type: 'pump', x: x + ox, y: y + oy, w: 20, h: 40 }); fillSolid(x + ox, y + oy, 20, 40, 2); }
      Town.props.push({ type: 'canopy', x: x + 40, y: y + 190, w: 220, h: 100 });
      for (let i = 0; i < 6; i++) Town.barrelSpots.push({ x: x + 40 + (i % 3) * 30 + rng() * 8, y: y + 330 + ((i / 3) | 0) * 30 });
    } else if (kind === 'warehouse') {
      addBuilding(x + 40, y + 60, 320, 200, 'flat', 3);
      for (let i = 0; i < 4; i++) Town.props.push({ type: 'crateStack', x: x + 50 + i * 80, y: y + 300, w: 40, h: 40 }), fillSolid(x + 50 + i * 80, y + 300, 40, 40, 2);
      Town.barrelSpots.push({ x: x + 30, y: y + 370 }, { x: x + 370, y: y + 30 });
    } else if (kind === 'compound') {
      // walled yard with two gates, small building inside: a defendable spot
      addFence(x + 20, y + 20, 360, false, 150, 60, 'wall');
      addFence(x + 20, y + 360, 360, false, 150, 60, 'wall');
      addFence(x + 20, y + 40, 320, true, undefined, 0, 'wall');
      addFence(x + 360, y + 40, 320, true, undefined, 0, 'wall');
      addBuilding(x + 140, y + 120, 120, 100, 'flat', 4);
      Town.barrelSpots.push({ x: x + 80, y: y + 300 }, { x: x + 320, y: y + 300 });
    }
  }

  // streets: wrecked cars, barricades, lamps
  const streetsX = [], streetsY = [];
  for (let i = 0; i <= 5; i++) { streetsX.push(BORDER + i * (BLOCK + STREET)); streetsY.push(BORDER + i * (BLOCK + STREET)); }
  for (let i = 0; i <= 5; i++) for (let j = 0; j < 5; j++) {
    // vertical street segment i between blocks j (x = streetsX[i], y from blockX(j) to +BLOCK)
    const sx = streetsX[i], sy = blockX(j);
    if (rng() < 0.55) addCar(sx + (rng() < 0.5 ? 20 : 96), sy + 40 + rng() * 260, true, true);
    if (rng() < 0.12) { const bx = sx + 20, by = sy + 150; if (rectFree(bx, by, 80, 20)) { Town.props.push({ type: 'barrier', x: bx, y: by, w: 80, h: 20 }); fillSolid(bx, by, 80, 20, 2); } }
    // horizontal street segment
    const hx = blockX(j), hy = streetsY[i];
    if (rng() < 0.55) addCar(hx + 40 + rng() * 260, hy + (rng() < 0.5 ? 20 : 96), false, true);
    if (rng() < 0.12) { const bx = hx + 150, by = hy + 60; if (rectFree(bx, by, 20, 80)) { Town.props.push({ type: 'barrier', x: bx, y: by, w: 20, h: 80, vertical: true }); fillSolid(bx, by, 20, 80, 2); } }
  }
  for (let j = 0; j < 5; j++) for (let i = 0; i < 5; i++) {
    const blk = Town.blocks[j * 5 + i];
    for (const [ox, oy] of [[-8, -8], [BLOCK + 8, BLOCK + 8]]) Town.lamps.push({ x: blk.x + ox, y: blk.y + oy, flicker: rng() < 0.3, phase: rng() * 100, broken: rng() < 0.12 });
  }
  // scattered barrels on sidewalks

    const y0 = clamp(((y - r) / CELL) | 0, 0, GW - 1), y1 = clamp(((y + r) / CELL) | 0, 0, GW - 1);
    for (let cy = y0; cy <= y1; cy++) for (let cx = x0; cx <= x1; cx++) {
      for (let i = this.head[cy * GW + cx]; i !== -1; i = this.next[i]) { const z = this.list[i]; if (!z.dead && fn(z) === true) return; }
    }
  },
};

// ---------------------------------------------------------------------
// Visibility polygon (buildings cast shadows for the flashlight)
// ---------------------------------------------------------------------
function visibilityPolygon(px, py, R) {
  const segs = [];
  const add = (ax, ay, bx, by) => segs.push(ax, ay, bx, by);
  const L = px - R, T = py - R, Rr = px + R, B = py + R;
  add(L, T, Rr, T); add(Rr, T, Rr, B); add(Rr, B, L, B); add(L, B, L, T);
  const pts = [];
  for (const b of Town.occluders) {
    if (b.x > Rr || b.x + b.w < L || b.y > B || b.y + b.h < T) continue;
    const x0 = b.x + 1, y0 = b.y + 1, x1 = b.x + b.w - 1, y1 = b.y + b.h - 1;
    add(x0, y0, x1, y0); add(x1, y0, x1, y1); add(x1, y1, x0, y1); add(x0, y1, x0, y0);
    pts.push(x0, y0, x1, y0, x1, y1, x0, y1);
  }
  pts.push(L, T, Rr, T, Rr, B, L, B);
  const angles = [];
  for (let i = 0; i < pts.length; i += 2) {
    const a = Math.atan2(pts[i + 1] - py, pts[i] - px);
    angles.push(a - 0.0004, a, a + 0.0004);
  }
  for (let i = 0; i < 24; i++) angles.push(-Math.PI + i * TAU / 24);
  angles.sort((a, b) => a - b);
  const out = [];
  const n = segs.length;
  for (const a of angles) {
    const dx = Math.cos(a), dy = Math.sin(a);
    let best = Infinity;
    for (let s = 0; s < n; s += 4) {
      const sx = segs[s], sy = segs[s + 1], ex = segs[s + 2] - sx, ey = segs[s + 3] - sy;
      const den = dx * ey - dy * ex;
      if (Math.abs(den) < 1e-9) continue;
      const t = ((sx - px) * ey - (sy - py) * ex) / den;
      const u = ((sx - px) * dy - (sy - py) * dx) / den;
      if (t > 0 && u >= 0 && u <= 1 && t < best) best = t;
    }
    if (best < Infinity) out.push(px + dx * best, py + dy * best);
  }
  return out;
}

function buildZombieSprites() {
  for (const type in ZPAINT) {
    const def = ZTYPES[type];
    const ext = def.r * 2 + (type === 'knot' || type === 'giant' ? 34 : 20);
    const S = Math.ceil(ext * SPR);
    const variants = ZVARIANTS[type] || 1;
    const set = [];
    for (let v = 0; v < variants; v++) {
      const frames = [];
      for (const f of [-1, 0, 1]) {
        const c = makeCanvas(S, S), g = c.getContext('2d');
        g.setTransform(SPR, 0, 0, SPR, S / 2, S / 2);
        ZPAINT[type](g, f, v);
        frames.push(c);
      }
      set.push(frames);
    }
    const tint = (col) => { const c = makeCanvas(S, S), g = c.getContext('2d'); g.drawImage(set[0][1], 0, 0); g.globalCompositeOperation = 'source-atop'; g.fillStyle = col; g.fillRect(0, 0, S, S); return c; };
    const corpse = makeCanvas(S, S), cg = corpse.getContext('2d');
    cg.drawImage(set[0][1], 0, 0); cg.globalCompositeOperation = 'source-atop'; cg.fillStyle = 'rgba(38,22,18,0.62)'; cg.fillRect(0, 0, S, S);
    Sprites.zombie[type] = { set, flash: tint('#ffffff'), burn: tint('#ff7a1a'), gold: tint('#ffd24a'), corpse, size: ext };
  }
}

const PMAX = 2000;
const parts = [];
for (let i = 0; i < PMAX; i++) parts.push({ on: false });
let partNext = 0;
function spawnPart(o) {
  let p = null;
  for (let k = 0; k < 8; k++) { const q = parts[partNext]; partNext = (partNext + 1) % PMAX; if (!q.on) { p = q; break; } }
  if (!p) { p = parts[partNext]; partNext = (partNext + 1) % PMAX; } // recycle oldest-ish
  p.on = true; p.x = o.x; p.y = o.y; p.vx = o.vx || 0; p.vy = o.vy || 0; p.z = o.z || 0; p.vz = o.vz || 0;
  p.life = p.max = o.life || 0.5; p.size = o.size || 2; p.col = o.col || '#fff'; p.type = o.type || 'spark';
  p.drag = o.drag !== undefined ? o.drag : 3; p.grav = o.grav || 0; p.rot = o.rot || 0; p.vr = o.vr || 0; p.bounces = o.bounces || 0;
  p.grow = o.grow || 0; p.add = !!o.add;
  return p;
}
function bloodBurst(x, y, dirA, n, spreadA = 0.5, spd = 160, col) {
  if (G.zombies.length >= 250) n = Math.ceil(n / 2);
  for (let i = 0; i < n; i++) {
    const a = dirA + (Math.random() - 0.5) * spreadA, s = spd * (0.5 + Math.random() * 0.9);
    spawnPart({ type: 'blood', x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, z: 4, vz: 60 + Math.random() * 80, grav: 400, life: 1.2, size: 1.5 + Math.random() * 2.2, drag: 2.5, col: col || pick(['#7a0c0c', '#8f1111', '#5e0a0a', '#a01818']) });
  }
}
function sparks(x, y, a, n, col = '#ffd68a') {
  for (let i = 0; i < n; i++) { const d = a + Math.PI + (Math.random() - 0.5) * 1.6, s = 120 + Math.random() * 260; spawnPart({ type: 'spark', x, y, vx: Math.cos(d) * s, vy: Math.sin(d) * s, life: 0.12 + Math.random() * 0.15, size: 1.5, col, drag: 6, add: true }); }
}
function smokePuff(x, y, n = 1, col = 'rgba(60,60,60,', size = 10, life = 1.2) {

const isActive = p => !p.dead && !p.down && !p.away && !p.boarding;
function activePlayers() { return G.players.filter(isActive); }
function targetPlayer(x, y) { // nearest active player (zombies chase them); falls back to the local player
  let best = null, bd = Infinity;
  for (const p of G.players) { if (!isActive(p)) continue; const d = dist2(x, y, p.x, p.y); if (d < bd) { bd = d; best = p; } }
  return best || G.P;
}
function randomActive() { const a = activePlayers(); return a.length ? a[(Math.random() * a.length) | 0] : G.P; }

function pressure() { return G.online ? 1 + 0.6 * Math.max(0, activePlayers().length - 1) : 1; }
function wStat(P, id) { // effective weapon stats with cards applied
  const w = WEAPONS[id], ws = P.weapons[id], st = P.st;
  const mast = 1 + 0.2 * ws.mastery;
  return {
    mag: Math.round(w.mag * st.magMul * (1 + 0.2 * ws.mastery)),
    reserveMax: w.reserve === Infinity ? Infinity : Math.round(w.reserve * st.reserveMul),
    dmg: w.dmg * st.dmgMul * mast,
    rate: (w.rate || w.tick) * st.rateMul,
    reload: w.reload * st.reloadMul,

}
function giveWeapon(P, id) {
  const ws = P.weapons[id], es = wStat(P, id);
  ws.owned = true; ws.mag = es.mag; ws.reserve = es.reserveMax;
  switchWeapon(P, id, true);
}
function switchWeapon(P, id, force) {
  if (!P.weapons[id] || !P.weapons[id].owned || (P.cur === id && !force)) return;
  if (P.cur !== id) P.last = P.cur;
  P.cur = id; P.swapT = 0.2; P.reloading = false; P.jam = 0; P.bloom = 0; P.spin = 0;
  if (P.flaming) { P.flaming = false; Sound.flameStop(); }
  Sound.swap();
}
function cycleWeapon(P, dir) {
  const owned = WORDER.filter(id => P.weapons[id].owned);
  const i = owned.indexOf(P.cur);
  switchWeapon(P, owned[(i + dir + owned.length) % owned.length]);
}
function startReload(P) {
  const w = WEAPONS[P.cur], ws = P.weapons[P.cur], es = wStat(P, P.cur);
  if (P.reloading || ws.mag >= es.mag) return;
  if (ws.reserve <= 0 && w.reserve !== Infinity) return;
  P.reloading = true; P.activeTried = false; P.reloadStartT = G.t;
  P.reloadTotal = P.reloadT = es.reload;
  if (!w.shells) Sound.reloadStart();
  if (w.active) G.reloadHints = (G.reloadHints || 0) + 1;
}
function finishReload(P, perfect) {
  const w = WEAPONS[P.cur], ws = P.weapons[P.cur], es = wStat(P, P.cur);
  const need = Math.ceil(es.mag - ws.mag);
  const take = w.reserve === Infinity ? need : Math.min(need, Math.floor(ws.reserve));
  ws.mag = Math.min(es.mag, Math.round(ws.mag + take)); if (w.reserve !== Infinity) ws.reserve -= take;
  P.reloading = false; ws.gold = !!perfect;
  if (perfect) { Sound.tone({ f0: 1800, dur: 0.18, vol: 0.18 }); floater(P.x, P.y - 24, 'PERFECT', '#ffd24a', 13); }
  Sound.reloadEnd();
}
function tryActiveReload(P) {
  const w = WEAPONS[P.cur];
  if (!P.reloading || !w.active || P.activeTried) return false;
  const p = 1 - P.reloadT / P.reloadTotal;
  if (p < 0.3 || G.t - (P.reloadStartT || -9) < 0.25) return true; // early / reflex taps are harmless
  P.activeTried = true;
  if (p >= 0.55 && p <= 0.70) finishReload(P, true);

  return true;
}

function updatePlayer(P, dt) {

  // --- movement ---
  let mx = 0, my = 0;
  if (keys.KeyW || keys.ArrowUp) my -= 1; if (keys.KeyS || keys.ArrowDown) my += 1;
  if (keys.KeyA || keys.ArrowLeft) mx -= 1; if (keys.KeyD || keys.ArrowRight) mx += 1;
  const tv = Touch.on ? touchMoveVec() : null;
  if (tv) { mx = tv[0]; my = tv[1]; }
  if (G.botInput) { mx = G.botInput.mx; my = G.botInput.my; }
  const ml = Math.hypot(mx, my); if (ml > 1) { mx /= ml; my /= ml; } // keys give 1 or √2; the touch stick is analog (≤ 1)

  const firing = (mouse.down || (G.botInput && G.botInput.fire)) && P.swapT <= 0 && !P.down && !G.modal && !G.menu;
  P.rushT = (P.rushT || 0) - dt;

    if (G.frame % 2 === 0) G.afterimages.push({ x: P.x, y: P.y, a: P.angle, t: 0.25 });
    Grid.query(P.x, P.y, 60, z => {
      if (P.dashHit.has(z.id) || Math.hypot(z.x - P.x, z.y - P.y) > z.r + P.r + 6) return;

function regenPlayer(P, dt) {

function doDash(P) {

  let dx = P.vx, dy = P.vy, l = Math.hypot(dx, dy);

}

function throwGrenade(P) {
  if (P.dead || P.down || G.menu || G.modal || P.grenades <= 0) return;
  P.grenades--;
  const wx = G.botInput ? P.x + Math.cos(P.angle) * 300 : G.cam.x + (mouse.x - W / 2) / zoom;
  const wy = G.botInput ? P.y + Math.sin(P.angle) * 300 : G.cam.y + (mouse.y - H / 2) / zoom;
  const sx = P.x + Math.cos(P.angle) * 14, sy = P.y + Math.sin(P.angle) * 14;

  if (td > 380) { tx *= 380 / td; ty *= 380 / td; }

  G.grenades.push({ x: sx, y: sy, vx: dx / 0.5, vy: dy / 0.5, t: 0, h: 0, rot: 0, by: P });
  if (G.online) Net.thrown(P, sx, sy, dx / 0.5, dy / 0.5);

// ---------------------------------------------------------------------
// Weapons & bullets
// ---------------------------------------------------------------------
function updateWeapon(P, dt, firing) {
  const id = P.cur, w = WEAPONS[id], ws = P.weapons[id], es = wStat(P, id), st = P.st;
  P.fireCd -= dt; P.recoil = Math.max(0, P.recoil - dt * 60); P.muzzle -= dt;
  P.bloom = Math.max(0, P.bloom - 20 * dt);
  if (P.swapT > 0) { P.swapT -= dt; if (P.flaming) { P.flaming = false; Sound.flameStop(); } return; }
  if (P.jam > 0) { P.jam -= dt; return; }
  if (!(firing && id === 'smg')) P.spin = Math.max(0, P.spin - dt * 2);
  // frenzy decay
  if (st.frenzy && G.t - P.lastFrenzyKill > 1.5) P.frenzyStacks = 0;
  // reloading
  if (P.reloading) {
    if (w.shells && firing && ws.mag > 0) { P.reloading = false; }
    else {
      const before = 1 - P.reloadT / P.reloadTotal;
      P.reloadT -= dt;
      if (w.active && !P.activeTried && before < 0.55 && 1 - P.reloadT / P.reloadTotal >= 0.55) Sound.reloadTick();
      if (P.reloadT <= 0) {
        if (w.shells) {
          if (ws.reserve > 0 && ws.mag < es.mag) { ws.mag++; ws.reserve--; Sound.reloadEnd(); }
          if (ws.mag < es.mag && ws.reserve > 0) { P.reloadT = P.reloadTotal = es.reload; } else P.reloading = false;
        } else finishReload(P, false);
      }
      if (P.reloading) { if (P.flaming) { P.flaming = false; Sound.flameStop(); } return; }
    }
  }
  if (w.flame) { updateFlamer(P, dt, firing, es); return; }
  if (firing && P.fireCd <= 0) {
    if (ws.mag <= 0) {
      if (P.dryT <= 0) { Sound.dry(); P.dryT = 0.3; }
      if (ws.reserve > 0 || w.reserve === Infinity) startReload(P);
      else if (id !== 'sidearm') { switchWeapon(P, 'sidearm'); }
    } else fireGun(P, id, w, ws, es);
  }
  P.dryT -= dt;
  if (!P.reloading && ws.mag <= 0 && !firing) {
    if (ws.reserve > 0 || w.reserve === Infinity) startReload(P);
    else if (id !== 'sidearm') switchWeapon(P, 'sidearm');
  }
}

function fireGun(P, id, w, ws, es) {
  const st = P.st;
  let rate = es.rate;
  if (id === 'smg' && st.spinup) { P.spin = Math.min(2, P.spin + 1 / rate); rate *= 1 + P.spin / 2; }
  if (st.frenzy) rate *= 1 + 0.03 * P.frenzyStacks;
  P.fireCd = 1 / rate;
  ws.mag--;
  const a = P.angle, ca = Math.cos(a), sa = Math.sin(a);
  const bx = P.x + ca * (12 + w.len), by = P.y + sa * (12 + w.len);
  const originBlocked = segBlocked(P.x, P.y, bx, by, 6);
  const ox = originBlocked ? P.x : bx, oy = originBlocked ? P.y : by;
  const cornered = st.cornered && P.hp < P.maxHp * 0.3;
  let dmg = es.dmg * (ws.gold ? 1.2 : 1) * (cornered ? 1.5 : 1) * (id === 'sidearm' && st.akimbo ? 0.65 : 1);
  const pellets = (w.pellets || 1) + (id === 'shotgun' && st.dragon ? 3 : 0);
  let spread = w.spread * DEG + (id === 'smg' ? P.bloom * DEG : 0);
  const shotId = G.nextId++;
  const shots = [];
  if (id === 'sidearm' && st.akimbo) shots.push(-2 * DEG, 2 * DEG); else shots.push(0);
  for (const off of shots) for (let i = 0; i < pellets; i++) {
    const ang = a + off + (w.pellets ? (i / (pellets - 1) - 0.5) * spread + rand(-0.04, 0.04) : rand(-0.5, 0.5) * spread);
    let d = dmg, crit = false;
    if (id === 'rifle' && st.marksman && Math.random() < 0.25) { d *= 3; crit = true; }
    const spd = w.speed * rand(0.94, 1.06);
    G.bullets.push({
      x: ox, y: oy, sx: ox, sy: oy, vx: Math.cos(ang) * spd, vy: Math.sin(ang) * spd, dmg: d, kb: w.kb * st.kbMul, weapon: id,
      pierce: w.pierce + st.pierce, life: w.range / spd, travelled: 0, hit: [], bounces: st.ricochet ? 2 : 0,
      gold: ws.gold, crit, shotId, fire: id === 'shotgun' && st.dragon, inc: st.incendiary, col: w.col, owner: P,
    });

  // shell casing
  const perp = a + Math.PI / 2 * (Math.random() < 0.9 ? 1 : -1);
  spawnPart({ type: 'shell', x: P.x + ca * 8, y: P.y + sa * 8, vx: Math.cos(perp) * rand(60, 110) - ca * 20, vy: Math.sin(perp) * rand(60, 110) - sa * 20, z: 10, vz: 80, grav: 500, life: 0.9, size: id === 'shotgun' ? 3 : 2, col: id === 'shotgun' ? '#b8322a' : '#d9b44a', drag: 3, bounces: 1, vr: rand(-20, 20) });

}

function updateFlamer(P, dt, firing, es) {
  const ws = P.weapons.flamer, st = P.st;
  if (firing && ws.mag > 0) {
    if (!P.flaming) { P.flaming = true; Sound.flameStart(); }
    ws.mag = Math.max(0, ws.mag - WEAPONS.flamer.drain * dt);
    P.flameTick -= dt;
    const range = WEAPONS.flamer.flameRange * st.flameRange, half = WEAPONS.flamer.cone / 2 * DEG;
    const a = P.angle;
    // particles

      const aa = a + rand(-half, half) * 0.9, s = range * rand(2.2, 3.2);
      spawnPart({ type: 'fire', x: P.x + Math.cos(a) * 30, y: P.y + Math.sin(a) * 30, vx: Math.cos(aa) * s + P.vx * 0.5, vy: Math.sin(aa) * s + P.vy * 0.5, life: rand(0.25, 0.4), size: rand(4, 7), grow: 26, drag: 2.2, add: true });
    }
    P.muzzle = 0.05; P.muzzleA = a;
    if (P.flameTick <= 0) {
      P.flameTick += 1 / es.rate;
      const cornered = st.cornered && P.hp < P.maxHp * 0.3;
      const dmg = es.dmg * (cornered ? 1.5 : 1);
      Grid.query(P.x, P.y, range + 30, z => {
        const dx = z.x - P.x, dy = z.y - P.y, d = Math.hypot(dx, dy);
        if (d > range + z.r) return;
        if (Math.abs(angDiff(a, Math.atan2(dy, dx))) > half + Math.atan2(z.r, Math.max(d, 1))) return;
        if (segBlocked(P.x, P.y, z.x, z.y, 14)) return;
        ignite(z, 12, 3, P);
        hurtZombie(z, dmg, dx / (d || 1), dy / (d || 1), WEAPONS.flamer.kb, 'flamer', true, false, P);
      });
      for (const b of G.barrels) if (b.alive && Math.hypot(b.x - P.x, b.y - P.y) < range && Math.abs(angDiff(a, Math.atan2(b.y - P.y, b.x - P.x))) < half) hurtBarrel(b, 4, undefined, P);

        const d = rand(60, range), fx = P.x + Math.cos(a) * d, fy = P.y + Math.sin(a) * d;
        if (Net.mode === 'guest') Net.claim(['sc', Math.round(fx), Math.round(fy)]); // the host lights it (and it burns there)
        else addPool({ x: fx, y: fy, r: 34, t: 2, dur: 2, dpsP: 0, dpsZ: 20, kind: 'fire', by: P });
      }
    }
    if (ws.mag <= 0) { P.flaming = false; Sound.flameStop(); if (ws.reserve > 0) startReload(P); else switchWeapon(P, 'sidearm'); }
  } else {
    if (P.flaming) { P.flaming = false; Sound.flameStop(); }
    if (ws.mag <= 0 && !P.reloading) { if (ws.reserve > 0) startReload(P); else switchWeapon(P, 'sidearm'); }
  }
}

function updateBullets(dt) {
  const bl = G.bullets;
  for (let i = bl.length - 1; i >= 0; i--) {
    const b = bl[i];
    let alive = true;
    const stepLen = Math.hypot(b.vx, b.vy) * dt, n = Math.max(1, Math.ceil(stepLen / 9));
    const sx = b.vx * dt / n, sy = b.vy * dt / n, segL = stepLen / n;
    for (let k = 0; k < n && alive; k++) {
      b.x += sx; b.y += sy; b.travelled += segL;
      const tv = tileAt(b.x, b.y);
      if (tv !== 0 && tv !== 3 && tv !== 4) { // walls, props (fences & trunks let bullets pass)
        sparks(b.x - sx, b.y - sy, Math.atan2(b.vy, b.vx), 4); alive = false; break;
      }
      for (const br of G.barrels) if (br.alive && dist2(b.x, b.y, br.x, br.y) < 13 * 13) { if (!b.ghost) hurtBarrel(br, b.dmg, undefined, b.owner); sparks(b.x, b.y, Math.atan2(b.vy, b.vx), 5, '#ff8a4a'); alive = false; break; }
      if (!alive) break;
      let hitZ = null;
      Grid.query(b.x, b.y, 50, z => {
        if (b.hit.indexOf(z.id) !== -1) return;
        const rr = z.r * (z.scale || 1) + 3;
        if (dist2(b.x, b.y, z.x, z.y) < rr * rr) { hitZ = z; return true; }
      });
      if (hitZ && b.ghost) { alive = false; break; } // a teammate's bullet on this screen only shows where it stops
      if (hitZ) {
        const z = hitZ; b.hit.push(z.id);
        let dmg = b.dmg;
        if (b.weapon === 'shotgun') dmg *= b.travelled < 120 ? 1 : b.travelled > 260 ? 0.5 : 1 - 0.5 * (b.travelled - 120) / 140;
        if (b.weapon === 'rifle') dmg *= Math.pow(0.85, b.hit.length - 1);
        const l = Math.hypot(b.vx, b.vy);
        const ow = b.owner || G.P;
        ow.stats.hits++;
        if (b.fire) ignite(z, 12, 3, ow);
        if (b.inc) ignite(z, 8, 3, ow);
        const wasAlive = !z.dead;
        hurtZombie(z, dmg, b.vx / l, b.vy / l, b.kb, b.weapon, false, b.crit, ow);
        if (b.crit && wasAlive) { floater(z.x, z.y - 20, 'CRIT', '#ff4a4a', 13); Sound.crit(panOf(z.x), 0.25 + 0.75 * volOf(z.x, z.y, 1400)); if (z.dead) { const ws = ow.weapons.rifle; ws.mag = Math.min(wStat(ow, 'rifle').mag, ws.mag + 1); } }

        else if (b.bounces > 0) {
          // ricochet to the nearest zombie within 200px
          let best = null, bd = 200 * 200;
          Grid.query(b.x, b.y, 200, o => { if (o === z || b.hit.indexOf(o.id) !== -1) return; const d = dist2(b.x, b.y, o.x, o.y); if (d < bd) { bd = d; best = o; } });
          if (best) {
            b.bounces--; b.dmg *= 0.7; const a = Math.atan2(best.y - b.y, best.x - b.x), sp = Math.hypot(b.vx, b.vy);
            b.vx = Math.cos(a) * sp; b.vy = Math.sin(a) * sp; b.life = Math.max(b.life, 0.25); b.sx = b.x; b.sy = b.y;
            break;
          } else alive = false;
        } else alive = false;
      }
    }
    b.life -= dt;
    if (!alive || b.life <= 0) {
      if (b.weapon === 'rifle') G.tracers.push({ x0: b.sx, y0: b.sy, x1: b.x, y1: b.y, t: 0.12, max: 0.12, col: b.gold ? '#ffd24a' : '#cfefff', w: 2 });
      bl[i] = bl[bl.length - 1]; bl.pop();
    }
  }
}

// ---------------------------------------------------------------------
// Damage & death
// ---------------------------------------------------------------------
function ignite(z, dps, dur, by) {
  if (z.dead) return;
  if (Net.mode === 'guest') { Net.claim(['i', z.id, dps, dur]); z.burnT = Math.max(z.burnT, dur); return; }
  z.burnT = Math.max(z.burnT, dur); z.burnDps = Math.max(z.burnDps || 0, dps);
  if (by) z.burnBy = by;
}
// by: the player credited with this damage and the kill; without one, whoever is nearest
function hurtZombie(z, dmg, dx, dy, kb, src, quiet, crit, by) {
  if (z.dead) return;
  if (Net.mode === 'guest') { guestHit(z, dmg, dx, dy, kb, src, quiet, crit); return; } // the host decides; we show it at once
  const who = by || targetPlayer(z.x, z.y);
  if (!quiet && Net.mode === 'host') Net.fx(['h', z.id, Math.round(dx * 100), Math.round(dy * 100), who.id], z.x, z.y);
  if (z.stunT > 0 && z.type === 'rammer') dmg *= 1.5;
  z.hp -= dmg;
  if (src !== 'burn' && src !== 'acid' && G.t - (z.lastFlash || -9) > (src === 'flamer' ? 0.2 : 0.12)) { z.flash = 0.05; z.lastFlash = G.t; }
  who.stats.dmg[src] = (who.stats.dmg[src] || 0) + Math.min(dmg, z.hp + dmg);
  if (!z.boss && kb) {
    const k = kb * (1 - z.resist);
    z.kbx += dx * k; z.kby += dy * k;
    const kl = Math.hypot(z.kbx, z.kby); if (kl > 520) { z.kbx *= 520 / kl; z.kby *= 520 / kl; }
    if (who.st.stagger > 0 && src !== 'flamer' && src !== 'burn' && Math.random() < who.st.stagger) z.stagger = 0.5;
  }
  if (!quiet) {
    bloodBurst(z.x + dx * z.r * 0.5, z.y + dy * z.r * 0.5, Math.atan2(dy, dx), randi(4, 8), 0.52, 180, z.type === 'gasbag' || z.type === 'hurler' ? pick(['#6a7a1a', '#8a9a2a', '#5a0a0a']) : null);
    if (onScreen(z.x, z.y, 100)) { const a = Sound.at(z.x, z.y); Sound.hit(a.pan, a.v); }
  }
  if (z.hp <= 0) killZombie(z, src, dx, dy, who);
}
function killZombie(z, src, dx = 0, dy = 0, by) {
  if (z.dead) return;
  z.dead = true; z.hp = 0;
  const T = ZTYPES[z.type], P = by || targetPlayer(z.x, z.y); // P: the killer
  P.kills++; P.killsByType[z.type] = (P.killsByType[z.type] || 0) + 1;
  if (G.t - P.lastKillT < 1.5) P.streak++; else P.streak = 1;
  P.lastKillT = G.t; P.bestStreak = Math.max(P.bestStreak, P.streak);
  if (P.st.frenzy) { if (G.t - P.lastFrenzyKill < 1) P.frenzyStacks = Math.min(15, P.frenzyStacks + 1); P.lastFrenzyKill = G.t; }
  const mult = Math.min(3, 1 + 0.1 * Math.floor(P.streak / 10));
  P.score += Math.round(T.score * (z.elite ? 3 : 1) * (T.boss ? 1 : mult));
  // xp gem
  if (!T.boss) dropGem(z.x, z.y, T.xp * (z.elite ? 5 : 1));
  // drops
  dropLoot(z, P);
  killFx(z, dx, dy, P === G.P ? P.streak : 0);
  if (Net.mode === 'host') Net.fx(['k', z.id, Math.round(dx * 100), Math.round(dy * 100), P.id], z.x, z.y);
  // specials
  if (z.type === 'gasbag') queueBlast(z.x, z.y, 90, 60, 25, 260, 'gasbag', 0.02, 'acid', P);

    if (!P) { p.fly = false; p.v = 0; continue; } // save it for later

function cardEligible(c, P, legendaryOnly) {

  const counts = {}; for (const c of pool) counts[c.kind] = (counts[c.kind] || 0) + 1;
  const weight = c => mode === 'legendary' ? 1 : W8[c.kind] / counts[c.kind];

    while (out.length < 3 && commons.length) out.push(commons.splice((Math.random() * commons.length) | 0, 1)[0]);

function updateSpits(dt) {

    if (k >= 1) {

      if (real) for (const Q of G.players) if (Math.hypot(Q.x - s.tx, Q.y - s.ty) < s.r + Q.r) damagePlayer(Q, s.dmg, s.kind === 'rock' ? 'Grave Giant' : 'Hurler', s.tx, s.ty, { kb: 200 });

        for (let k2 = 0; k2 < 10; k2++) spawnPart({ type: 'acid', x: s.tx, y: s.ty, vx: rand(-120, 120), vy: rand(-120, 120), life: 0.4, size: 3, drag: 4, add: true });

      } else {
        addTrauma(0.3 * volOf(s.tx, s.ty, 800));
        Sound.tone({ f0: 70, f1: 30, dur: 0.4, vol: 0.6 * volOf(s.tx, s.ty), pan: panOf(s.tx) });
        for (let k2 = 0; k2 < 16; k2++) { const a = rand(TAU); spawnPart({ type: 'debris', x: s.tx, y: s.ty, vx: Math.cos(a) * rand(60, 220), vy: Math.sin(a) * rand(60, 220), z: 2, vz: rand(60, 160), grav: 500, life: 1, size: rand(2, 4), col: pick(['#4a4640', '#5e5a50', '#3a3630']), drag: 2, bounces: 1 }); }

  }
}

function updateParticles(dt) {
  const g = Town.dctx;
  let bakeN = 0;
  for (let i = 0; i < PMAX; i++) {
    const p = parts[i];
    if (!p.on) continue;
    p.life -= dt;
    const dk = Math.exp(-p.drag * dt);
    p.vx *= dk; p.vy *= dk;
    p.x += p.vx * dt; p.y += p.vy * dt; p.rot += p.vr * dt;
    p.size += p.grow * dt;
    if (p.grav) {
      p.vz -= p.grav * dt; p.z += p.vz * dt;
      if (p.z <= 0) {
        p.z = 0;
        if (p.bounces > 0) { p.bounces--; p.vz = -p.vz * 0.4; p.vx *= 0.6; p.vy *= 0.6; }
        else {
          // landed: bake onto the ground
          if (p.type === 'blood') { if ((bakeN++ & 1) === 0) { g.fillStyle = p.col; g.globalAlpha = 0.6; g.beginPath(); g.arc(p.x, p.y, p.size * 0.9, 0, TAU); g.fill(); g.globalAlpha = 1; } }
          else if (p.type === 'chunk' || p.type === 'shell' || p.type === 'debris') { g.save(); g.translate(p.x, p.y); g.rotate(p.rot); g.fillStyle = p.col; g.globalAlpha = p.type === 'shell' ? 0.8 : 0.9; g.fillRect(-p.size, -p.size * 0.5, p.size * 2, p.size); g.restore(); }
          p.on = false; continue;
        }
      }
    }
    if (p.life <= 0) p.on = false;
  }
  // corpses squash then bake
  for (let i = G.corpses.length - 1; i >= 0; i--) {
    const c = G.corpses[i];
    c.t += dt;
    if (c.t >= 0.15) {
      const S = Sprites.zombie[c.type];
      const img = S.corpse;
      const sz = S.size * c.scale;
      g.save(); g.translate(c.x, c.y); g.rotate(c.a); g.scale(1, 0.6); g.globalAlpha = 0.5;
      g.drawImage(img, -sz / 2, -sz / 2, sz, sz);
      g.restore();
      G.corpses.splice(i, 1);
    }
  }
  for (let i = G.rings.length - 1; i >= 0; i--) { const r = G.rings[i]; r.t -= dt; if (r.t <= 0) G.rings.splice(i, 1); }
  for (let i = G.tracers.length - 1; i >= 0; i--) { const r = G.tracers[i]; r.t -= dt; if (r.t <= 0) G.tracers.splice(i, 1); }
  for (let i = G.floaters.length - 1; i >= 0; i--) { const f = G.floaters[i]; f.life -= dt; f.y -= 26 * dt; if (f.life <= 0) G.floaters.splice(i, 1); }
  for (let i = G.afterimages.length - 1; i >= 0; i--) { const a = G.afterimages[i]; a.t -= dt; if (a.t <= 0) G.afterimages.splice(i, 1); }
  for (let i = G.edgeWarn.length - 1; i >= 0; i--) { const e = G.edgeWarn[i]; e.t -= dt; if (e.t <= 0) G.edgeWarn.splice(i, 1); }
}

    const y = p.y + Math.sin(p.bob) * 2;
    ctx.fillStyle = 'rgba(255,255,255,0.14)'; ctx.beginPath(); ctx.arc(p.x, y, 15, 0, TAU); ctx.fill();
    if (p.kind === 'ammo') drawAmmoBox(ctx, p.x, y); else if (p.kind === 'med') drawMedkit(ctx, p.x, y); else drawGrenadeIcon(ctx, p.x, y, 1.1, 0, true);
  }
  // zombie shadows
  ctx.fillStyle = 'rgba(0,0,0,0.28)'; ctx.beginPath();
  for (const z of G.zombies) { if (!vis(z.x, z.y)) continue; const r = z.r * (z.type === 'gasbag' && z.fuse > 0 ? 1 + z.fuse * 0.25 : 1); ctx.moveTo(z.x + 3 + r, z.y + 4); ctx.ellipse(z.x + 3, z.y + 4, r, r * 0.8, 0, 0, TAU); }
  ctx.fill();
  // zombies
  for (const z of G.zombies) { if (vis(z.x, z.y, z.r + 20)) drawZombie(ctx, z); }
  // player
  for (const a of G.afterimages) { ctx.globalAlpha = a.t / 0.25 * 0.35; drawPlayerBody(ctx, P, a.x, a.y, a.a, true); }
  ctx.globalAlpha = 1;
  if (G.state !== 'title') {
    for (const Q of G.players) if (Q !== P && !Q.away && !Q.dead) drawPlayer(ctx, Q);
    if (!(G.online && P.dead)) drawPlayer(ctx, P);
  }
  // grenades
  for (const n of G.grenades) {
    ctx.fillStyle = 'rgba(0,0,0,0.3)'; ctx.beginPath(); ctx.ellipse(n.x + 2, n.y + 3, 5, 4, 0, 0, TAU); ctx.fill();
    drawGrenadeIcon(ctx, n.x, n.y - n.h, 0.9 + n.h / 80, n.rot);
    if (n.t > 0.5 && Math.floor(n.t * 12) % 2 === 0) { ctx.fillStyle = '#ff3a2a'; ctx.beginPath(); ctx.arc(n.x, n.y - n.h - 6, 2, 0, TAU); ctx.fill(); }
  }
  // bullets
  ctx.lineCap = 'round';
  for (const b of G.bullets) {
    const l = Math.hypot(b.vx, b.vy), len = b.weapon === 'rifle' ? 60 : b.weapon === 'shotgun' ? 22 : 34;
    const tl = Math.min(len, b.travelled + 4);
    ctx.strokeStyle = b.gold ? '#ffd24a' : b.fire ? '#ff9a3a' : b.col; ctx.lineWidth = b.weapon === 'rifle' ? 2.5 : 2;
    ctx.beginPath(); ctx.moveTo(b.x - b.vx / l * tl, b.y - b.vy / l * tl); ctx.lineTo(b.x, b.y); ctx.stroke();
  }
  for (const t of G.tracers) {
    if (t.top) continue;
    ctx.strokeStyle = t.col; ctx.globalAlpha = t.t / t.max; ctx.lineWidth = t.w;
    ctx.beginPath(); ctx.moveTo(t.x0, t.y0); ctx.lineTo(t.x1, t.y1); ctx.stroke();
  }
  ctx.globalAlpha = 1;
  // particles
  drawParticles(ctx, vis);
  // spit / rocks in the air
  for (const s of G.spits) {
    ctx.fillStyle = 'rgba(0,0,0,0.3)'; ctx.beginPath(); ctx.ellipse(s.x, s.y, 6, 4, 0, 0, TAU); ctx.fill();
    if (s.kind === 'spit') { ctx.fillStyle = '#b8e04a'; ctx.beginPath(); ctx.arc(s.x, s.y - s.h, 6, 0, TAU); ctx.fill(); ctx.fillStyle = '#e8ff9a'; ctx.beginPath(); ctx.arc(s.x - 2, s.y - s.h - 2, 2.4, 0, TAU); ctx.fill(); }
    else { ctx.save(); ctx.translate(s.x, s.y - s.h); ctx.rotate(s.t * 6); ctx.fillStyle = '#5e5a50'; ctx.fillRect(-12, -9, 24, 18); ctx.fillStyle = '#7a766a'; ctx.fillRect(-12, -9, 24, 6); ctx.restore(); }
  }
  // cars, fences, buildings
  drawStatics(ctx, vis);
  // explosion flashes
  if (G.flashes) for (const f of G.flashes) {
    const k = 1 - f.t / 0.25, r = f.r * Math.min(1, k / 0.32);
    ctx.globalAlpha = Math.max(0, 1 - k) * 0.9;
    ctx.fillStyle = f.acid ? '#d8ff7a' : k < 0.3 ? '#fffbe0' : '#ffa040';
    ctx.beginPath(); ctx.arc(f.x, f.y, r, 0, TAU); ctx.fill();
  }
  ctx.globalAlpha = 1;
  // tree canopies (above everything on the ground)
  for (const t of Town.trees) {
    if (!vis(t.x, t.y, t.r)) continue;
    const near = Math.hypot(P.x - t.x, P.y - t.y) < t.r + 8;
    t.fade += ((near ? 0.35 : 0.96) - t.fade) * 0.15;
    ctx.globalAlpha = t.fade;
    ctx.drawImage(t.canvas, t.x - t.canvas.width / 2, t.y - t.canvas.height / 2);
  }
  ctx.globalAlpha = 1;
  // smoke draws above canopies
  drawSmoke(ctx, vis);
}

function drawStatics(c, vis) {
  for (const p of Town.props) {
    if (!vis(p.x + p.w / 2, p.y + p.h / 2, 120)) continue;
    if (p.type === 'car') {
      const cv = p.canvas;
      c.save(); c.translate(p.x + p.w / 2, p.y + p.h / 2);
      if (p.vertical) c.rotate(p.flip ? Math.PI / 2 : -Math.PI / 2); else if (p.flip) c.rotate(Math.PI);
      c.drawImage(cv, -cv.width / 2, -cv.height / 2); c.restore();
    } else if (p.type === 'bench') {
      c.fillStyle = 'rgba(0,0,0,0.3)'; c.fillRect(p.x + 3, p.y + 4, p.w, p.h);
      c.fillStyle = '#6a4a2a'; c.fillRect(p.x, p.y, p.w, p.h); c.fillStyle = '#80603a';
      if (p.vertical) for (let i = 0; i < 3; i++) c.fillRect(p.x + 2 + i * 6, p.y, 4, p.h); else for (let i = 0; i < 3; i++) c.fillRect(p.x, p.y + 2 + i * 6, p.w, 4);
    } else if (p.type === 'statue') {
      c.fillStyle = 'rgba(0,0,0,0.35)'; c.fillRect(p.x + 5, p.y + 6, p.w, p.h);
      c.fillStyle = '#8d8a82'; c.fillRect(p.x, p.y, p.w, p.h); c.fillStyle = '#a5a29a'; c.fillRect(p.x + 4, p.y + 4, p.w - 8, p.h - 8);
      c.fillStyle = '#5c6a5e'; c.beginPath(); c.arc(p.x + p.w / 2, p.y + p.h / 2, 11, 0, TAU); c.fill();
      c.fillStyle = '#6e7e70'; c.beginPath(); c.arc(p.x + p.w / 2 - 2, p.y + p.h / 2 - 2, 7, 0, TAU); c.fill();
    } else if (p.type === 'pump') {
      c.fillStyle = 'rgba(0,0,0,0.35)'; c.fillRect(p.x + 3, p.y + 4, p.w, p.h);
      c.fillStyle = '#c8c4b8'; c.fillRect(p.x, p.y, p.w, p.h); c.fillStyle = '#b3261e'; c.fillRect(p.x + 3, p.y + 3, p.w - 6, 12);
      c.fillStyle = '#222'; c.fillRect(p.x + 5, p.y + 20, p.w - 10, 6);
    } else if (p.type === 'crateStack') {
      c.fillStyle = 'rgba(0,0,0,0.35)'; c.fillRect(p.x + 4, p.y + 5, p.w, p.h);
      c.fillStyle = '#7a5a32'; c.fillRect(p.x, p.y, p.w, p.h); c.strokeStyle = '#4a3418'; c.lineWidth = 2; c.strokeRect(p.x + 1, p.y + 1, p.w - 2, p.h - 2);
      c.beginPath(); c.moveTo(p.x, p.y); c.lineTo(p.x + p.w, p.y + p.h); c.moveTo(p.x + p.w, p.y); c.lineTo(p.x, p.y + p.h); c.stroke();
    } else if (p.type === 'barrier') {
      c.fillStyle = 'rgba(0,0,0,0.35)'; c.fillRect(p.x + 3, p.y + 4, p.w, p.h);
      c.fillStyle = '#b8b4aa'; c.fillRect(p.x, p.y, p.w, p.h);
      c.fillStyle = '#d24a2a'; const n = Math.max(p.w, p.h) / 20;
      for (let i = 0; i < n; i += 2) p.vertical ? c.fillRect(p.x, p.y + i * 20, p.w, 10) : c.fillRect(p.x + i * 20, p.y, 10, p.h);
    } else if (p.type === 'canopy') {
      c.fillStyle = 'rgba(220,215,200,0.22)'; c.fillRect(p.x, p.y, p.w, p.h);
      c.strokeStyle = 'rgba(200,40,30,0.5)'; c.lineWidth = 4; c.strokeRect(p.x + 2, p.y + 2, p.w - 4, p.h - 4);
    }
  }
  for (const f of Town.fences) {
    if (!vis(f.x + f.w / 2, f.y + f.h / 2, 220)) continue;
    if (f.style === 'wall') {
      c.fillStyle = 'rgba(0,0,0,0.35)'; c.fillRect(f.x + 4, f.y + 5, f.w, f.h);
      c.fillStyle = '#8a8378'; c.fillRect(f.x, f.y, f.w, f.h); c.fillStyle = '#a29a8e'; c.fillRect(f.x + 2, f.y + 2, f.w - 4, f.h - 8);
      c.strokeStyle = 'rgba(0,0,0,0.2)'; c.lineWidth = 1;
      if (f.vertical) for (let y = f.y; y < f.y + f.h; y += 20) { c.beginPath(); c.moveTo(f.x, y + 0.5); c.lineTo(f.x + f.w, y + 0.5); c.stroke(); }
      else for (let x = f.x; x < f.x + f.w; x += 20) { c.beginPath(); c.moveTo(x + 0.5, f.y); c.lineTo(x + 0.5, f.y + f.h); c.stroke(); }
    } else {
      const cx = f.x + f.w / 2, cy = f.y + f.h / 2;
      c.strokeStyle = 'rgba(0,0,0,0.35)'; c.lineWidth = 5;
      c.beginPath(); if (f.vertical) { c.moveTo(cx + 3, f.y + 3); c.lineTo(cx + 3, f.y + f.h + 3); } else { c.moveTo(f.x + 3, cy + 3); c.lineTo(f.x + f.w + 3, cy + 3); } c.stroke();
      c.strokeStyle = '#7a5e3e'; c.lineWidth = 4;
      c.beginPath(); if (f.vertical) { c.moveTo(cx, f.y); c.lineTo(cx, f.y + f.h); } else { c.moveTo(f.x, cy); c.lineTo(f.x + f.w, cy); } c.stroke();
      c.fillStyle = '#5a4128';
      if (f.vertical) for (let y = f.y; y <= f.y + f.h; y += 10) c.fillRect(cx - 3, y - 1.5, 6, 3); else for (let x = f.x; x <= f.x + f.w; x += 10) c.fillRect(x - 1.5, cy - 3, 3, 6);
    }
  }
  for (const b of Town.buildings) if (vis(b.x + b.w / 2, b.y + b.h / 2, Math.max(b.w, b.h))) c.drawImage(b.canvas, b.x, b.y);
  for (const l of Town.lamps) {
    if (!vis(l.x, l.y)) continue;
    c.fillStyle = 'rgba(0,0,0,0.3)'; c.beginPath(); c.arc(l.x + 2, l.y + 3, 4, 0, TAU); c.fill();
    c.fillStyle = '#3a3d40'; c.beginPath(); c.arc(l.x, l.y, 3.5, 0, TAU); c.fill();
    c.fillStyle = l.broken ? '#555' : '#fff4c8'; c.beginPath(); c.arc(l.x, l.y, 1.8, 0, TAU); c.fill();
  }
}

function drawZombie(c, z) {
  const S = Sprites.zombie[z.type];
  const fr = [0, 1, 2, 1][Math.floor(z.anim) & 3];
  const img = S.set[z.v % S.set.length][fr];
  let sz = S.size * z.scale;
  let sx = 1, sy = 1;
  if (z.type === 'gasbag') { const f = z.fuse > 0 ? z.fuse / 1.2 : 0; sx = sy = 1 + 0.3 * f + Math.sin(G.t * 6 + z.eye * 9) * 0.03; }
  if (z.state === 'rear') { sx = 1.12; sy = 0.92; }
  if (z.spawnT > 0) { const k = 1 - z.spawnT / 0.35; sx *= k; sy *= k; c.globalAlpha = k; }
  c.save(); c.translate(z.x, z.y); c.rotate(z.angle + (z.stunT > 0 ? Math.sin(G.t * 20) * 0.15 : 0)); c.scale(sx, sy);
  if (z.elite) {
    c.globalAlpha = 0.5 + 0.3 * Math.sin(G.t * 6);
    c.drawImage(S.gold, -sz / 2 * 1.14, -sz / 2 * 1.14, sz * 1.14, sz * 1.14);
    c.globalAlpha = 1;
  }
  c.drawImage(img, -sz / 2, -sz / 2, sz, sz);
  if (z.type === 'gasbag' && z.fuse > 0 && Math.floor(z.fuse * (6 + z.fuse * 14)) % 2 === 0) { c.globalAlpha = 0.6; c.drawImage(S.flash, -sz / 2, -sz / 2, sz, sz); c.globalAlpha = 1; }
  if (z.type === 'hurler' && z.state === 'wind') { c.fillStyle = `rgba(220,255,120,${0.5 + 0.5 * Math.sin(G.t * 40)})`; c.beginPath(); c.arc(8.5 * z.scale, 0, 7, 0, TAU); c.fill(); }
  if (z.flash > 0) { c.globalAlpha = z.boss ? 0.35 : 0.75; c.drawImage(S.flash, -sz / 2, -sz / 2, sz, sz); c.globalAlpha = 1; }
  if (z.burnT > 0) { c.globalAlpha = 0.45 + 0.25 * Math.sin(G.t * 75 + z.eye * 10); c.drawImage(S.burn, -sz / 2, -sz / 2, sz, sz); c.globalAlpha = 1; }
  c.restore();
  c.globalAlpha = 1;
  if (z.stunT > 0) { // dizzy stars
    for (let i = 0; i < 3; i++) { const a = G.t * 5 + i * TAU / 3; c.fillStyle = '#ffe070'; c.beginPath(); c.arc(z.x + Math.cos(a) * 16, z.y - z.r - 4 + Math.sin(a) * 5, 2.4, 0, TAU); c.fill(); }
  }
  if (!z.boss && z.hp < z.maxHp && (z.maxHp >= 150 || z.elite)) { // small health bar for tough ones
    const w = z.r * 2; c.fillStyle = 'rgba(0,0,0,0.6)'; c.fillRect(z.x - w / 2, z.y - z.r - 10, w, 4);
    c.fillStyle = z.elite ? '#ffd24a' : '#e04a3a'; c.fillRect(z.x - w / 2, z.y - z.r - 10, w * clamp(z.hp / z.maxHp, 0, 1), 4);
  }
}

function drawPlayerBody(c, P, x, y, a, ghost, noShadow) {
  const w = WEAPONS[P.cur];
  const rec = ghost ? 0 : P.recoil;
  const step = Math.sin(P.anim) * 2.5;
  c.save(); c.translate(x, y);
  c.rotate(a);
  if (!ghost && !noShadow) { c.fillStyle = 'rgba(0,0,0,0.3)'; c.beginPath(); c.ellipse(3, 4, 13, 11, 0, 0, TAU); c.fill(); }
  // feet
  c.fillStyle = '#2a2a2e'; c.beginPath(); c.ellipse(step - 1, -6, 4, 3, 0, 0, TAU); c.ellipse(-step - 1, 6, 4, 3, 0, 0, TAU); c.fill();
  // backpack / fuel tank
  if (P.cur === 'flamer') { c.fillStyle = '#c4501e'; c.beginPath(); c.ellipse(-10, 0, 5, 8, 0, 0, TAU); c.fill(); c.fillStyle = '#e8743a'; c.fillRect(-12, -3, 3, 6); }
  else { c.fillStyle = '#5a4a32'; c.fillRect(-13, -7, 7, 14); c.fillStyle = '#6e5c40'; c.fillRect(-13, -7, 7, 4); }
  // gun
  const gl = w.len, gx = 6 - rec;
  c.fillStyle = '#1c1c20';
  c.fillRect(gx, -2.2, gl, 4.4);
  if (P.cur === 'shotgun' || P.cur === 'rifle') { c.fillStyle = '#6a4a2a'; c.fillRect(gx - 6, -2.6, 8, 5.2); }
  if (P.cur === 'rifle') { c.fillStyle = '#333'; c.fillRect(gx + 6, -3.6, 9, 1.8); }
  if (P.cur === 'smg') { c.fillStyle = '#2a2a2e'; c.fillRect(gx + 5, 2, 3, 5); }
  if (P.cur === 'flamer') { c.fillStyle = '#6a6e72'; c.fillRect(gx + gl - 4, -3, 5, 6); }
  if (P.cur === 'sidearm' && P.st.akimbo) { c.fillStyle = '#1c1c20'; c.fillRect(gx, -8, gl, 4); c.fillRect(gx, 4, gl, 4); }
  // arms
  const pal = playerPal(P);
  c.strokeStyle = pal.arm; c.lineWidth = 4.5; c.lineCap = 'round';
  c.beginPath(); c.moveTo(0, -8); c.lineTo(gx + 3, -3); c.moveTo(0, 8); c.lineTo(gx + 8, 1.5); c.stroke();
  c.fillStyle = '#e0b089'; c.beginPath(); c.arc(gx + 3, -2.5, 2.4, 0, TAU); c.arc(gx + 8, 1.8, 2.4, 0, TAU); c.fill();
  // body
  c.fillStyle = '#ffffff'; c.beginPath(); c.ellipse(-1, 0, 8.6, 11.6, 0, 0, TAU); c.fill();
  c.fillStyle = pal.body; c.beginPath(); c.ellipse(-1, 0, 7.4, 10.4, 0, 0, TAU); c.fill();
  c.fillStyle = pal.shade; c.beginPath(); c.ellipse(-3, 0, 4, 9, 0, 0, TAU); c.fill();
  // head
  c.fillStyle = '#ffffff'; c.beginPath(); c.arc(1.5, 0, 6.2, 0, TAU); c.fill();
  c.fillStyle = '#e0b089'; c.beginPath(); c.arc(1.5, 0, 5.2, 0, TAU); c.fill();
  c.fillStyle = '#3a2618'; c.beginPath(); c.arc(0, 0, 4.6, Math.PI * 0.55, Math.PI * 1.45); c.fill();
  c.restore();
}
function playerPal(P) { // each player wears their own colour (the solo hero keeps the original teal)
  if (!P.col || P.col === PLAYER_COLS[0]) return { arm: '#1e8e84', body: '#1fb5a8', shade: '#18968b' };
  return P.pal || (P.pal = { arm: shade(P.col, -0.25), body: P.col, shade: shade(P.col, -0.18) });
}
function drawPlayer(c, P, top) {
  if (P.down) { // downed: lying still, waiting for a friend
    c.save(); c.translate(P.x, P.y); c.rotate(P.angle); c.scale(1, 0.6); c.translate(-P.x, -P.y); drawPlayerBody(c, P, P.x, P.y, 0, true); c.restore();
    return;
  }
  if (P.dead) {
    c.save(); c.translate(P.x, P.y); c.rotate(P.angle); c.scale(1, Math.max(0.55, 1 - P.deathT));
    c.globalAlpha = 1; c.translate(-P.x, -P.y); drawPlayerBody(c, P, P.x, P.y, 0, true); c.restore();
    return;
  }
  if (P.boarding > 1.2) c.globalAlpha = Math.max(0, 1 - (P.boarding - 1.2) / 0.8);
  if (P.iframes > 0 && P.dashT <= 0 && Math.floor(G.t * 20) % 2 === 0) c.globalAlpha *= 0.4;
  drawPlayerBody(c, P, P.x, P.y, P.angle, false, top);
  c.globalAlpha = 1;
  if (P.muzzle > 0 && !top) {
    const w = WEAPONS[P.cur], a = P.muzzleA;
    const mx = P.x + Math.cos(a) * (12 + w.len + 6), my = P.y + Math.sin(a) * (12 + w.len + 6);
    c.save(); c.translate(mx, my); c.rotate(a); c.globalCompositeOperation = 'lighter';
    const s = P.cur === 'shotgun' ? 1.6 : P.cur === 'rifle' ? 1.3 : 1;
    c.fillStyle = 'rgba(255,200,90,0.9)';
    c.beginPath(); c.moveTo(-2, 0); c.lineTo(8 * s, -6 * s); c.lineTo(20 * s, 0); c.lineTo(8 * s, 6 * s); c.closePath(); c.fill();
    c.fillStyle = 'rgba(255,255,220,0.95)'; c.beginPath(); c.arc(2, 0, 4 * s, 0, TAU); c.fill();
    c.restore();
  }
}

function drawParticles(c, vis) {
  for (let i = 0; i < PMAX; i++) {
    const p = parts[i];
    if (!p.on || p.type === 'smoke' || !vis(p.x, p.y, 30)) continue;
    const k = p.life / p.max;
    switch (p.type) {
      case 'blood': case 'chunk': case 'debris': case 'shell':
        c.fillStyle = p.col;
        if (p.type === 'blood') { c.beginPath(); c.arc(p.x, p.y - p.z, p.size, 0, TAU); c.fill(); }
        else { c.save(); c.translate(p.x, p.y - p.z); c.rotate(p.rot); c.fillRect(-p.size, -p.size * 0.5, p.size * 2, p.size); c.restore(); }
        break;
      case 'spark':
        c.strokeStyle = p.col; c.globalAlpha = k; c.lineWidth = p.size;
        c.beginPath(); c.moveTo(p.x, p.y); c.lineTo(p.x - p.vx * 0.03, p.y - p.vy * 0.03); c.stroke(); c.globalAlpha = 1;
        break;
      case 'fire': {
        c.globalCompositeOperation = 'lighter';
        const col = k > 0.66 ? '255,210,90' : k > 0.33 ? '255,110,30' : '140,40,20';
        c.fillStyle = `rgba(${col},${0.55 * k + 0.1})`; c.beginPath(); c.arc(p.x, p.y, p.size * (0.5 + 0.5 * k), 0, TAU); c.fill();
        c.globalCompositeOperation = 'source-over';
        break;
      }
      case 'acid':
        c.fillStyle = `rgba(190,240,80,${k})`; c.beginPath(); c.arc(p.x, p.y, p.size, 0, TAU); c.fill(); break;
      case 'bubble':
        c.strokeStyle = `rgba(200,240,120,${k * 0.8})`; c.lineWidth = 1; c.beginPath(); c.arc(p.x, p.y, p.size, 0, TAU); c.stroke(); break;
      case 'dust':
        c.fillStyle = p.col + (0.35 * k) + ')'; c.beginPath(); c.arc(p.x, p.y, p.size, 0, TAU); c.fill(); break;
      case 'ember':
        c.fillStyle = `rgba(255,160,60,${k})`; c.fillRect(p.x, p.y, 2, 2); break;
      case 'ash':
        c.fillStyle = `rgba(200,190,190,${0.5 * k})`; c.fillRect(p.x, p.y, p.size, p.size); break;
    }
  }
}
function drawSmoke(c, vis) {
  for (let i = 0; i < PMAX; i++) {
    const p = parts[i];
    if (!p.on || p.type !== 'smoke' || !vis(p.x, p.y, 40)) continue;
    const k = p.life / p.max;
    c.fillStyle = p.col + (0.45 * k * Math.min(1, (1 - k) * 6)) + ')';
    c.beginPath(); c.arc(p.x, p.y, p.size, 0, TAU); c.fill();
  }
}

// Lighting
// ---------------------------------------------------------------------
function renderLighting() {
  const dark = clamp((1 - G.light) * 0.97, 0, 0.9);
  if (dark < 0.02) return 0;
  const P = camSubject(), L = lctx, s = DPR * LIGHT_RES;
  L.setTransform(1, 0, 0, 1, 0, 0);
  L.globalCompositeOperation = 'source-over';

function wrapText(str, x, y, maxW, size, col, lineH, align = 'center') {

    let part = '';
    for (const ch of w) { if (part && ctx.measureText(part + ch).width > maxW) { words.push(part); part = ch; } else part += ch; }
    if (part) words.push(part);

  let line = '', yy = y;
  for (const w of words) {
    const t = line ? line + ' ' + w : w;
    if (ctx.measureText(t).width > maxW && line) { text(line, x, yy, size, col, align, FONT_BODY, '600', false); line = w; yy += lineH; }
    else line = t;
  }
  if (line) text(line, x, yy, size, col, align, FONT_BODY, '600', false);
  return yy;
}

function renderHUD() {

    const gr = ctx.createRadialGradient(cx, cy, 0, cx, cy, Math.max(W, H) * 0.45);
    gr.addColorStop(0, `rgba(160,0,0,${0.55 * G.hurtDirT / 0.6})`); gr.addColorStop(1, 'rgba(160,0,0,0)');

  if (low || (P.st.cornered && low)) {

    const gr = ctx.createRadialGradient(W / 2, H / 2, Math.min(W, H) * 0.3, W / 2, H / 2, Math.max(W, H) * 0.7);
    gr.addColorStop(0, 'rgba(120,0,0,0)'); gr.addColorStop(1, `rgba(140,0,0,${0.35 + 0.25 * pulse})`);
    ctx.fillStyle = gr; ctx.fillRect(0, 0, W, H);

  }
  if (G.levelFlash > 0) { ctx.fillStyle = `rgba(120,255,170,${G.levelFlash * 0.18})`; ctx.fillRect(0, 0, W, H); }
  // edge warning glows (hordes / packs); their arrows are drawn last, above the HUD
  for (const e of G.edgeWarn) {
    const ea = warnAngle(e), cx = W / 2 + Math.cos(ea) * W * 0.55, cy = H / 2 + Math.sin(ea) * H * 0.55;
    const al = (e.horde ? 0.55 : 0.4) * (0.65 + 0.35 * Math.sin(G.t * 14)) * Math.min(1, e.t);
    const gr = ctx.createRadialGradient(cx, cy, 0, cx, cy, Math.max(W, H) * 0.4);
    gr.addColorStop(0, `rgba(${e.col},${al})`); gr.addColorStop(1, `rgba(${e.col},0)`);

  const xpk = G.xp / G.xpNext;
  const gxp = ctx.createLinearGradient(0, 0, W, 0); gxp.addColorStop(0, '#2ad07a'); gxp.addColorStop(1, '#7affc0');
  ctx.fillStyle = gxp; ctx.fillRect(0, 0, W * xpk, xpH);

  ctx.fillStyle = 'rgba(0,0,0,0.6)'; roundRect(ctx, hx - 3, hy - 3, hw + 6, hh + 6, 6 * u); ctx.fill();
  const hk = clamp(P.hp / P.maxHp, 0, 1);

  ctx.fillStyle = hk < 0.3 ? (Math.floor(G.t * 4) % 2 ? '#ff3a2a' : '#c42a1e') : '#d8342a'; ctx.fillRect(hx, hy, hw * hk, hh);
  ctx.fillStyle = 'rgba(255,255,255,0.18)'; ctx.fillRect(hx, hy, hw * hk, hh * 0.4);

  else if (G.lz && G.lz.holdDone && G.lz.boardT > 0) text(say('THE CHOPPER LEAVES IN {s}s', { s: Math.ceil(G.lz.boardT) }), W / 2, H * 0.62, 20 * u, '#7fe8ff', 'center', FONT_HEAD, 'normal');
}

  y += bh + 16 * u;
