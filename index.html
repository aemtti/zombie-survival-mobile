// Math / util

const TAU = Math.PI * 2;
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const rand = (a = 1, b) => b === undefined ? Math.random() * a : a + Math.random() * (b - a);
const randi = (a, b) => Math.floor(rand(a, b + 1));
const pick = arr => arr[(Math.random() * arr.length) | 0];
const dist2 = (ax, ay, bx, by) => { const dx = bx - ax, dy = by - ay; return dx * dx + dy * dy; };
const angDiff = (a, b) => { let d = (b - a) % TAU; if (d > Math.PI) d -= TAU; if (d < -Math.PI) d += TAU; return d; };
const easeOut = t => 1 - (1 - t) * (1 - t);
function mulberry32(seed) {
  return function () {
    seed |= 0; seed = seed + 0x6D2B79F5 | 0;
    let t = Math.imul(seed ^ seed >>> 15, 1 | seed);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
function fmtTime(s) {
  s = Math.max(0, Math.ceil(s));
  return String(Math.floor(s / 60)).padStart(2, '0') + ':' + String(s % 60).padStart(2, '0');
}
function makeCanvas(w, h) {
  const c = document.createElement('canvas');
  c.width = Math.max(1, Math.ceil(w)); c.height = Math.max(1, Math.ceil(h));
  return c;
}
function shade(hex, amt) { // lighten (+) / darken (-) a #rrggbb color
  const n = parseInt(hex.slice(1), 16);
  let r = n >> 16, g = (n >> 8) & 255, b = n & 255;
  if (amt >= 0) { r += (255 - r) * amt; g += (255 - g) * amt; b += (255 - b) * amt; }
  else { r *= 1 + amt; g *= 1 + amt; b *= 1 + amt; }
  return 'rgb(' + (r | 0) + ',' + (g | 0) + ',' + (b | 0) + ')';
}

// ---------------------------------------------------------------------
// Audio — everything synthesized
// ---------------------------------------------------------------------
const MASTER_VOL = 0.65;
const Sound = {
  ctx: null, master: null, sfx: null, musicBus: null, musicLP: null, noise: null, muted: false,
  last: {}, flame: null, rotor: null, heartT: 0, lowHp: false,
  music: { on: false, next: 0, step: 0, intensity: 0, drone: null, timer: null, tier: 0, lastI: 0, bpm: 84 },

  init() {
    if (this.ctx) { if (this.ctx.state === 'suspended') this.ctx.resume(); return; }
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    try { this.ctx = new AC(); } catch (e) { this.ctx = null; return; }
    const c = this.ctx;
    const comp = c.createDynamicsCompressor();
    comp.threshold.value = -14; comp.knee.value = 10; comp.ratio.value = 5; comp.attack.value = 0.003; comp.release.value = 0.2;
    const limiter = c.createDynamicsCompressor(); // brick-wall safety stage
    limiter.threshold.value = -3; limiter.knee.value = 0; limiter.ratio.value = 20; limiter.attack.value = 0.001; limiter.release.value = 0.08;
    this.master = c.createGain(); this.master.gain.value = this.muted ? 0 : MASTER_VOL;
    this.master.connect(comp); comp.connect(limiter); limiter.connect(c.destination);
    this.sfx = c.createGain(); this.sfx.gain.value = 1; this.sfx.connect(this.master);
    this.musicBus = c.createGain(); this.musicBus.gain.value = 0.5;
    const hp = c.createBiquadFilter(); hp.type = 'highpass'; hp.frequency.value = 45;
    this.musicLP = c.createBiquadFilter(); this.musicLP.type = 'lowpass'; this.musicLP.frequency.value = 18000;
    this.musicBus.connect(hp); hp.connect(this.musicLP); this.musicLP.connect(this.master);
    const len = c.sampleRate * 2, buf = c.createBuffer(1, len, c.sampleRate), d = buf.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
    this.noise = buf;
    const curve = new Float32Array(256);
    for (let i = 0; i < 256; i++) { const x = i / 128 - 1; curve[i] = Math.tanh(x * 3.5); }
    this.distCurve = curve;
  },
  setMuted(m) {
    this.muted = m;
    if (this.master) this.master.gain.setTargetAtTime(m ? 0 : MASTER_VOL, this.ctx.currentTime, 0.05);
  },
  suspend() { if (this.ctx && this.ctx.state === 'running') this.ctx.suspend(); },
  resume() { if (this.ctx && this.ctx.state === 'suspended') this.ctx.resume(); },
  ok(name, gap) { // rate-limit a sound
    if (!this.ctx || this.muted) return false;
    const t = this.ctx.currentTime;
    if (gap && this.last[name] && t - this.last[name] < gap) return false;
    this.last[name] = t;
    return true;
  },
  at(x, y, maxD = 1400) { return { pan: panOf(x), v: 0.25 + 0.75 * volOf(x, y, maxD) }; },
  out(pan) { // stereo panner (or the bus itself) feeding the sfx bus
    const c = this.ctx;
    if (pan && isFinite(pan) && c.createStereoPanner) { const p = c.createStereoPanner(); p.pan.value = clamp(pan, -1, 1); p.connect(this.sfx); return p; }
    return this.sfx;
  },
  vary(o) { // ±6% pitch and ±2 dB so repeated sounds never sound machine-gunned
    if (o.exact || o.dest === this.musicBus) return [1, 1];
    return [1 + (Math.random() - 0.5) * 0.12, Math.pow(10, (Math.random() * 4 - 2) / 20)];
  },
  envelope(g, t, o, vol) {
    const a = o.a || 0.004;
    g.gain.setValueAtTime(0.0001, t);
    if (o.env === 'hold') { g.gain.exponentialRampToValueAtTime(vol, t + a); g.gain.setValueAtTime(vol, t + o.dur * 0.8); g.gain.exponentialRampToValueAtTime(0.0001, t + o.dur); }
    else if (o.env === 'swell') { g.gain.setValueAtTime(vol * 0.25, t); g.gain.exponentialRampToValueAtTime(vol, t + o.dur * 0.92); g.gain.exponentialRampToValueAtTime(0.0001, t + o.dur); }
    else { g.gain.exponentialRampToValueAtTime(vol, t + a); g.gain.exponentialRampToValueAtTime(0.0001, t + o.dur); }
  },
  noiseHit(o) {
    if (!this.ctx) return;
    if (o.vol !== undefined && (!(o.vol > 0.0005) || !isFinite(o.vol))) return;
    const [pv, vv] = this.vary(o);
    const c = this.ctx, t = c.currentTime + (o.delay || 0);
    const src = c.createBufferSource(); src.buffer = this.noise;
    const rate = (o.rate || 1) * pv;
    src.playbackRate.value = rate;
    const f = c.createBiquadFilter(); f.type = o.type || 'lowpass'; f.Q.value = o.q || 0.7;
    f.frequency.setValueAtTime((o.f0 || 2000) * pv, t);
    if (o.f1) f.frequency.exponentialRampToValueAtTime(o.f1 * pv, t + o.dur);
    const g = c.createGain();
    this.envelope(g, t, o, (o.vol || 0.5) * vv);
    src.connect(f); f.connect(g); g.connect(o.dest || this.out(o.pan));
    src.start(t, Math.random() * Math.max(0, 1.9 - o.dur * rate)); src.stop(t + o.dur + 0.05);
  },
  tone(o) {
    if (!this.ctx) return;
    if (!isFinite(o.f0) || (o.vol !== undefined && (!(o.vol > 0.0005) || !isFinite(o.vol)))) return;
    const [pv, vv] = this.vary(o);
    const c = this.ctx, t = c.currentTime + (o.delay || 0);
    const osc = c.createOscillator(); osc.type = o.wave || 'sine';
    osc.frequency.setValueAtTime(o.f0 * pv, t);
    if (o.f1) osc.frequency.exponentialRampToValueAtTime(Math.max(1, o.f1 * pv), t + o.dur);
    const g = c.createGain();
    this.envelope(g, t, o, (o.vol || 0.3) * vv);
    let node = osc;
    if (o.lp) { const f = c.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = o.lp; node.connect(f); node = f; }
    if (o.dist) { const ws = c.createWaveShaper(); ws.curve = this.distCurve; node.connect(ws); node = ws; }
    node.connect(g); g.connect(o.dest || this.out(o.pan));
    osc.start(t); osc.stop(t + o.dur + 0.05);
  },

  // --- weapons ---
  shot(kind, pan, interval, v = 1) {
    const gap = interval ? Math.min(0.045, interval * 0.8) : (kind === 'smg' ? 0.045 : 0.03);
    if (!this.ok('shot_' + kind, gap)) return;
    switch (kind) {
      case 'pistol':
        this.noiseHit({ f0: 3200, f1: 500, dur: 0.14, vol: 0.55 * v, pan });
        this.tone({ f0: 180, f1: 50, dur: 0.09, vol: 0.5 * v, pan });
        break;
      case 'shotgun':
        this.noiseHit({ f0: 2200, f1: 180, dur: 0.38, vol: 0.9 * v, pan });
        this.tone({ f0: 110, f1: 35, dur: 0.22, vol: 0.8 * v, dist: true, pan });
        this.noiseHit({ type: 'highpass', f0: 2500, dur: 0.05, vol: 0.12 * v, delay: 0.28, pan }); // pump
        this.noiseHit({ type: 'highpass', f0: 1800, dur: 0.05, vol: 0.12 * v, delay: 0.38, pan });
        break;
      case 'smg': {
        const sv = interval ? Math.min(1, Math.sqrt(0.077 / interval)) : 1; // a faster SMG shouldn't just get louder
        this.noiseHit({ type: 'bandpass', f0: 2600, f1: 900, q: 0.9, dur: 0.07, vol: 0.45 * v * sv, pan });
        this.tone({ f0: 160, f1: 70, dur: 0.05, vol: 0.3 * v * sv, pan });
        break;
      }
      case 'gunner':
        this.noiseHit({ type: 'bandpass', f0: 2300, f1: 800, q: 0.9, dur: 0.06, vol: 0.28 * v, pan });
        break;
      case 'rifle':
        this.noiseHit({ f0: 5000, f1: 400, dur: 0.18, vol: 0.6 * v, pan });
        this.tone({ f0: 140, f1: 45, dur: 0.12, vol: 0.55 * v, dist: true, pan });
        break;
    }
  },
  flameStart() {
    if (!this.ctx || this.flame) return;
    const c = this.ctx, src = c.createBufferSource(); src.buffer = this.noise; src.loop = true;
    const f = c.createBiquadFilter(); f.type = 'bandpass'; f.frequency.value = 700; f.Q.value = 0.6;
    const g = c.createGain(); g.gain.value = 0.0001; g.gain.setTargetAtTime(0.35, c.currentTime, 0.04);
    src.connect(f); f.connect(g); g.connect(this.sfx); src.start();
    this.flame = { src, g, f };
  },
  flameStop() {
    if (!this.flame) return;
    const fl = this.flame; this.flame = null;
    fl.g.gain.setTargetAtTime(0.0001, this.ctx.currentTime, 0.06);
    fl.src.stop(this.ctx.currentTime + 0.4);
  },
  dry() { if (this.ok('dry', 0.15)) this.noiseHit({ type: 'highpass', f0: 3500, dur: 0.03, vol: 0.25 }); },
  lowAmmo(frac) { if (this.ok('lowammo', 0.05)) this.tone({ wave: 'square', f0: 2200 + 300 * (1 - frac), dur: 0.02, vol: 0.04, exact: true }); },
  reloadStart() { if (this.ok('rl0', 0.1)) { this.noiseHit({ type: 'bandpass', f0: 1400, q: 3, dur: 0.05, vol: 0.3 }); this.tone({ wave: 'square', f0: 300, f1: 200, dur: 0.03, vol: 0.05 }); } },
  reloadEnd() { if (this.ok('rl1', 0.1)) { this.noiseHit({ type: 'bandpass', f0: 2200, q: 4, dur: 0.04, vol: 0.35 }); this.noiseHit({ type: 'bandpass', f0: 1200, q: 3, dur: 0.06, vol: 0.3, delay: 0.08 }); } },
  reloadTick() { if (this.ok('rltick', 0.3)) this.tone({ wave: 'sine', f0: 1000, dur: 0.03, vol: 0.08, exact: true }); },
  swap() { if (this.ok('swap', 0.08)) this.noiseHit({ type: 'bandpass', f0: 1600, q: 2, dur: 0.06, vol: 0.2 }); },

  // --- impacts ---
  hit(pan, v = 1) { if (this.ok('hit', 0.035)) { this.noiseHit({ type: 'bandpass', f0: 500 + rand(300), q: 1.2, dur: 0.08, vol: 0.35 * v, pan }); this.tone({ f0: 220, f1: 90, dur: 0.07, vol: 0.18 * v, pan }); } },
  crit(pan, v = 1) { if (this.ok('crit', 0.05)) this.tone({ wave: 'triangle', f0: 1400, f1: 700, dur: 0.08, vol: 0.12 * v, pan }); },
  splat(pan, big, v = 1) {
    if (!this.ok('splat', 0.04)) return;
    this.noiseHit({ f0: big ? 900 : 1400, f1: 120, dur: big ? 0.35 : 0.18, vol: (big ? 0.6 : 0.35) * v, pan });
    this.tone({ f0: big ? 120 : 180, f1: 40, dur: big ? 0.25 : 0.12, vol: (big ? 0.4 : 0.22) * v, pan });
  },
  boom(pan, size = 1, v = 1) {
    if (!this.ok('boom', 0.06)) return;
    this.noiseHit({ f0: 1400, f1: 60, dur: 0.9 * size, vol: 0.95 * v, pan, rate: 0.7 });
    this.tone({ f0: 80, f1: 25, dur: 0.7 * size, vol: 0.6 * v, dist: true, pan });
    this.noiseHit({ type: 'highpass', f0: 2000, dur: 0.12, vol: 0.3 * v, pan });
  },
  groan(pan, vol, pitch = 1) {
    if (!(vol > 0.01) || !isFinite(vol)) return;
    if (!this.ok('groan', 0.35)) return;
    const c = this.ctx, t = c.currentTime, dur = rand(0.7, 1.4);
    const osc = c.createOscillator(); osc.type = 'sawtooth';
    const base = rand(70, 110) * pitch;
    osc.frequency.setValueAtTime(base, t);
    osc.frequency.linearRampToValueAtTime(base * rand(0.7, 1.25), t + dur);
    const lfo = c.createOscillator(); lfo.frequency.value = rand(5, 9);
    const lg = c.createGain(); lg.gain.value = base * 0.06; lfo.connect(lg); lg.connect(osc.frequency);
    const f = c.createBiquadFilter(); f.type = 'bandpass'; f.Q.value = 4;
    f.frequency.setValueAtTime(rand(450, 700), t); f.frequency.linearRampToValueAtTime(rand(300, 900), t + dur);

    g.gain.exponentialRampToValueAtTime(vol * 0.5, t + 0.15); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);

  },
  spit(pan) { if (this.ok('spit', 0.1)) this.noiseHit({ type: 'bandpass', f0: 1800, f1: 600, q: 2, dur: 0.18, vol: 0.3, pan }); },
  howl(pan) { this.tone({ wave: 'sawtooth', f0: 300, f1: 700, dur: 0.8, vol: 0.15, lp: 2000, pan, env: 'hold' }); },
  scream(pan) {
    if (!this.ok('scream', 0.5)) return;
    this.tone({ wave: 'sawtooth', f0: 700, f1: 1500, dur: 0.9, vol: 0.16, lp: 3000, pan, env: 'hold' });
    this.tone({ wave: 'sawtooth', f0: 740, f1: 1400, dur: 0.9, vol: 0.12, lp: 3000, pan, env: 'hold' });
  },
  fuse(pan, v = 1) { // gasbag about to pop: rises and peaks right at the blast
    this.tone({ wave: 'square', f0: 300, f1: 900, dur: 1.2, vol: 0.12 * v, lp: 1800, pan, env: 'swell' });
  },
  windup(pan, v = 1) { // rammer rearing up
    this.tone({ wave: 'sawtooth', f0: 60, f1: 140, dur: 0.7, vol: 0.3 * v, lp: 600, dist: true, pan, env: 'swell' });
    this.tone({ wave: 'sawtooth', f0: 180, f1: 420, dur: 0.7, vol: 0.1 * v, lp: 1500, pan, env: 'swell' });
  },
  slamTele(dur, pan) {
    this.tone({ wave: 'sawtooth', f0: 50, f1: 90, dur, vol: 0.35, lp: 500, dist: true, env: 'swell', pan });
    this.tone({ wave: 'sawtooth', f0: 150, f1: 320, dur, vol: 0.12, lp: 1400, env: 'swell', pan });
  },
  giantThrow(pan) { this.tone({ wave: 'sawtooth', f0: 80, f1: 170, dur: 0.5, vol: 0.3, lp: 900, dist: true, env: 'swell', pan }); },
  roar(pan) {
    if (!this.ok('roar', 0.8)) return;
    this.tone({ wave: 'sawtooth', f0: 70, f1: 40, dur: 1.6, vol: 0.55, dist: true, lp: 900, pan, env: 'hold' });
    this.tone({ wave: 'sawtooth', f0: 104, f1: 55, dur: 1.5, vol: 0.4, dist: true, lp: 700, pan, env: 'hold' });
    this.noiseHit({ f0: 1200, f1: 200, dur: 1.4, vol: 0.4, a: 0.2, pan });
  },
  stomp(pan, v = 1) {
    if (!this.ok('stomp', 0.12)) return;
    this.tone({ f0: 70, f1: 30, dur: 0.3, vol: 0.55 * v, pan });
    this.noiseHit({ f0: 500, f1: 120, dur: 0.18, vol: 0.4 * v, pan }); // audible on laptop speakers
  },
  hordeHorn(angles) { // one horn per direction so you can hear where they come from
    for (const a of angles) {
      const pan = Math.cos(a) * 0.9, lp = Math.sin(a) > 0.5 ? 420 : 760, v = 0.22 / Math.sqrt(angles.length);
      for (const d of [0, 1.5]) { this.tone({ wave: 'sawtooth', f0: 110, dur: 1.2, vol: v, lp, pan, env: 'hold', delay: d }); this.tone({ wave: 'sawtooth', f0: 113, dur: 1.2, vol: v, lp, pan, env: 'hold', delay: d }); }
    }
  },
  plane(pan, v) { if (this.ok('plane', 1.2)) this.noiseHit({ f0: 300, f1: 200, dur: 1.4, vol: 0.2 * v, a: 0.4, pan }); },

  // --- player / ui ---
  hurt() {
    if (!this.ok('hurt', 0.12)) return;
    this.tone({ wave: 'square', f0: 240, f1: 90, dur: 0.18, vol: 0.2, lp: 1500 });
    this.noiseHit({ f0: 1500, f1: 300, dur: 0.15, vol: 0.3 });
  },
  dash() { if (this.ok('dash', 0.1)) this.noiseHit({ type: 'bandpass', f0: 600, f1: 2400, q: 1.5, dur: 0.22, vol: 0.35 }); },
  xp(combo) {
    if (!this.ok('xp', 0.03)) return;
    const f = 660 * Math.pow(2, Math.min(combo, 24) / 24);
    this.tone({ wave: 'triangle', f0: f, f1: f * 1.5, dur: 0.07, vol: 0.07, exact: true });
  },
  pickup() { if (this.ok('pick', 0.08)) [0, 0.06, 0.12].forEach((d, i) => this.tone({ wave: 'triangle', f0: [523, 659, 784][i], dur: 0.12, vol: 0.15, delay: d, exact: true })); },
  heal() { if (this.ok('heal', 0.1)) [0, 0.08, 0.16, 0.24].forEach((d, i) => this.tone({ wave: 'sine', f0: [392, 523, 659, 784][i], dur: 0.2, vol: 0.16, delay: d, exact: true })); },
  elite(v) { if (this.ok('elite', 0.5)) this.tone({ wave: 'triangle', f0: 1600, f1: 2400, dur: 0.3, vol: 0.06 * v }); },
  levelUp() {
    if (!this.ok('lvl', 0.2)) return;
    [0, 0.07, 0.14, 0.21, 0.3].forEach((d, i) => this.tone({ wave: 'triangle', f0: [440, 554, 659, 880, 1109][i], dur: 0.35, vol: 0.18, delay: d, exact: true }));
  },
  click() { if (this.ok('click', 0.04)) this.tone({ wave: 'square', f0: 900, f1: 600, dur: 0.04, vol: 0.06, exact: true }); },
  select() { if (this.ok('sel', 0.1)) { this.tone({ wave: 'triangle', f0: 660, dur: 0.1, vol: 0.14, exact: true }); this.tone({ wave: 'triangle', f0: 990, dur: 0.18, vol: 0.14, delay: 0.07, exact: true }); } },
  radio() {
    if (!this.ok('radio', 0.5)) return;
    this.noiseHit({ type: 'bandpass', f0: 1800, q: 1.5, dur: 0.25, vol: 0.25 });
    this.tone({ wave: 'square', f0: 1200, dur: 0.08, vol: 0.06, delay: 0.05, exact: true });

// --- town generation -----------------------------------------------------
function generateTown(seed, depth = 0) {
  const rng = mulberry32(seed);

  kinds[far[0]] = 'park'; kinds[far[1]] = 'park';

  kinds[rest[0]] = 'lot'; kinds[rest[1]] = 'gas'; kinds[rest[2]] = 'warehouse'; kinds[rest[3]] = 'compound'; kinds[rest[4]] = 'park';
  const inner = [6, 7, 8, 11, 13, 16, 17, 18].filter(i => kinds[i] === 'houses');
  if (inner.length) kinds[inner[(rng() * inner.length) | 0]] = 'lot2';

  for (let by = 0; by < 5; by++) for (let bx = 0; bx < 5; bx++) {
    const kind = kinds[by * 5 + bx], x = blockX(bx), y = blockX(by);
    const blk = { kind, x, y, w: BLOCK, h: BLOCK, cx: x + BLOCK / 2, cy: y + BLOCK / 2 };
    Town.blocks.push(blk);

  }

  const addBuilding = (x, y, w, h, kind, palIdx) => {
    const b = { x, y, w, h, kind, pal: ROOFS[palIdx !== undefined ? palIdx : (rng() * ROOFS.length) | 0], wall: pick(['#b9a88f', '#9d8f7b', '#a3a8ab', '#c2b59b', '#8f7d6a']) };

  };

    const len = 96, wid = 44;
    const w = vertical ? wid : len, h = vertical ? len : wid;
    if (!rectFree(x, y, w, h)) return null;
    const p = { type: 'car', x, y, w, h, vertical, canvas: paintCar(len, wid, color || pick(CAR_COLORS), wrecked, rng), flip: rng() < 0.5 };
    Town.props.push(p); fillSolid(x + 2, y + 2, w - 4, h - 4, 2);

  };
  const addTree = (x, y, r) => {
    if (tileAt(x, y) !== 0) return;
    Town.trees.push({ x, y, r, canvas: paintTree(r, rng, rng() < 0.5), fade: 1 });
    fillSolid(x - 8, y - 8, 16, 16, 4);
  };
  const addFence = (x, y, len, vertical, gapAt, gapLen = 60, style = 'wood') => {
    // splits into segments leaving a gap
    const segs = gapAt === undefined ? [[0, len]] : [[0, gapAt], [gapAt + gapLen, len]];
    for (const [a, b] of segs) {
      if (b - a < 20) continue;
      const f = vertical ? { x, y: y + a, w: 20, h: b - a, vertical, style } : { x: x + a, y, w: b - a, h: 20, vertical, style };
      Town.fences.push(f); fillSolid(f.x, f.y, f.w, f.h, 3);
    }
  };

  for (const blk of Town.blocks) {
    const { x, y, kind } = blk;
    if (kind === 'houses') {
      const split = rng() < 0.5 ? 'q' : 'h';
      const lots = split === 'q' ? [[0, 0], [200, 0], [0, 200], [200, 200]].map(([ox, oy]) => [x + ox, y + oy, 200, 200])

      for (const [lx, ly, lw, lh] of lots) {
        const bw = Math.min(lw - 60, 20 * Math.floor((100 + rng() * (lw === 400 ? 160 : 60)) / 20));
        const bh = 20 * Math.floor((100 + rng() * 40) / 20);

        const byy = ly + 20 * Math.floor((20 + rng() * (lh - bh - 40)) / 20);

      }

      }
    } else if (kind === 'park') {
      const n = 5 + ((rng() * 4) | 0);
      for (let i = 0; i < n; i++) {

    } else if (kind === 'gas') {
      addBuilding(x + 240, y + 40, 140, 120, 'flat', 1);
      for (const [ox, oy] of [[80, 220], [180, 220]]) { Town.props.push({ type: 'pump', x: x + ox, y: y + oy, w: 20, h: 40 }); fillSolid(x + ox, y + oy, 20, 40, 2); }

    } else if (kind === 'warehouse') {
      addBuilding(x + 40, y + 60, 320, 200, 'flat', 3);
      for (let i = 0; i < 4; i++) Town.props.push({ type: 'crateStack', x: x + 50 + i * 80, y: y + 300, w: 40, h: 40 }), fillSolid(x + 50 + i * 80, y + 300, 40, 40, 2);

    } else if (kind === 'compound') {
      // walled yard with two gates, small building inside: a defendable spot

      addFence(x + 20, y + 360, 360, false, 150, 60, 'wall');
      addFence(x + 20, y + 40, 320, true, undefined, 0, 'wall');
      addFence(x + 360, y + 40, 320, true, undefined, 0, 'wall');
      addBuilding(x + 140, y + 120, 120, 100, 'flat', 4);

    const sx = streetsX[i], sy = blockX(j);

// Removes props/fences that seal off areas: every free tile must be reachable from the start.
function ensureConnected() {
  let total = 0;
  for (let pass = 0; pass < 4; pass++) {
    const seen = new Uint8Array(MT * MT), q = new Int32Array(MT * MT);
    const st = Math.floor(Town.start.y / TILE) * MT + Math.floor(Town.start.x / TILE);
    let h = 0, t = 0; q[t++] = st; seen[st] = 1;
    while (h < t) {
      const i = q[h++], x = i % MT, y = (i / MT) | 0;
      if (x > 0 && !seen[i - 1] && !solid[i - 1]) { seen[i - 1] = 1; q[t++] = i - 1; }
      if (x < MT - 1 && !seen[i + 1] && !solid[i + 1]) { seen[i + 1] = 1; q[t++] = i + 1; }
      if (y > 0 && !seen[i - MT] && !solid[i - MT]) { seen[i - MT] = 1; q[t++] = i - MT; }
      if (y < MT - 1 && !seen[i + MT] && !solid[i + MT]) { seen[i + MT] = 1; q[t++] = i + MT; }
    }
    let fixed = 0;
    for (let i = 0; i < MT * MT; i++) {
      if (solid[i] || seen[i]) continue;
      // unreachable free tile: knock out adjacent removable blockers (props / fences / trunks)
      const x = i % MT, y = (i / MT) | 0;
      for (const [dx, dy] of [[1, 0], [-1, 0], [0, 1], [0, -1]]) {
        const nx = x + dx, ny = y + dy; if (nx < 0 || ny < 0 || nx >= MT || ny >= MT) continue;
        const v = solid[ny * MT + nx];
        if (v === 2 || v === 3 || v === 4) { solid[ny * MT + nx] = 0; fixed++; total++; }
      }
    }
    if (!fixed) {
      // anything still unreachable is enclosed by buildings: make it solid so nothing spawns there
      for (let i = 0; i < MT * MT; i++) if (!solid[i] && !seen[i]) solid[i] = 5;
      break;
    }
  }
  return total;

// Visibility polygon (buildings cast shadows for the flashlight)

const ZVARIANTS = { shambler: 4 };

function buildZombieSprites() {
  for (const type in ZPAINT) {
    const def = ZTYPES[type];
    const ext = def.r * 2 + (type === 'knot' || type === 'giant' ? 34 : 20);
    const S = Math.ceil(ext * SPR);
    const variants = ZVARIANTS[type] || 1;
    const set = [];
    for (let v = 0; v < variants; v++) {
      const frames = [];
      for (const f of [-1, 0, 1]) {
        const c = makeCanvas(S, S), g = c.getContext('2d');
        g.setTransform(SPR, 0, 0, SPR, S / 2, S / 2);
        ZPAINT[type](g, f, v);
        frames.push(c);
      }
      set.push(frames);
    }
    const tint = (col) => { const c = makeCanvas(S, S), g = c.getContext('2d'); g.drawImage(set[0][1], 0, 0); g.globalCompositeOperation = 'source-atop'; g.fillStyle = col; g.fillRect(0, 0, S, S); return c; };
    const corpse = makeCanvas(S, S), cg = corpse.getContext('2d');
    cg.drawImage(set[0][1], 0, 0); cg.globalCompositeOperation = 'source-atop'; cg.fillStyle = 'rgba(38,22,18,0.62)'; cg.fillRect(0, 0, S, S);
    Sprites.zombie[type] = { set, flash: tint('#ffffff'), burn: tint('#ff7a1a'), gold: tint('#ffd24a'), corpse, size: ext };
  }
}

function buildGemSprites() {
  const tiers = [['#5dff8a', '#1d7a3a'], ['#4fc3ff', '#1a4f8a'], ['#c77dff', '#5a2a8a'], ['#ffd24a', '#8a6410'], ['#ffffff', '#ff5ab4']];
  for (const [hi, lo] of tiers) {
    const S = 28 * 2, c = makeCanvas(S, S), g = c.getContext('2d');
    g.setTransform(2, 0, 0, 2, S / 2, S / 2);
    const gr = g.createRadialGradient(0, 0, 0, 0, 0, 12); gr.addColorStop(0, hi + '88'); gr.addColorStop(1, hi + '00');
    g.fillStyle = gr; g.beginPath(); g.arc(0, 0, 12, 0, TAU); g.fill();
    g.fillStyle = lo; g.beginPath(); g.moveTo(0, -6.5); g.lineTo(5, 0); g.lineTo(0, 6.5); g.lineTo(-5, 0); g.closePath(); g.fill();
    g.fillStyle = hi; g.beginPath(); g.moveTo(0, -5); g.lineTo(3.6, 0); g.lineTo(0, 5); g.lineTo(-3.6, 0); g.closePath(); g.fill();
    g.fillStyle = 'rgba(255,255,255,0.8)'; g.beginPath(); g.moveTo(0, -4.5); g.lineTo(1.8, -0.5); g.lineTo(-1.8, -0.5); g.closePath(); g.fill();
    Sprites.gem.push(c);
  }
}

function wStat(P, id) { // effective weapon stats with cards applied
  const w = WEAPONS[id], ws = P.weapons[id], st = P.st;

  return {
    mag: Math.round(w.mag * st.magMul * (1 + 0.2 * ws.mastery)),

}

}

  if (P.cur !== id) P.last = P.cur;
  P.cur = id; P.swapT = 0.2; P.reloading = false; P.jam = 0; P.bloom = 0; P.spin = 0;
  if (P.flaming) { P.flaming = false; Sound.flameStop(); }

  const w = WEAPONS[P.cur], ws = P.weapons[P.cur], es = wStat(P, P.cur);
  const need = Math.ceil(es.mag - ws.mag);
  const take = w.reserve === Infinity ? need : Math.min(need, Math.floor(ws.reserve));

function updatePlayer(P, dt) {
  const st = P.st;
  if (P.dead) return;
  // --- movement ---
  let mx = 0, my = 0;
  if (keys.KeyW || keys.ArrowUp) my -= 1; if (keys.KeyS || keys.ArrowDown) my += 1;
  if (keys.KeyA || keys.ArrowLeft) mx -= 1; if (keys.KeyD || keys.ArrowRight) mx += 1;
  const tv = Touch.on ? touchMoveVec() : null;
  if (tv) { mx = tv[0]; my = tv[1]; }
  if (G.botInput) { mx = G.botInput.mx; my = G.botInput.my; }
  const ml = Math.hypot(mx, my); if (ml > 1) { mx /= ml; my /= ml; } // keys give 1 or √2; the touch stick is analog (≤ 1)
  const cornered = st.cornered && P.hp < P.maxHp * 0.3;
  const firing = (mouse.down || (G.botInput && G.botInput.fire)) && P.swapT <= 0;
  const spd = 200 * st.speedMul * (cornered ? 1.25 : 1) * (firing ? 0.9 : 1);
  const tx = mx * spd, ty = my * spd;
  const acc = (ml > 0 ? spd / 0.08 : spd / 0.06) * dt;
  const dvx = tx - P.vx, dvy = ty - P.vy, dl = Math.hypot(dvx, dvy);
  if (dl <= acc) { P.vx = tx; P.vy = ty; } else { P.vx += dvx / dl * acc; P.vy += dvy / dl * acc; }
  // --- dash ---
  P.dashCd -= dt; P.iframes -= dt;
  if (P.dashT > 0) {
    P.dashT -= dt;
    const n = Math.max(1, Math.ceil(750 * dt / 8)); // sub-steps so a dash can't tunnel through thin walls
    for (let i = 0; i < n; i++) { P.x += P.dashX * 750 * dt / n; P.y += P.dashY * 750 * dt / n; collideWorld(P); }
    if (G.frame % 2 === 0) G.afterimages.push({ x: P.x, y: P.y, a: P.angle, t: 0.25 });
    Grid.query(P.x, P.y, 60, z => {
      if (P.dashHit.has(z.id) || Math.hypot(z.x - P.x, z.y - P.y) > z.r + P.r + 6) return;
      P.dashHit.add(z.id);
      hurtZombie(z, 10 * st.shoulderMul, P.dashX, P.dashY, 220, 'dash');
    });

  const ox = P.x, oy = P.y;
  P.x += (P.vx + P.pushX) * dt; P.y += (P.vy + P.pushY) * dt;
  if (!isFinite(P.x) || !isFinite(P.y)) { P.x = ox; P.y = oy; P.vx = P.vy = P.pushX = P.pushY = 0; } // failsafe
  const pk = Math.exp(-8 * dt); P.pushX *= pk; P.pushY *= pk;
  collideWorld(P);
  let pushed = false;
  for (const b of G.barrels) if (b.alive) { const d = Math.hypot(P.x - b.x, P.y - b.y); if (d < P.r + 11 && d > 0.01) { P.x = b.x + (P.x - b.x) / d * (P.r + 11); P.y = b.y + (P.y - b.y) / d * (P.r + 11); pushed = true; } }
  if (pushed) collideWorld(P);
  P.anim += Math.hypot(P.vx, P.vy) * dt * 0.06;
  // --- aim ---
  if (G.botInput) P.angle = G.botInput.aim;
  else { const wx = G.cam.x + (mouse.x - W / 2) / zoom, wy = G.cam.y + (mouse.y - H / 2) / zoom; P.angle = Math.atan2(wy - P.y, wx - P.x); }
  // --- regen, bucket ---
  if (st.regen > 0 && G.t - (P.lastHurtT || -9) > 3) P.hp = Math.min(P.maxHp, P.hp + st.regen * dt);

  Sound.setLowHp(lowHp);
  updateWeapon(P, dt, firing);
}

function doDash(P) {
  if (P.dead || P.dashCd > 0 || P.dashT > 0) return;
  let dx = P.vx, dy = P.vy, l = Math.hypot(dx, dy);
  if (l < 20) { dx = Math.cos(P.angle); dy = Math.sin(P.angle); l = 1; }
  P.dashX = dx / l; P.dashY = dy / l; P.dashT = 0.16; P.iframes = Math.max(P.iframes, 0.25);
  P.dashCd = 1.6 * P.st.dashCdMul; P.dashHit.clear();

function throwGrenade(P) {
  if (P.dead || P.grenades <= 0) return;
  P.grenades--;
  const wx = G.botInput ? P.x + Math.cos(P.angle) * 300 : G.cam.x + (mouse.x - W / 2) / zoom;
  const wy = G.botInput ? P.y + Math.sin(P.angle) * 300 : G.cam.y + (mouse.y - H / 2) / zoom;
  const sx = P.x + Math.cos(P.angle) * 14, sy = P.y + Math.sin(P.angle) * 14;
  let tx = wx - P.x, ty = wy - P.y; const td = Math.hypot(tx, ty);
  if (td > 380) { tx *= 380 / td; ty *= 380 / td; }
  const dx = P.x + tx - sx, dy = P.y + ty - sy; // fly from the hand to exactly the (clamped) cursor
  G.grenades.push({ x: sx, y: sy, vx: dx / 0.5, vy: dy / 0.5, t: 0, h: 0, rot: 0 });

function updateWeapon(P, dt, firing) {
  const id = P.cur, w = WEAPONS[id], ws = P.weapons[id], es = wStat(P, id), st = P.st;
  P.fireCd -= dt; P.recoil = Math.max(0, P.recoil - dt * 60); P.muzzle -= dt;
  P.bloom = Math.max(0, P.bloom - 20 * dt);
  if (P.swapT > 0) { P.swapT -= dt; if (P.flaming) { P.flaming = false; Sound.flameStop(); } return; }
  if (P.jam > 0) { P.jam -= dt; return; }
  if (!(firing && id === 'smg')) P.spin = Math.max(0, P.spin - dt * 2);
  // frenzy decay
  if (st.frenzy && G.t - G.lastFrenzyKill > 1.5) G.frenzyStacks = 0;

}
function startHeli() {

function updateLZ(dt) {

    H.search += dt;
    const vol = clamp(1 - Math.hypot(H.x - P.x, H.y - P.y) / 1800, 0.15, 1);
    Sound.rotorUpdate(G.state === 'play' ? vol : 0);
    // door gunner: 3 kills per second near the LZ

      H.gunCd -= dt;

        H.gunCd = 0.6;
        let target = null, bd = 230;
        for (const z of G.zombies) { if (z.dead || z.boss) continue; const pd = Math.hypot(z.x - P.x, z.y - P.y); if (pd < bd) { bd = pd; target = z; } }
        if (target) {
          G.tracers.push({ x0: H.x, y0: H.y + 10, x1: target.x, y1: target.y, t: 0.1, max: 0.1, col: '#ffe08a', w: 2, top: true });
          killZombie(target, 'gunner', (target.x - H.x) / 400, (target.y - H.y) / 400);
          Sound.shot('gunner', panOf(H.x), 0, 0.3 + 0.7 * volOf(H.x, H.y, 1800));
        }
      }
    }
    if (L.holdDone) {

    }
  }
  if (!L) return;
  const inside = Math.hypot(P.x - L.x, P.y - L.y) < L.r;
  if (L.holdOpen && !L.holdDone && !P.dead) {
    if (inside) {
      const before = L.hold; L.hold = Math.min(HOLD_TIME, L.hold + dt);
      if (Math.floor(before) !== Math.floor(L.hold)) Sound.lzTick(Math.floor(L.hold));
    } else if (L.hold > 0) Sound.lzOut();
    if (L.hold >= HOLD_TIME && G.t >= 600 - 0.05) {

      Sound.radio(); Sound.levelUp();

    }
  }
  if (P.boarding > 0) {

    if (H) { const dx = H.x - P.x, dy = H.y + 10 - P.y, d = Math.hypot(dx, dy); if (d > 3) { P.x += dx / d * Math.min(d, 160 * dt); P.y += dy / d * Math.min(d, 160 * dt); } }
    if (P.boarding > 2.2 && G.state === 'play') winGame();

}

// ---------------------------------------------------------------------
// Pickups, gems, level-ups
// ---------------------------------------------------------------------
function updatePickups(dt) {
  const P = G.P, mag = 100 * P.st.pickupMul;
  if (P.dead) return;
  G.gemChainT -= dt; if (G.gemChainT <= 0) G.gemChain = 0;
  for (let i = G.gems.length - 1; i >= 0; i--) {
    const g = G.gems[i];
    g.age += dt;
    const dx = P.x - g.x, dy = P.y - g.y, d = Math.hypot(dx, dy);
    if (!g.fly && d < mag && !P.dead) g.fly = true;
    if (g.fly) {
      g.v = Math.min(700, g.v + 1800 * dt);
      g.x += dx / (d || 1) * g.v * dt; g.y += dy / (d || 1) * g.v * dt;
      if (d < P.r + 6) {
        G.gems[i] = G.gems[G.gems.length - 1]; G.gems.pop();
        addXp(g.value);
        G.gemChain++; G.gemChainT = 0.5; Sound.xp(G.gemChain);
      }
    }
  }
  for (let i = G.pickups.length - 1; i >= 0; i--) {
    const p = G.pickups[i];
    p.t -= dt; p.bob += dt * 4;
    if (p.t <= 0) { G.pickups.splice(i, 1); continue; }
    const dx = P.x - p.x, dy = P.y - p.y, d = Math.hypot(dx, dy);
    if (p.kind === 'med' && P.hp >= P.maxHp - 1) { p.fly = false; p.v = 0; continue; } // save it for later
    if (!p.fly && d < mag && !P.dead) p.fly = true;
    if (p.fly) { p.v = Math.min(700, p.v + 1800 * dt); p.x += dx / (d || 1) * p.v * dt; p.y += dy / (d || 1) * p.v * dt; }
    if (d < P.r + 10) {
      G.pickups.splice(i, 1);
      if (p.kind === 'ammo') {
        for (const id of WORDER) { const ws = P.weapons[id]; if (!ws.owned || id === 'sidearm') continue; const mx = wStat(P, id).reserveMax; ws.reserve = Math.min(mx, ws.reserve + Math.round(mx * 0.4 * P.st.ammoBoxMul)); }
        floater(P.x, P.y - 22, 'AMMO', '#e8c04a'); Sound.pickup();
        if (P.cur === 'sidearm' && P.last !== 'sidearm' && P.weapons[P.last].owned && P.weapons[P.last].reserve > 0) switchWeapon(P, P.last); // back to the big gun
      } else if (p.kind === 'med') {
        const h = Math.min(30, P.maxHp - P.hp); P.hp += h; floater(P.x, P.y - 22, '+' + Math.round(h) + ' HP', '#6aff8a'); Sound.heal();
      } else if (p.kind === 'nade') {
        if (P.grenades < P.st.grenadeCap) P.grenades++; floater(P.x, P.y - 22, 'GRENADE', '#b8d890'); Sound.pickup();
      }
    }
  }
}
function addXp(v) {
  G.xp += v;
  while (G.xp >= G.xpNext) { G.xp -= G.xpNext; G.level++; G.xpNext = 8 + 6 * G.level; G.pendingLevels++; if (G.level === 15) G.rerolls++; }
}
function levelUpCheck(dt) {
  if (G.modal || G.P.dead || G.P.boarding || (G.lz && G.lz.holdOpen)) return; // never interrupt the last stand
  if (G.pendingLegendary) { G.legendaryDelay = (G.legendaryDelay || 0) - dt; if (G.legendaryDelay <= 0) { G.pendingLegendary = false; openCards('legendary'); } return; }

function cardEligible(c, P, legendaryOnly) {
  const have = G.cards[c.id] || 0;
  if (have >= c.max) return false;
  if (c.kind === 'weapon' && !P.weapons[c.weapon].owned) return false;
  if (c.kind === 'legendary' && !legendaryOnly && G.level < 5) return false;
  if (legendaryOnly) return c.kind === 'legendary';
  return true;
}
function rollCards(mode) {
  const P = G.P;
  const pool = CARDS.filter(c => cardEligible(c, P, mode === 'legendary'));
  const W8 = { common: 70, weapon: 20, legendary: 10 };
  const counts = {}; for (const c of pool) counts[c.kind] = (counts[c.kind] || 0) + 1;
  const weight = c => mode === 'legendary' ? 1 : W8[c.kind] / counts[c.kind];
  const out = [];
  const avail = pool.slice();
  while (out.length < 3 && avail.length) {
    let tot = 0; for (const c of avail) tot += weight(c);
    let r = Math.random() * tot, idx = 0;
    for (; idx < avail.length - 1; idx++) { r -= weight(avail[idx]); if (r <= 0) break; }
    out.push(avail[idx]); avail.splice(idx, 1);
  }
  if (mode !== 'legendary' && !out.some(c => c.D)) {
    const ds = avail.filter(c => c.D);
    if (ds.length) out[out.length - 1 >= 0 ? Math.min(2, out.length - 1) : 0] = pick(ds);
  }
  if (mode === 'legendary') { // pad with commons if legendaries ran out
    const commons = CARDS.filter(c => cardEligible(c, P, false) && c.kind !== 'legendary' && !out.includes(c));
    while (out.length < 3 && commons.length) out.push(commons.splice((Math.random() * commons.length) | 0, 1)[0]);
  }
  while (out.length < 3) out.push({ id: 'rations', name: 'Field Rations', kind: 'common', max: 99, text: 'Heal 25 HP', icon: 'medic', apply: (s, P) => { P.hp = Math.min(P.maxHp, P.hp + 25); } });
  return out.map(c => ({ card: c }));
}
function openCards(mode) {
  G.modal = { type: 'cards', mode, options: rollCards(mode), lock: 0.35, t: 0, hover: -1 };
  G.state = 'cards';
  Sound.flameStop(); G.P.flaming = false;
  if (mode === 'legendary') Sound.tone({ wave: 'sine', f0: 1200, f1: 2400, dur: 0.8, vol: 0.1 });
}
function openCrateChoice(c) {
  const P = G.P;
  const unowned = WORDER.filter(id => !P.weapons[id].owned && (id !== 'flamer' || c.n >= 3));
  const opts = [];
  const shuffled = unowned.sort(() => Math.random() - 0.5);
  if (c.armory && unowned.includes('flamer')) { opts.push({ weapon: 'flamer' }); shuffled.splice(shuffled.indexOf('flamer'), 1); }
  while (opts.length < 2 && shuffled.length) opts.push({ weapon: shuffled.shift() });
  const mastery = WORDER.filter(id => P.weapons[id].owned && P.weapons[id].mastery < 2 && id !== 'sidearm').concat(P.weapons.sidearm.mastery < 2 ? ['sidearm'] : []);
  while (opts.length < 2 && mastery.length) opts.push({ mastery: mastery.splice((Math.random() * mastery.length) | 0, 1)[0] });
  opts.push({ resupply: true });
  G.modal = { type: 'crate', options: opts, lock: 0.35, t: 0, hover: -1, armory: c.armory };
  G.state = 'cards';
  Sound.flameStop(); P.flaming = false;
}
function chooseOption(i) {
  const M = G.modal; if (!M || M.lock > 0) return;
  const o = M.options[i]; if (!o) return;
  const P = G.P;
  if (M.type === 'cards') {
    const c = o.card;
    G.cards[c.id] = (G.cards[c.id] || 0) + 1;
    c.apply(P.st, P);
    G.timeline.push({ id: c.id, icon: c.icon, t: G.t, kind: c.kind });
    if (M.mode === 'level' && G.pendingLevels > 0) { // several level-ups banked: pick them on one screen
      G.pendingLevels--; M.options = rollCards('level'); M.t = 0.2; M.lock = 0.3; Sound.select(); return;
    }
    if (c.id === 'slick' || c.id === 'pockets') { /* stats refresh automatically */ }
  } else {
    if (o.weapon) { giveWeapon(P, o.weapon); G.timeline.push({ weapon: o.weapon, t: G.t, kind: 'crate' }); banner(WEAPONS[o.weapon].name.toUpperCase(), Touch.on ? 'Equipped. Tap SWAP or slot ' + WEAPONS[o.weapon].slot + ' to switch.' : 'Equipped. It lives on key ' + WEAPONS[o.weapon].slot + '.', '#ffd27a', 2); }
    else if (o.mastery) { P.weapons[o.mastery].mastery++; G.timeline.push({ weapon: o.mastery, mastery: true, t: G.t, kind: 'crate' }); }
    else if (o.resupply) {
      for (const id of WORDER) { const ws = P.weapons[id]; if (ws.owned && id !== 'sidearm') ws.reserve = wStat(P, id).reserveMax; }
      P.grenades = Math.min(P.st.grenadeCap, P.grenades + 2); P.hp = Math.min(P.maxHp, P.hp + 25);
      G.timeline.push({ resupply: true, t: G.t, kind: 'crate' });

  G.rerolls--; M.options = rollCards(M.mode); M.t = 0; Sound.click();

  const P = G.P; P.hp = Math.min(P.maxHp, P.hp + P.maxHp * 0.3);

// ---------------------------------------------------------------------
// Particles, corpses, misc timers
// ---------------------------------------------------------------------
function updateParticles(dt) {
  const g = Town.dctx;
  let bakeN = 0;
  for (let i = 0; i < PMAX; i++) {
    const p = parts[i];
    if (!p.on) continue;
    p.life -= dt;
    const dk = Math.exp(-p.drag * dt);
    p.vx *= dk; p.vy *= dk;
    p.x += p.vx * dt; p.y += p.vy * dt; p.rot += p.vr * dt;
    p.size += p.grow * dt;
    if (p.grav) {
      p.vz -= p.grav * dt; p.z += p.vz * dt;
      if (p.z <= 0) {
        p.z = 0;
        if (p.bounces > 0) { p.bounces--; p.vz = -p.vz * 0.4; p.vx *= 0.6; p.vy *= 0.6; }
        else {
          // landed: bake onto the ground
          if (p.type === 'blood') { if ((bakeN++ & 1) === 0) { g.fillStyle = p.col; g.globalAlpha = 0.6; g.beginPath(); g.arc(p.x, p.y, p.size * 0.9, 0, TAU); g.fill(); g.globalAlpha = 1; } }
          else if (p.type === 'chunk' || p.type === 'shell' || p.type === 'debris') { g.save(); g.translate(p.x, p.y); g.rotate(p.rot); g.fillStyle = p.col; g.globalAlpha = p.type === 'shell' ? 0.8 : 0.9; g.fillRect(-p.size, -p.size * 0.5, p.size * 2, p.size); g.restore(); }
          p.on = false; continue;
        }
      }
    }
    if (p.life <= 0) p.on = false;
  }
  // corpses squash then bake
  for (let i = G.corpses.length - 1; i >= 0; i--) {
    const c = G.corpses[i];
    c.t += dt;
    if (c.t >= 0.15) {
      const S = Sprites.zombie[c.type];
      const img = S.corpse;
      const sz = S.size * c.scale;
      g.save(); g.translate(c.x, c.y); g.rotate(c.a); g.scale(1, 0.6); g.globalAlpha = 0.5;
      g.drawImage(img, -sz / 2, -sz / 2, sz, sz);
      g.restore();
      G.corpses.splice(i, 1);
    }
  }
  for (let i = G.rings.length - 1; i >= 0; i--) { const r = G.rings[i]; r.t -= dt; if (r.t <= 0) G.rings.splice(i, 1); }
  for (let i = G.tracers.length - 1; i >= 0; i--) { const r = G.tracers[i]; r.t -= dt; if (r.t <= 0) G.tracers.splice(i, 1); }
  for (let i = G.floaters.length - 1; i >= 0; i--) { const f = G.floaters[i]; f.life -= dt; f.y -= 26 * dt; if (f.life <= 0) G.floaters.splice(i, 1); }
  for (let i = G.afterimages.length - 1; i >= 0; i--) { const a = G.afterimages[i]; a.t -= dt; if (a.t <= 0) G.afterimages.splice(i, 1); }
  for (let i = G.edgeWarn.length - 1; i >= 0; i--) { const e = G.edgeWarn[i]; e.t -= dt; if (e.t <= 0) G.edgeWarn.splice(i, 1); }
}

  camTransform(ctx, DPR);
  const hw = W / 2 / zoom + 40, hh = H / 2 / zoom + 40;
  const x0 = clamp(Math.floor(cam.x - hw), 0, WORLD), y0 = clamp(Math.floor(cam.y - hh), 0, WORLD);
  const x1 = clamp(Math.ceil(cam.x + hw), 0, WORLD), y1 = clamp(Math.ceil(cam.y + hh), 0, WORLD);
  if (x1 > x0 && y1 > y0) {
    ctx.drawImage(Town.ground, x0, y0, x1 - x0, y1 - y0, x0, y0, x1 - x0, y1 - y0);
    const dx0 = x0 >> 1, dy0 = y0 >> 1, dw = Math.min(WORLD / 2 - dx0, ((x1 - x0) >> 1) + 1), dh = Math.min(WORLD / 2 - dy0, ((y1 - y0) >> 1) + 1);
    if (dw > 0 && dh > 0) ctx.drawImage(Town.decal, dx0, dy0, dw, dh, dx0 * 2, dy0 * 2, dw * 2, dh * 2);
  }
  const vis = (x, y, m = 60) => Math.abs(x - cam.x) < hw + m && Math.abs(y - cam.y) < hh + m;

  // pools
  for (const p of G.pools) {
    if (!vis(p.x, p.y, p.r)) continue;
    const a = Math.min(1, p.t / 0.5) * Math.min(1, (p.dur - p.t + 0.2) / 0.3);
    if (p.kind === 'acid') {
      ctx.fillStyle = `rgba(120,170,30,${0.35 * a})`; ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, TAU); ctx.fill();
      ctx.fillStyle = `rgba(170,220,60,${0.3 * a})`; ctx.beginPath(); ctx.arc(p.x, p.y, p.r * 0.65, 0, TAU); ctx.fill();
    } else {
      ctx.fillStyle = `rgba(255,120,30,${0.25 * a})`; ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, TAU); ctx.fill();
    }
  }
  // props that sit on the ground
  for (const p of Town.props) if (p.type === 'canopy' && vis(p.x + p.w / 2, p.y + p.h / 2, 200)) { ctx.fillStyle = 'rgba(0,0,0,0.18)'; ctx.fillRect(p.x + 10, p.y + 10, p.w, p.h); }
  // barrels
  for (const b of G.barrels) if (b.alive && vis(b.x, b.y)) drawBarrel(ctx, b.x, b.y, b.hurt > 0);
  // crates (landed)
  for (const c of G.crates) {
    if (c.drop > 0 || !vis(c.x, c.y)) continue;
    if (c.life < 10 && Math.floor(c.life * 5) % 2 === 0) continue;
    drawCrate(ctx, c.x, c.y);
  }
  if (G.lz) { // helipad markings are ground paint
    const L = G.lz;
    ctx.strokeStyle = 'rgba(235,250,255,0.75)'; ctx.lineWidth = 6;
    ctx.beginPath(); ctx.moveTo(L.x - 18, L.y - 24); ctx.lineTo(L.x - 18, L.y + 24); ctx.moveTo(L.x + 18, L.y - 24); ctx.lineTo(L.x + 18, L.y + 24); ctx.moveTo(L.x - 18, L.y); ctx.lineTo(L.x + 18, L.y); ctx.stroke();
    ctx.lineWidth = 3; ctx.beginPath(); ctx.arc(L.x, L.y, 44, 0, TAU); ctx.stroke();
  }
  // XP gems and pickups lie on the ground, under the zombies
  for (const g of G.gems) {
    if (!vis(g.x, g.y)) continue;
    const spr = Sprites.gem[gemTier(g.value)], s = 0.42 * (1 + Math.min(1, g.value / 20) * 0.45);
    ctx.drawImage(spr, g.x - spr.width * s / 2, g.y - spr.height * s / 2 + Math.sin(G.t * 4 + g.x) * 1.5, spr.width * s, spr.height * s);
  }
  for (const p of G.pickups) {
    if (!vis(p.x, p.y)) continue;
    if (p.t < 4 && Math.floor(p.t * 8) % 2 === 0) continue;
    const y = p.y + Math.sin(p.bob) * 2;
    ctx.fillStyle = 'rgba(255,255,255,0.14)'; ctx.beginPath(); ctx.arc(p.x, y, 15, 0, TAU); ctx.fill();
    if (p.kind === 'ammo') drawAmmoBox(ctx, p.x, y); else if (p.kind === 'med') drawMedkit(ctx, p.x, y); else drawGrenadeIcon(ctx, p.x, y, 1.1, 0, true);
  }
  // zombie shadows
  ctx.fillStyle = 'rgba(0,0,0,0.28)'; ctx.beginPath();
  for (const z of G.zombies) { if (!vis(z.x, z.y)) continue; const r = z.r * (z.type === 'gasbag' && z.fuse > 0 ? 1 + z.fuse * 0.25 : 1); ctx.moveTo(z.x + 3 + r, z.y + 4); ctx.ellipse(z.x + 3, z.y + 4, r, r * 0.8, 0, 0, TAU); }
  ctx.fill();
  // zombies
  for (const z of G.zombies) { if (vis(z.x, z.y, z.r + 20)) drawZombie(ctx, z); }
  // player
  for (const a of G.afterimages) { ctx.globalAlpha = a.t / 0.25 * 0.35; drawPlayerBody(ctx, P, a.x, a.y, a.a, true); }
  ctx.globalAlpha = 1;
  if (G.state !== 'title') drawPlayer(ctx, P);
  // grenades
  for (const n of G.grenades) {
    ctx.fillStyle = 'rgba(0,0,0,0.3)'; ctx.beginPath(); ctx.ellipse(n.x + 2, n.y + 3, 5, 4, 0, 0, TAU); ctx.fill();
    drawGrenadeIcon(ctx, n.x, n.y - n.h, 0.9 + n.h / 80, n.rot);
    if (n.t > 0.5 && Math.floor(n.t * 12) % 2 === 0) { ctx.fillStyle = '#ff3a2a'; ctx.beginPath(); ctx.arc(n.x, n.y - n.h - 6, 2, 0, TAU); ctx.fill(); }
  }
  // bullets
  ctx.lineCap = 'round';
  for (const b of G.bullets) {
    const l = Math.hypot(b.vx, b.vy), len = b.weapon === 'rifle' ? 60 : b.weapon === 'shotgun' ? 22 : 34;
    const tl = Math.min(len, b.travelled + 4);
    ctx.strokeStyle = b.gold ? '#ffd24a' : b.fire ? '#ff9a3a' : b.col; ctx.lineWidth = b.weapon === 'rifle' ? 2.5 : 2;
    ctx.beginPath(); ctx.moveTo(b.x - b.vx / l * tl, b.y - b.vy / l * tl); ctx.lineTo(b.x, b.y); ctx.stroke();
  }
  for (const t of G.tracers) {
    if (t.top) continue;
    ctx.strokeStyle = t.col; ctx.globalAlpha = t.t / t.max; ctx.lineWidth = t.w;
    ctx.beginPath(); ctx.moveTo(t.x0, t.y0); ctx.lineTo(t.x1, t.y1); ctx.stroke();
  }
  ctx.globalAlpha = 1;
  // particles
  drawParticles(ctx, vis);
  // spit / rocks in the air
  for (const s of G.spits) {
    ctx.fillStyle = 'rgba(0,0,0,0.3)'; ctx.beginPath(); ctx.ellipse(s.x, s.y, 6, 4, 0, 0, TAU); ctx.fill();
    if (s.kind === 'spit') { ctx.fillStyle = '#b8e04a'; ctx.beginPath(); ctx.arc(s.x, s.y - s.h, 6, 0, TAU); ctx.fill(); ctx.fillStyle = '#e8ff9a'; ctx.beginPath(); ctx.arc(s.x - 2, s.y - s.h - 2, 2.4, 0, TAU); ctx.fill(); }
    else { ctx.save(); ctx.translate(s.x, s.y - s.h); ctx.rotate(s.t * 6); ctx.fillStyle = '#5e5a50'; ctx.fillRect(-12, -9, 24, 18); ctx.fillStyle = '#7a766a'; ctx.fillRect(-12, -9, 24, 6); ctx.restore(); }
  }
  // cars, fences, buildings
  drawStatics(ctx, vis);
  // explosion flashes
  if (G.flashes) for (const f of G.flashes) {
    const k = 1 - f.t / 0.25, r = f.r * Math.min(1, k / 0.32);
    ctx.globalAlpha = Math.max(0, 1 - k) * 0.9;
    ctx.fillStyle = f.acid ? '#d8ff7a' : k < 0.3 ? '#fffbe0' : '#ffa040';
    ctx.beginPath(); ctx.arc(f.x, f.y, r, 0, TAU); ctx.fill();
  }
  ctx.globalAlpha = 1;
  // tree canopies (above everything on the ground)
  for (const t of Town.trees) {
    if (!vis(t.x, t.y, t.r)) continue;
    const near = Math.hypot(P.x - t.x, P.y - t.y) < t.r + 8;
    t.fade += ((near ? 0.35 : 0.96) - t.fade) * 0.15;
    ctx.globalAlpha = t.fade;
    ctx.drawImage(t.canvas, t.x - t.canvas.width / 2, t.y - t.canvas.height / 2);
  }
  ctx.globalAlpha = 1;
  // smoke draws above canopies
  drawSmoke(ctx, vis);
}

function drawStatics(c, vis) {
  for (const p of Town.props) {
    if (!vis(p.x + p.w / 2, p.y + p.h / 2, 120)) continue;
    if (p.type === 'car') {
      const cv = p.canvas;
      c.save(); c.translate(p.x + p.w / 2, p.y + p.h / 2);
      if (p.vertical) c.rotate(p.flip ? Math.PI / 2 : -Math.PI / 2); else if (p.flip) c.rotate(Math.PI);
      c.drawImage(cv, -cv.width / 2, -cv.height / 2); c.restore();
    } else if (p.type === 'bench') {
      c.fillStyle = 'rgba(0,0,0,0.3)'; c.fillRect(p.x + 3, p.y + 4, p.w, p.h);
      c.fillStyle = '#6a4a2a'; c.fillRect(p.x, p.y, p.w, p.h); c.fillStyle = '#80603a';
      if (p.vertical) for (let i = 0; i < 3; i++) c.fillRect(p.x + 2 + i * 6, p.y, 4, p.h); else for (let i = 0; i < 3; i++) c.fillRect(p.x, p.y + 2 + i * 6, p.w, 4);
    } else if (p.type === 'statue') {
      c.fillStyle = 'rgba(0,0,0,0.35)'; c.fillRect(p.x + 5, p.y + 6, p.w, p.h);
      c.fillStyle = '#8d8a82'; c.fillRect(p.x, p.y, p.w, p.h); c.fillStyle = '#a5a29a'; c.fillRect(p.x + 4, p.y + 4, p.w - 8, p.h - 8);
      c.fillStyle = '#5c6a5e'; c.beginPath(); c.arc(p.x + p.w / 2, p.y + p.h / 2, 11, 0, TAU); c.fill();
      c.fillStyle = '#6e7e70'; c.beginPath(); c.arc(p.x + p.w / 2 - 2, p.y + p.h / 2 - 2, 7, 0, TAU); c.fill();
    } else if (p.type === 'pump') {
      c.fillStyle = 'rgba(0,0,0,0.35)'; c.fillRect(p.x + 3, p.y + 4, p.w, p.h);
      c.fillStyle = '#c8c4b8'; c.fillRect(p.x, p.y, p.w, p.h); c.fillStyle = '#b3261e'; c.fillRect(p.x + 3, p.y + 3, p.w - 6, 12);
      c.fillStyle = '#222'; c.fillRect(p.x + 5, p.y + 20, p.w - 10, 6);
    } else if (p.type === 'crateStack') {
      c.fillStyle = 'rgba(0,0,0,0.35)'; c.fillRect(p.x + 4, p.y + 5, p.w, p.h);
      c.fillStyle = '#7a5a32'; c.fillRect(p.x, p.y, p.w, p.h); c.strokeStyle = '#4a3418'; c.lineWidth = 2; c.strokeRect(p.x + 1, p.y + 1, p.w - 2, p.h - 2);
      c.beginPath(); c.moveTo(p.x, p.y); c.lineTo(p.x + p.w, p.y + p.h); c.moveTo(p.x + p.w, p.y); c.lineTo(p.x, p.y + p.h); c.stroke();
    } else if (p.type === 'barrier') {
      c.fillStyle = 'rgba(0,0,0,0.35)'; c.fillRect(p.x + 3, p.y + 4, p.w, p.h);
      c.fillStyle = '#b8b4aa'; c.fillRect(p.x, p.y, p.w, p.h);
      c.fillStyle = '#d24a2a'; const n = Math.max(p.w, p.h) / 20;
      for (let i = 0; i < n; i += 2) p.vertical ? c.fillRect(p.x, p.y + i * 20, p.w, 10) : c.fillRect(p.x + i * 20, p.y, 10, p.h);
    } else if (p.type === 'canopy') {
      c.fillStyle = 'rgba(220,215,200,0.22)'; c.fillRect(p.x, p.y, p.w, p.h);
      c.strokeStyle = 'rgba(200,40,30,0.5)'; c.lineWidth = 4; c.strokeRect(p.x + 2, p.y + 2, p.w - 4, p.h - 4);
    }
  }
  for (const f of Town.fences) {
    if (!vis(f.x + f.w / 2, f.y + f.h / 2, 220)) continue;
    if (f.style === 'wall') {
      c.fillStyle = 'rgba(0,0,0,0.35)'; c.fillRect(f.x + 4, f.y + 5, f.w, f.h);
      c.fillStyle = '#8a8378'; c.fillRect(f.x, f.y, f.w, f.h); c.fillStyle = '#a29a8e'; c.fillRect(f.x + 2, f.y + 2, f.w - 4, f.h - 8);
      c.strokeStyle = 'rgba(0,0,0,0.2)'; c.lineWidth = 1;
      if (f.vertical) for (let y = f.y; y < f.y + f.h; y += 20) { c.beginPath(); c.moveTo(f.x, y + 0.5); c.lineTo(f.x + f.w, y + 0.5); c.stroke(); }
      else for (let x = f.x; x < f.x + f.w; x += 20) { c.beginPath(); c.moveTo(x + 0.5, f.y); c.lineTo(x + 0.5, f.y + f.h); c.stroke(); }
    } else {
      const cx = f.x + f.w / 2, cy = f.y + f.h / 2;
      c.strokeStyle = 'rgba(0,0,0,0.35)'; c.lineWidth = 5;
      c.beginPath(); if (f.vertical) { c.moveTo(cx + 3, f.y + 3); c.lineTo(cx + 3, f.y + f.h + 3); } else { c.moveTo(f.x + 3, cy + 3); c.lineTo(f.x + f.w + 3, cy + 3); } c.stroke();
      c.strokeStyle = '#7a5e3e'; c.lineWidth = 4;
      c.beginPath(); if (f.vertical) { c.moveTo(cx, f.y); c.lineTo(cx, f.y + f.h); } else { c.moveTo(f.x, cy); c.lineTo(f.x + f.w, cy); } c.stroke();
      c.fillStyle = '#5a4128';
      if (f.vertical) for (let y = f.y; y <= f.y + f.h; y += 10) c.fillRect(cx - 3, y - 1.5, 6, 3); else for (let x = f.x; x <= f.x + f.w; x += 10) c.fillRect(x - 1.5, cy - 3, 3, 6);
    }
  }
  for (const b of Town.buildings) if (vis(b.x + b.w / 2, b.y + b.h / 2, Math.max(b.w, b.h))) c.drawImage(b.canvas, b.x, b.y);
  for (const l of Town.lamps) {
    if (!vis(l.x, l.y)) continue;
    c.fillStyle = 'rgba(0,0,0,0.3)'; c.beginPath(); c.arc(l.x + 2, l.y + 3, 4, 0, TAU); c.fill();
    c.fillStyle = '#3a3d40'; c.beginPath(); c.arc(l.x, l.y, 3.5, 0, TAU); c.fill();
    c.fillStyle = l.broken ? '#555' : '#fff4c8'; c.beginPath(); c.arc(l.x, l.y, 1.8, 0, TAU); c.fill();
  }
}

function drawZombie(c, z) {
  const S = Sprites.zombie[z.type];
  const fr = [0, 1, 2, 1][Math.floor(z.anim) & 3];
  const img = S.set[z.v % S.set.length][fr];
  let sz = S.size * z.scale;
  let sx = 1, sy = 1;
  if (z.type === 'gasbag') { const f = z.fuse > 0 ? z.fuse / 1.2 : 0; sx = sy = 1 + 0.3 * f + Math.sin(G.t * 6 + z.eye * 9) * 0.03; }
  if (z.state === 'rear') { sx = 1.12; sy = 0.92; }
  if (z.spawnT > 0) { const k = 1 - z.spawnT / 0.35; sx *= k; sy *= k; c.globalAlpha = k; }
  c.save(); c.translate(z.x, z.y); c.rotate(z.angle + (z.stunT > 0 ? Math.sin(G.t * 20) * 0.15 : 0)); c.scale(sx, sy);
  if (z.elite) {
    c.globalAlpha = 0.5 + 0.3 * Math.sin(G.t * 6);
    c.drawImage(S.gold, -sz / 2 * 1.14, -sz / 2 * 1.14, sz * 1.14, sz * 1.14);
    c.globalAlpha = 1;
  }
  c.drawImage(img, -sz / 2, -sz / 2, sz, sz);
  if (z.type === 'gasbag' && z.fuse > 0 && Math.floor(z.fuse * (6 + z.fuse * 14)) % 2 === 0) { c.globalAlpha = 0.6; c.drawImage(S.flash, -sz / 2, -sz / 2, sz, sz); c.globalAlpha = 1; }
  if (z.type === 'hurler' && z.state === 'wind') { c.fillStyle = `rgba(220,255,120,${0.5 + 0.5 * Math.sin(G.t * 40)})`; c.beginPath(); c.arc(8.5 * z.scale, 0, 7, 0, TAU); c.fill(); }
  if (z.flash > 0) { c.globalAlpha = z.boss ? 0.35 : 0.75; c.drawImage(S.flash, -sz / 2, -sz / 2, sz, sz); c.globalAlpha = 1; }
  if (z.burnT > 0) { c.globalAlpha = 0.45 + 0.25 * Math.sin(G.t * 75 + z.eye * 10); c.drawImage(S.burn, -sz / 2, -sz / 2, sz, sz); c.globalAlpha = 1; }
  c.restore();
  c.globalAlpha = 1;
  if (z.stunT > 0) { // dizzy stars
    for (let i = 0; i < 3; i++) { const a = G.t * 5 + i * TAU / 3; c.fillStyle = '#ffe070'; c.beginPath(); c.arc(z.x + Math.cos(a) * 16, z.y - z.r - 4 + Math.sin(a) * 5, 2.4, 0, TAU); c.fill(); }
  }
  if (!z.boss && z.hp < z.maxHp && (z.maxHp >= 150 || z.elite)) { // small health bar for tough ones
    const w = z.r * 2; c.fillStyle = 'rgba(0,0,0,0.6)'; c.fillRect(z.x - w / 2, z.y - z.r - 10, w, 4);
    c.fillStyle = z.elite ? '#ffd24a' : '#e04a3a'; c.fillRect(z.x - w / 2, z.y - z.r - 10, w * clamp(z.hp / z.maxHp, 0, 1), 4);
  }
}

function drawPlayerBody(c, P, x, y, a, ghost, noShadow) {
  const w = WEAPONS[P.cur];
  const rec = ghost ? 0 : P.recoil;
  const step = Math.sin(P.anim) * 2.5;
  c.save(); c.translate(x, y);
  c.rotate(a);
  if (!ghost && !noShadow) { c.fillStyle = 'rgba(0,0,0,0.3)'; c.beginPath(); c.ellipse(3, 4, 13, 11, 0, 0, TAU); c.fill(); }
  // feet
  c.fillStyle = '#2a2a2e'; c.beginPath(); c.ellipse(step - 1, -6, 4, 3, 0, 0, TAU); c.ellipse(-step - 1, 6, 4, 3, 0, 0, TAU); c.fill();
  // backpack / fuel tank
  if (P.cur === 'flamer') { c.fillStyle = '#c4501e'; c.beginPath(); c.ellipse(-10, 0, 5, 8, 0, 0, TAU); c.fill(); c.fillStyle = '#e8743a'; c.fillRect(-12, -3, 3, 6); }
  else { c.fillStyle = '#5a4a32'; c.fillRect(-13, -7, 7, 14); c.fillStyle = '#6e5c40'; c.fillRect(-13, -7, 7, 4); }
  // gun
  const gl = w.len, gx = 6 - rec;
  c.fillStyle = '#1c1c20';
  c.fillRect(gx, -2.2, gl, 4.4);
  if (P.cur === 'shotgun' || P.cur === 'rifle') { c.fillStyle = '#6a4a2a'; c.fillRect(gx - 6, -2.6, 8, 5.2); }
  if (P.cur === 'rifle') { c.fillStyle = '#333'; c.fillRect(gx + 6, -3.6, 9, 1.8); }
  if (P.cur === 'smg') { c.fillStyle = '#2a2a2e'; c.fillRect(gx + 5, 2, 3, 5); }
  if (P.cur === 'flamer') { c.fillStyle = '#6a6e72'; c.fillRect(gx + gl - 4, -3, 5, 6); }
  if (P.cur === 'sidearm' && P.st.akimbo) { c.fillStyle = '#1c1c20'; c.fillRect(gx, -8, gl, 4); c.fillRect(gx, 4, gl, 4); }
  // arms
  c.strokeStyle = '#1e8e84'; c.lineWidth = 4.5; c.lineCap = 'round';
  c.beginPath(); c.moveTo(0, -8); c.lineTo(gx + 3, -3); c.moveTo(0, 8); c.lineTo(gx + 8, 1.5); c.stroke();
  c.fillStyle = '#e0b089'; c.beginPath(); c.arc(gx + 3, -2.5, 2.4, 0, TAU); c.arc(gx + 8, 1.8, 2.4, 0, TAU); c.fill();
  // body
  c.fillStyle = '#ffffff'; c.beginPath(); c.ellipse(-1, 0, 8.6, 11.6, 0, 0, TAU); c.fill();
  c.fillStyle = '#1fb5a8'; c.beginPath(); c.ellipse(-1, 0, 7.4, 10.4, 0, 0, TAU); c.fill();
  c.fillStyle = '#18968b'; c.beginPath(); c.ellipse(-3, 0, 4, 9, 0, 0, TAU); c.fill();
  // head
  c.fillStyle = '#ffffff'; c.beginPath(); c.arc(1.5, 0, 6.2, 0, TAU); c.fill();
  c.fillStyle = '#e0b089'; c.beginPath(); c.arc(1.5, 0, 5.2, 0, TAU); c.fill();
  c.fillStyle = '#3a2618'; c.beginPath(); c.arc(0, 0, 4.6, Math.PI * 0.55, Math.PI * 1.45); c.fill();
  c.restore();
}
function drawPlayer(c, P, top) {
  if (P.dead) {
    c.save(); c.translate(P.x, P.y); c.rotate(P.angle); c.scale(1, Math.max(0.55, 1 - P.deathT));
    c.globalAlpha = 1; c.translate(-P.x, -P.y); drawPlayerBody(c, P, P.x, P.y, 0, true); c.restore();
    return;
  }
  if (P.boarding > 1.2) c.globalAlpha = Math.max(0, 1 - (P.boarding - 1.2) / 0.8);
  if (P.iframes > 0 && P.dashT <= 0 && Math.floor(G.t * 20) % 2 === 0) c.globalAlpha *= 0.4;
  drawPlayerBody(c, P, P.x, P.y, P.angle, false, top);
  c.globalAlpha = 1;
  if (P.muzzle > 0 && !top) {
    const w = WEAPONS[P.cur], a = P.muzzleA;
    const mx = P.x + Math.cos(a) * (12 + w.len + 6), my = P.y + Math.sin(a) * (12 + w.len + 6);
    c.save(); c.translate(mx, my); c.rotate(a); c.globalCompositeOperation = 'lighter';
    const s = P.cur === 'shotgun' ? 1.6 : P.cur === 'rifle' ? 1.3 : 1;
    c.fillStyle = 'rgba(255,200,90,0.9)';
    c.beginPath(); c.moveTo(-2, 0); c.lineTo(8 * s, -6 * s); c.lineTo(20 * s, 0); c.lineTo(8 * s, 6 * s); c.closePath(); c.fill();
    c.fillStyle = 'rgba(255,255,220,0.95)'; c.beginPath(); c.arc(2, 0, 4 * s, 0, TAU); c.fill();
    c.restore();
  }
}

function drawParticles(c, vis) {
  for (let i = 0; i < PMAX; i++) {

const UIH = []; // clickable regions for this frame
function uiButton(x, y, w, h, label, action, opts = {}) {
  const hover = mouse.x >= x && mouse.x <= x + w && mouse.y >= y && mouse.y <= y + h;
  UIH.push({ x, y, w, h, action });
  ctx.fillStyle = hover ? (opts.hot || 'rgba(255,255,255,0.22)') : (opts.bg || 'rgba(255,255,255,0.1)');
  roundRect(ctx, x, y, w, h, 6 * UI); ctx.fill();
  ctx.strokeStyle = hover ? 'rgba(255,255,255,0.8)' : 'rgba(255,255,255,0.3)'; ctx.lineWidth = 1.5; ctx.stroke();
  ctx.fillStyle = opts.col || '#fff'; ctx.font = `bold ${fitSize(label, w - 14 * UI, 15 * UI, FONT_BODY, 'bold')}px ${FONT_BODY}`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText(label, x + w / 2, y + h / 2 + 1);
  return hover;
}
function fitSize(str, maxW, size, font, weight) { // the largest size (<= size) at which str fits in maxW
  ctx.font = `${weight} ${Math.round(size)}px ${font}`;
  const w = ctx.measureText(str).width;
  return w > maxW && w > 0 ? Math.max(8, Math.floor(size * maxW / w)) : Math.round(size);
}
function text(str, x, y, size, col = '#fff', align = 'left', font = FONT_BODY, weight = 'bold', shadow = true, maxW = 0) {
  size = Math.max(11, size);
  if (maxW > 0) size = fitSize(str, maxW, size, font, weight); // shrink rather than run off a box or the screen
  ctx.font = `${weight} ${Math.round(size)}px ${font}`; ctx.textAlign = align; ctx.textBaseline = 'middle';
  if (shadow) { ctx.fillStyle = 'rgba(0,0,0,0.75)'; ctx.fillText(str, x + Math.max(1, size / 14), y + Math.max(1, size / 14)); }
  ctx.fillStyle = col; ctx.fillText(str, x, y);
}
function wrapText(str, x, y, maxW, size, col, lineH, align = 'center') {
  size = Math.max(11, size); // measure at the size text() will actually draw (it never goes below 11px)
  lineH = Math.max(lineH, size * 1.18);
  ctx.font = `600 ${Math.round(size)}px ${FONT_BODY}`;
  const words = [];
  for (const w of str.split(' ')) { // a word wider than the line (a long Korean compound) breaks between syllables
    if (ctx.measureText(w).width <= maxW) { words.push(w); continue; }
    let part = '';
    for (const ch of w) { if (part && ctx.measureText(part + ch).width > maxW) { words.push(part); part = ch; } else part += ch; }
    if (part) words.push(part);
  }
  let line = '', yy = y;
  for (const w of words) {
    const t = line ? line + ' ' + w : w;
    if (ctx.measureText(t).width > maxW && line) { text(line, x, yy, size, col, align, FONT_BODY, '600', false); line = w; yy += lineH; }
    else line = t;
  }
  if (line) text(line, x, yy, size, col, align, FONT_BODY, '600', false);
  return yy;
}

function renderHUD() {

    const a = G.hurtDir, cx = W / 2 + Math.cos(a) * W * 0.5, cy = H / 2 + Math.sin(a) * H * 0.5;

    gr.addColorStop(0, `rgba(160,0,0,${0.55 * G.hurtDirT / 0.6})`); gr.addColorStop(1, 'rgba(160,0,0,0)');
    ctx.fillStyle = gr; ctx.fillRect(0, 0, W, H);

  const low = P.hp < P.maxHp * 0.3 && !P.dead;
  if (low || (P.st.cornered && low)) {
    const pulse = 0.5 + 0.5 * Math.sin(G.t * TAU * 70 / 60);
    const gr = ctx.createRadialGradient(W / 2, H / 2, Math.min(W, H) * 0.3, W / 2, H / 2, Math.max(W, H) * 0.7);
    gr.addColorStop(0, 'rgba(120,0,0,0)'); gr.addColorStop(1, `rgba(140,0,0,${0.35 + 0.25 * pulse})`);
    ctx.fillStyle = gr; ctx.fillRect(0, 0, W, H);

  }
  if (G.levelFlash > 0) { ctx.fillStyle = `rgba(120,255,170,${G.levelFlash * 0.18})`; ctx.fillRect(0, 0, W, H); }
  // edge warning glows (hordes / packs); their arrows are drawn last, above the HUD
  for (const e of G.edgeWarn) {
    const cx = W / 2 + Math.cos(e.a) * W * 0.55, cy = H / 2 + Math.sin(e.a) * H * 0.55;
    const al = (e.horde ? 0.55 : 0.4) * (0.65 + 0.35 * Math.sin(G.t * 14)) * Math.min(1, e.t);
    const gr = ctx.createRadialGradient(cx, cy, 0, cx, cy, Math.max(W, H) * 0.4);
    gr.addColorStop(0, `rgba(${e.col},${al})`); gr.addColorStop(1, `rgba(${e.col},0)`);
    ctx.fillStyle = gr; ctx.fillRect(0, 0, W, H);

  const xpH = 9 * u;
  ctx.fillStyle = 'rgba(0,0,0,0.6)'; ctx.fillRect(0, 0, W, xpH);
  const xpk = G.xp / G.xpNext;
  const gxp = ctx.createLinearGradient(0, 0, W, 0); gxp.addColorStop(0, '#2ad07a'); gxp.addColorStop(1, '#7affc0');
  ctx.fillStyle = gxp; ctx.fillRect(0, 0, W * xpk, xpH);

  ctx.fillStyle = 'rgba(0,0,0,0.6)'; roundRect(ctx, hx - 3, hy - 3, hw + 6, hh + 6, 6 * u); ctx.fill();
  const hk = clamp(P.hp / P.maxHp, 0, 1);

  text(`${Math.ceil(P.hp)} / ${P.maxHp}`, hx + hw / 2, hy + hh / 2 + 1, 14 * u, '#fff', 'center');

    score: 0, kills: 0, killsByType: {}, streak: 0, lastKillT: -9, bestStreak: 0, frenzyStacks: 0, lastFrenzyKill: -9,
    level: 1, xp: 0, xpNext: 14, pendingLevels: 0, rerolls: 2, levelDelay: 0, gemChain: 0, gemChainT: 0,
    cards: {}, timeline: [], modal: null, pendingLegendary: false, gemHint: false, reloadHints: 0, restartArm: 0,
    stats2: null,
    dir: { stress: 0, relaxT: 0, noDmgT: 0, build: false, acc: 0, packT: 0, wailerT: 0, hordes: [], calmT: 0, near: 0 },
    light: 1, darkCol: [0, 0, 0], phase: 'AFTERNOON', flashlight: false,
    lz: null, heli: null, boss: null, bossList: [], plane: null,
    cleanMinute: 0, minuteHurt: false, deathCause: '', endT: 0, deathReal: 0, finalScore: 0, newBest: false,
    flashRed: 0, hurtDir: 0, hurtDirT: 0, adrenalineUsed: false, levelFlash: 0, chainThisFrame: 0,
    stats: { shots: 0, hits: 0, dmg: {}, dmgTaken: 0, taken: {}, crates: 0, cratesDropped: 0, giant: false, knot: false, clean: 0 },
  });
  for (const p of parts) p.on = false;
}
function startGame() {
  Sound.init();
  G.seed = (Math.random() * 1e9) | 0;
  generateTown(G.seed);
  resetRun();
  const P = G.P = newPlayer();
  G.cam.x = P.x; G.cam.y = P.y; G.cam.kx = G.cam.ky = 0; G.cam.trauma = 0;
  Flow.build(P.x, P.y); Flow.timer = 0; Flow.bigTimer = 0; G.bigAlive = 0;
  // barrels
  const spots = Town.barrelSpots.slice().sort(() => Math.random() - 0.5).slice(0, 12);
  G.barrels = spots.map(s => ({ x: s.x, y: s.y, hp: 30, alive: true, respawn: 0, hurt: 0, fuse: 0 }));
  // opening shamblers
  for (let i = 0; i < 8; i++) {
    for (let k = 0; k < 20; k++) {
      const a = rand(TAU), d = rand(350, 600), x = P.x + Math.cos(a) * d, y = P.y + Math.sin(a) * d;
      if (walkableAt(x, y)) { makeZombie('shambler', x, y); break; }
    }
  }
  G.dir.packT = 30; G.dir.wailerT = 0;
  G.events = buildEvents();
  G.state = 'play';
  Sound.stopMusic(); Sound.startMusic(); Sound.rotorUpdate(0);
  banner('HARROW CREEK', 'Survive until the timer hits 00:00. Then get to the chopper.', '#f2eee4', 3.4);
  mouse.down = false;
  if (Touch.on) {
    touchReset(); Touch.aimA = P.angle; Touch.aimD = 240; Touch.aimHold = 0;
    if (!Touch.autoFS && fullscreenOK() && !isFullscreen()) { Touch.autoFS = true; Touch.wantFS = true; } // first run: go fullscreen on this tap's touchend
  }
}
function toTitle() {
  G.state = 'title';
  touchReset();
  Sound.stopMusic(); Sound.flameStop(); Sound.rotorUpdate(0);
  setupTitle();
}
function resume() { if (G.state === 'paused') { G.state = 'play'; Sound.resume(); } }
function pauseGame() { if (G.state === 'play' && !G.P.dead) { G.state = 'paused'; Sound.flameStop(); if (G.P) G.P.flaming = false; Sound.suspend(); } }
function finishRun(win) {
  G.state = win ? 'win' : 'dead';
  G.endT = 0;
  G.finalScore = G.score + (win ? 10000 + 50 * Math.ceil(G.P.hp) : 0);
  if (win) G.stats.win = true;
  G.newBest = G.finalScore > G.best;
  if (G.newBest) { G.best = G.finalScore; try { localStorage.setItem('harrowcreek_best', String(G.best)); } catch (e) { /* storage unavailable */ } }
  Sound.stopMusic(); Sound.flameStop(); Sound.rotorUpdate(0);
  if (win) Sound.victory();
}
function winGame() { finishRun(true); }

// ---------------------------------------------------------------------
// Title scene
// ---------------------------------------------------------------------
function setupTitle() {
  generateTown(12345);
  resetRun();
  G.P = newPlayer();
  G.light = 0.42; G.darkCol = [26, 16, 44];
  for (let i = 0; i < 70; i++) {
    const p = findWalkableNear(WORLD / 2 + rand(-900, 900), WORLD / 2 + rand(-900, 900), 200);
    if (p) { const z = makeZombie(pick(['shambler', 'shambler', 'shambler', 'sprinter', 'gasbag', 'hurler']), p.x, p.y); z.angle = rand(TAU); z.spawnT = 0; }
  }
  G.titleT = 0;
}
function updateTitle(dt) {
  G.titleT += dt; G.t += dt;
  const a = G.titleT * 0.04;
  G.cam.x = WORLD / 2 + Math.cos(a) * 520; G.cam.y = WORLD / 2 + Math.sin(a * 1.3) * 380;
  G.cam.shakeX = G.cam.shakeY = G.cam.rot = 0;
  for (const z of G.zombies) {
    z.angle += Math.sin(G.titleT * 0.7 + z.eye * 20) * dt * 0.8;
    const sp = z.speed * 0.45;
    z.x += Math.cos(z.angle) * sp * dt; z.y += Math.sin(z.angle) * sp * dt;
    if (collideWorld(z)) z.angle += Math.PI * 0.5 * dt * 4;
    z.anim += sp * dt * 0.07;
  }
  if (Math.random() < dt * 0.4) G.P.x = G.cam.x; // keep eye-range checks centred on the camera
  G.P.x = G.cam.x; G.P.y = G.cam.y;
}

// ---------------------------------------------------------------------
// Main update
// ---------------------------------------------------------------------
function step(dt) {
  const P = G.P;
  G.t += dt;
  const L = lightAt(G.t); G.light = L.light; G.phase = L.phase; G.darkCol = L.col;
  updateEvents(dt);
  if (!P.dead) updateDirector(dt);
  Flow.timer -= dt; Flow.bigTimer -= dt;
  if (Flow.timer <= 0) { Flow.timer = 0.25; Flow.build(P.x, P.y); }
  if (Flow.bigTimer <= 0 && G.bigAlive) { Flow.bigTimer = 0.5; if (G.bigAlive & 1) Flow.build(P.x, P.y, Flow.big2); if (G.bigAlive & 2) Flow.build(P.x, P.y, Flow.big3); }
  Grid.build(G.zombies);
  updatePlayer(P, dt);
  updateZombies(dt);
  Grid.build(G.zombies);
  updateBullets(dt);
  updateSpits(dt);
  updateBlasts(dt);
  updateCrates(dt);
  updateLZ(dt);
  updatePickups(dt);
  updateParticles(dt);
  levelUpCheck(dt);
  removeDeadZombies();
  G.decalFadeT = (G.decalFadeT || 0) + dt;
  if (G.decalFadeT > 4) { // old gore slowly soaks away so the streets stay readable
    G.decalFadeT = 0;
    const d = Town.dctx; d.save(); d.setTransform(1, 0, 0, 1, 0, 0); d.globalCompositeOperation = 'destination-out'; d.fillStyle = 'rgba(0,0,0,0.05)'; d.fillRect(0, 0, WORLD / 2, WORLD / 2); d.restore();
  }
  if (G.t >= 540 && Math.random() < dt * 25) { // blood-moon ash
    spawnPart({ type: 'ash', x: G.cam.x + rand(-W, W) / zoom / 2, y: G.cam.y - H / zoom / 2 - 10 + rand(H / zoom), vx: rand(10, 30), vy: rand(20, 40), life: 4, size: rand(1, 2.5), drag: 0 });
  }
}
function updateCamera(rdt) {
  const P = G.P, cam = G.cam;
  let lx = 0, ly = 0;
  if (!P.dead && !G.botInput) {
    const lead = Touch.on ? 0.14 : 0.22; // touch aim flips direction fast: a calmer camera lead
    lx = clamp((mouse.x - W / 2) / zoom * lead, -120, 120); ly = clamp((mouse.y - H / 2) / zoom * lead, -120, 120);
  }
  const tx = P.x + lx, ty = P.y + ly;
  const k = Math.min(1, rdt * 9);
  cam.x += (tx - cam.x) * k; cam.y += (ty - cam.y) * k;
  const kk = Math.exp(-rdt / 0.05);
  cam.kx *= kk; cam.ky *= kk;
  cam.trauma = Math.max(0, cam.trauma - 1.8 * rdt);
  const tr = cam.trauma * cam.trauma;
  const tt = performance.now() / 1000;
  cam.shakeX = (Math.sin(tt * 53) + Math.sin(tt * 97) * 0.5) / 1.5 * tr * 14 + cam.kx * zoom;
  cam.shakeY = (Math.sin(tt * 61 + 1) + Math.sin(tt * 89 + 2) * 0.5) / 1.5 * tr * 14 + cam.ky * zoom;
  cam.rot = Math.sin(tt * 43) * tr * 1.5 * DEG;
}
function update(rdt) {
  G.frame++;
  if (Touch.on) Touch.update(rdt);
  if (G.state === 'title') { updateTitle(rdt); return; }
  if (G.state === 'cards') { const M = G.modal; if (M) { M.t += rdt; M.lock -= rdt; } musicIntensity(rdt); Sound.rotorUpdate(G.heli ? 0.12 : 0); return; }
  if (G.state === 'paused') return;
  if (G.state === 'dead' || G.state === 'win') { G.endT += rdt; return; }
  // play
  if (G.banners.length) { G.banners[0].t += rdt; if (G.banners[0].t >= G.banners[0].dur) G.banners.shift(); } // banners only advance while playing
  G.flashRed = Math.max(0, G.flashRed - rdt / 0.2 * 0.25);
  G.hurtDirT -= rdt; G.levelFlash = Math.max(0, G.levelFlash - rdt * 2);
  G.hitstopBudget = Math.max(0, G.hitstopBudget - rdt * 0.12);
  let scale = 1;
  if (G.hitstop > 0) { G.hitstop -= rdt; scale = 0.05; }
  if (G.slowT > 0) { G.slowT -= rdt; scale *= G.slowScale; }
  const dt = Math.min(rdt, 1 / 30) * scale * (G.timeScale || 1); // timeScale: test hook for slow-motion playtesting
  const n = G.debugSpeed || 1;
  for (let i = 0; i < n && G.state === 'play'; i++) step(dt);
  updateCamera(rdt);
  musicIntensity(rdt);
  const P = G.P;
  if (P.dead) {
    P.deathT = Math.min(0.45, P.deathT + rdt * 0.4);
    G.deathReal += rdt;
    if (G.deathReal > 2.2) finishRun(false);
  }
}
function musicIntensity(rdt) {
  const m = Sound.music;
  let target = clamp(0.1 + 0.55 * (G.t / 600) + (G.dir.near || 0) * 0.012 + (G.dir.hordes.length ? 0.2 : 0) + (G.boss ? 0.2 : 0), 0, 1);
  if (G.dir.relaxT > 0) target *= 0.3;
  if (G.state !== 'play') target *= 0.5;
  m.intensity += (target - m.intensity) * Math.min(1, rdt * 0.8);
}

// ---------------------------------------------------------------------
// Rendering entry
// ---------------------------------------------------------------------
function render() {
  UIH.length = 0;
  if (G.state === 'title') {
    renderWorld();
    const dark = renderLighting();
    renderAboveDark(dark);
    renderTitle();
    return;
  }
  renderWorld();
  const dark = renderLighting();
  renderAboveDark(dark);
  if (!((G.state === 'dead' || G.state === 'win') && G.endT > 0.3)) renderHUD();
  renderTouchControls();
  if (G.state === 'cards') renderModal();
  else if (G.state === 'paused') renderPause();
  else if (G.state === 'dead' || G.state === 'win') renderEnd();
  renderCrosshair();
}

// ---------------------------------------------------------------------
// Input handlers
// ---------------------------------------------------------------------
function onKeyPress(code) {
  if (code === 'KeyM') { Sound.setMuted(!Sound.muted); return; }
  const P = G.P;
  switch (G.state) {
    case 'title':
      if (code === 'Enter' || code === 'Space') startGame();
      break;
    case 'play':
      if (code === 'Escape' || code === 'KeyP') { pauseGame(); return; }
      if (P.dead) return;
      if (code === 'KeyR') { if (!tryActiveReload(P)) startReload(P); }
      else if (code.startsWith('Digit')) { const i = +code.slice(5) - 1; if (WORDER[i]) switchWeapon(P, WORDER[i]); }
      else if (code === 'KeyQ') switchWeapon(P, P.last);
      else if (code === 'KeyG') throwGrenade(P);
      else if (code === 'Space' || code === 'ShiftLeft' || code === 'ShiftRight') doDash(P);
      if (G.debug) {
        if (code === 'BracketRight') G.t += 60;
        else if (code === 'BracketLeft') G.god = !G.god;
        else if (code === 'Backslash') { for (let i = 0; i < 250; i++) { const s = findSpawnSpot(rand(TAU), spawnDistance()); if (s) spawnOne('shambler', s.x, s.y); } }
        else if (code === 'Equal') addXp(G.xpNext - G.xp);
      }
      break;
    case 'cards':
      if (!G.modal || G.modal.t < 0.6) break; // ignore keys still held from the fight
      if (code === 'Digit1' || code === 'Digit2' || code === 'Digit3') chooseOption(+code.slice(5) - 1);
      else if (code === 'KeyF') rerollCards();
      else if (code === 'KeyX') skipCards();
      break;
    case 'paused':
      if (code === 'Escape' || code === 'KeyP') resume();
      break;
    case 'dead': case 'win':
      if (code === 'Enter' && G.endT > 1) startGame();
      break;
  }
}
function onMousePress(button) {
  Sound.init();
  if (G.state === 'title') { if (button === 0 && !pressUI()) startGame(); return; }
  if (G.state === 'play') { if (button === 2 && !G.P.dead) throwGrenade(G.P); return; }
  if (button !== 0) return;
  pressUI();
}
function pressUI() { // runs the on-screen button under the pointer; true if there was one
  for (let i = UIH.length - 1; i >= 0; i--) {
    const r = UIH[i];
    if (mouse.x >= r.x && mouse.x <= r.x + r.w && mouse.y >= r.y && mouse.y <= r.y + r.h) { mouse.down = false; r.action(); return true; }
  }
  return false;
}
function onWheel(dir) { if (G.state === 'play' && G.P && !G.P.dead && dir) cycleWeapon(G.P, dir); }
function onBlur() { pauseGame(); }

// ---------------------------------------------------------------------
// Boot & loop
// ---------------------------------------------------------------------
window.addEventListener('error', () => { G.errors++; });
window.HC = { startGame, chooseOption, skipCards, rerollCards, doDash, throwGrenade, switchWeapon, giveWeapon, spawnBoss, makeZombie, addXp, Sound, Town, mouse, keys, pauseGame, resume, toTitle, openCards, Touch, dropCrate, finishRun };
buildZombieSprites();
buildGemSprites();
setupTitle();
let lastT = performance.now(), fpsAcc = 0, fpsN = 0;
function frame(now) {
  requestAnimationFrame(frame);
  const rdt = Math.min(0.1, Math.max(0, (now - lastT) / 1000));
  lastT = now;
  fpsAcc += rdt; fpsN++;
  if (fpsAcc >= 0.5) {
    G.fps = fpsN / fpsAcc; fpsAcc = 0; fpsN = 0;
    // slow machine: render at 1 pixel per CSS pixel instead of the sharper high-DPI canvas
    if (G.state === 'play' && G.fps < 50 && DPR > 1 && !window.__lowRes) { G.slowFrames = (G.slowFrames || 0) + 1; if (G.slowFrames >= 4) { window.__lowRes = true; resize(); } } else G.slowFrames = 0;
  }
  try { update(rdt); render(); }
  catch (e) { G.errors++; console.error(e); }
}
requestAnimationFrame(frame);
</script>
