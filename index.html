// ---------------------------------------------------------------------
// The room screen (HTML on top of the canvas: it needs text boxes and copy / share)
// ---------------------------------------------------------------------
const InApp = (() => {
  const ua = navigator.userAgent || '';
  const kakao = /KAKAOTALK/i.test(ua), other = /(Instagram|FBAN|FBAV|Line\/|NAVER\(inapp|DaumApps|everytimeApp|BAND\/|Snapchat|Twitter|; wv\))/i.test(ua);
  return { on: kakao || other, kakao, android: /Android/i.test(ua), ios: /iPhone|iPad|iPod/i.test(ua) };
})();
function openExternal() { // leave an in-app browser (KakaoTalk...) for the phone's normal browser
  const url = location.href;
  if (InApp.kakao) location.href = 'kakaotalk://web/openExternal?url=' + encodeURIComponent(url);
  else if (InApp.android) location.href = 'intent://' + url.replace(/^https?:\/\//, '') + '#Intent;scheme=https;action=android.intent.action.VIEW;end';
  else { copyText(url); Lobby.note = say('Link copied. Open Safari or Chrome and paste it.'); Lobby.render(); }
}
function copyText(s) {
  try { if (navigator.clipboard && navigator.clipboard.writeText) { navigator.clipboard.writeText(s); return true; } } catch (e) { /* fall through */ }
  try { const t = document.createElement('textarea'); t.value = s; t.style.position = 'fixed'; t.style.opacity = '0'; document.body.appendChild(t); t.select(); document.execCommand('copy'); t.remove(); return true; } catch (e) { return false; }
}
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const Lobby = {
  el: null, open: false, view: '', data: {}, note: '', timer: 0,
  show(view, data) {
    if (!this.el) {
      this.el = document.getElementById('lobby');
      this.el.addEventListener('click', e => { const b = e.target.closest('[data-act]'); if (b) this.act(b.dataset.act); });
      this.el.addEventListener('keydown', e => { if (e.key === 'Enter' && e.target.id === 'lb-code') this.act('join'); });
    }
    if (view !== this.view) this.note = '';
    this.view = view; this.data = data || {}; this.open = true; this.el.hidden = false;
    G.menu = false; Sound.flameStop();
    if (view === 'lost') this.lostAt = performance.now();
    clearInterval(this.timer); this.timer = setInterval(() => {
      if (!this.open) return;
      if (this.view === 'lost' && !document.hidden && performance.now() - this.lostAt > 4000 && Net.code) { Net.join(Net.code); return; } // keep trying to get back
      if (this.view === 'connecting' || this.view === 'lobby') this.render();
    }, 1000);
    this.render();
  },
  hide() { if (this.el) this.el.hidden = true; this.open = false; clearInterval(this.timer); },
  back() { if (this.view === 'menu' || this.view === 'invite') { this.hide(); remember(''); setRoomUrl(''); } else Net.leave(); },
  act(a) {
    Sound.init(); Sound.click();
    const nick = document.getElementById('lb-nick'); if (nick) setNick(nick.value);
    if (a === 'create') Net.host();
    else if (a === 'join') { const c = normCode((document.getElementById('lb-code') || {}).value || this.data.code); if (c) Net.join(c); else { this.note = say('A room code is 6 letters and numbers.'); this.render(); } }
    else if (a === 'join-invite') Net.join(this.data.code);
    else if (a === 'start') Net.startRun();
    else if (a === 'copy') { this.note = copyText(inviteLink(Net.code)) ? say('Link copied. Send it to your friends.') : say('Copy the link above by hand.'); this.render(); }
    else if (a === 'share') { try { navigator.share({ title: say('HARROW CREEK'), text: say('Join my Harrow Creek room {code}', { code: Net.code }), url: inviteLink(Net.code) }).catch(() => {}); } catch (e) { /* not supported */ } }
    else if (a === 'retry') { const c = Net.code || this.data.code; if (c) Net.join(c); }
    else if (a === 'reload') location.reload();
    else if (a === 'external') openExternal();
    else if (a === 'solo') { Net.leave(); }
    else if (a === 'back') this.back();
  },
  render() {
    if (!this.el || !this.open) return;
    const v = this.view, S = (s, o) => esc(say(s, o)), code = esc(Net.code || this.data.code || '');
    const btn = (act, label, cls = '') => `<button data-act="${act}" class="${cls}">${label}</button>`;
    const nickBox = `<label class="lb-l">${S('Your name')}<input id="lb-nick" maxlength="12" autocomplete="off" value="${esc(myNick())}"></label>`;
    const inapp = InApp.on ? `<div class="lb-warn">${S('This looks like an in-app browser (KakaoTalk, Instagram...). Online play works best in the phone\'s normal browser.')}<br>${btn('external', S('Open in my browser'), 'small')}</div>` : '';

    if (v === 'menu') {

        ${btn('create', S('Make a room'), 'primary')}
        <div class="lb-row"><input id="lb-code" maxlength="6" placeholder="${S('room code')}" autocapitalize="characters" autocomplete="off">${btn('join', S('Join'))}</div>
        ${btn('back', S('Back'), 'ghost')}`;
    } else if (v === 'invite') {
      h = `<h1>${S('Join room {code}?', { code })}</h1><p>${S('A friend invited you to play together online.')}</p>${inapp}${nickBox}
        ${btn('join-invite', S('Join'), 'primary')}${btn('back', S('Play alone instead'), 'ghost')}`;
    } else if (v === 'connecting') {
      const s = Math.floor((performance.now() - Net.t0) / 1000), relays = Net.relayCount(), late = s >= NET.timeout;
      h = `<h1>${S('Joining room {code}', { code })}</h1><p class="lb-big">${late ? '' : '<span class="lb-spin"></span>'} ${S(relays ? 'Looking for the host… {s}s' : 'Reaching the relay servers… {s}s', { s })}</p>
        <p class="lb-dim">${S('Relay servers reached: {n}', { n: relays })}</p>${inapp}`;
      if (late) h += `<div class="lb-warn"><b>${S(Net.joinErr && /SDP/i.test(Net.joinErr) ? 'You found each other, but your networks block a direct connection.' : relays ? 'Can\'t reach the host yet.' : 'Can\'t reach any relay server.')}</b><ul>
        <li>${S('Check the room code, and that the host still has the game open.')}</li>
        <li>${S('Switch between Wi-Fi and mobile data, or try the same Wi-Fi as the host.')}</li>
        <li>${S('Turn off VPN, data saver or strict network settings.')}</li>
        <li>${S('In KakaoTalk or another app: open the link in your normal browser.')}</li></ul></div>`;
      h += btn('retry', S('Try again'), late ? 'primary' : '') + btn('solo', S('Play alone'), 'ghost');
    } else if (v === 'lobby') {
      const host = Net.mode === 'host', seats = Net.seats.slice().sort((a, b) => a.slot - b.slot), relays = Net.relayCount();
      h = `<h1>${S('Room {code}', { code })}</h1>`;
      if (host) h += `<p>${S('Send this link to your friends (up to 3):')}</p><div class="lb-link">${esc(inviteLink(Net.code))}</div>
        <div class="lb-row">${btn('copy', S('Copy link'))}${navigator.share ? btn('share', S('Share')) : ''}</div>
        <p class="lb-warn">${S('Keep this page open: your browser runs the game for everyone. A computer works best as the host.')}</p>
        ${relays ? '' : `<p class="lb-warn">${S(performance.now() - Net.t0 > 10000 ? 'Can\'t reach the relay servers. Check the internet connection.' : 'Connecting to the relay servers…')}</p>`}`;
      h += `<ul class="lb-seats">${seats.map(s => `<li><i style="background:${PLAYER_COLS[s.slot]}"></i>${esc(s.nick)}${(host ? s.host : s.slot === Net.mySlot) ? ' <em>' + S('(you)') + '</em>' : ''}${s.host ? ' <em>' + S('host') + '</em>' : ''}${s.connected ? '' : ' <em class="lb-off">' + S('reconnecting…') + '</em>'}</li>`).join('')}</ul>`;
      h += host ? btn('start', S(seats.length > 1 ? 'Start the run' : 'Start (alone for now)'), 'primary') : `<p class="lb-big">${S('Waiting for the host to start…')}</p>`;
      h += btn('solo', S('Leave the room'), 'ghost');
    } else if (v === 'wait') h = `<h1>${S('A run is under way')}</h1><p>${S('You will join the next run when this one ends.')}</p>${btn('solo', S('Play alone'), 'ghost')}`;
    else if (v === 'full') h = `<h1>${S('The room is full')}</h1><p>${S('A room holds 4 players.')}</p>${btn('retry', S('Try again'))}${btn('solo', S('Play alone'), 'ghost')}`;
    else if (v === 'version') h = `<h1>${S('Different versions')}</h1><p>${S('You have {me}, the room has {host}. Reload the page to get the latest version, and ask the host to do the same.', { me: BUILD, host: esc(this.data.host || '?') })}</p>${btn('reload', S('Reload'), 'primary')}${btn('solo', S('Play alone'), 'ghost')}`;
    else if (v === 'lost') h = `<h1>${S('Lost the host')}</h1><p>${S('The connection to the host dropped.')}</p>${btn('retry', S('Reconnect'), 'primary')}${btn('solo', S('Play alone'), 'ghost')}`;
    else if (v === 'closed') h = `<h1>${S('The host closed the room')}</h1>${btn('solo', S('Play alone'), 'primary')}`;
    if (this.note) h += `<p class="lb-note">${esc(this.note)}</p>`;
    h += `<p class="lb-ver">${esc(BUILD)}</p>`;
    const focus = document.activeElement && document.activeElement.id, val = focus && document.getElementById(focus) ? document.getElementById(focus).value : null;
    this.el.innerHTML = `<div class="lb-card">${h}</div>`;
    if (focus && document.getElementById(focus)) { const f = document.getElementById(focus); if (val !== null) f.value = val; f.focus(); }
  },
};
// a phone that slept or switched apps comes back to a room that is still there (or reconnects to it)
document.addEventListener('visibilitychange', () => {
  if (document.hidden) return;
  if (Awake.want) Awake.on();
  if (Net.mode === 'guest' && !Net.hostPeer && Net.code && !Net.inRun) Net.join(Net.code);
  if (Lobby.open) Lobby.render();
});
const Awake = { lock: null, want: false, // keep the screen on while in a room
  on() { this.want = true; try { if (navigator.wakeLock && !this.lock && !document.hidden) navigator.wakeLock.request('screen').then(l => { this.lock = l; l.addEventListener('release', () => { this.lock = null; }); }).catch(() => {}); } catch (e) { /* not supported */ } },
  off() { this.want = false; try { if (this.lock) this.lock.release(); } catch (e) { /* already released */ } this.lock = null; },
};
// A hidden, minimised or covered window gets no animation frames. While hosting, a worker timer (which browsers
// throttle far less than page timers) steps the world whenever the frames stop, so the others keep playing.
const BgTick = { w: null,
  start() {
    if (this.w || typeof Worker === 'undefined') return;
    try { this.w = new Worker(URL.createObjectURL(new Blob(['setInterval(function(){postMessage(0)},33)'], { type: 'text/javascript' }))); this.w.onmessage = () => { if (performance.now() - lastRaf > 150) frameTick(performance.now(), false); }; }
    catch (e) { this.w = null; }
  },
  stop() { if (this.w) { this.w.terminate(); this.w = null; } },
};
window.addEventListener('pagehide', () => { // closing the tab: tell the others now instead of letting them wait for a timeout
  if (Net.mode === 'guest' && Net.hostPeer) Net.send('c', ['bye'], Net.hostPeer);
  else if (Net.mode === 'host') for (const s of Net.seats) if (s.peer && s.connected) Net.send('c', ['bye'], s.peer);
});
function bootRoom() { // an invite link (?room=CODE): one tap to join; a refresh of a tab already in that room goes straight back in
  const code = normCode(new URLSearchParams(location.search).get('room'));
  if (!code) return;
  let ses = null; try { ses = JSON.parse(sessionStorage.getItem('harrowcreek_room') || 'null'); } catch (e) { /* storage unavailable */ }
  if (ses && ses.code === code) { if (ses.host) Net.host(code); else Net.join(code); }
  else Lobby.show('invite', { code });
}

// ---------------------------------------------------------------------
// Boot & loop
// ---------------------------------------------------------------------
window.addEventListener('error', () => { G.errors++; });
window.HC = { startGame, chooseOption, skipCards, rerollCards, doDash, throwGrenade, switchWeapon, giveWeapon, spawnBoss, makeZombie, addXp: v => addXp(G.P, v), Sound, Town, mouse, keys, pauseGame, resume, toTitle, openCards, Touch, dropCrate, finishRun, Net };
buildZombieSprites();
buildGemSprites();
setupTitle();
let lastT = performance.now(), fpsAcc = 0, fpsN = 0;
let lastRaf = 0;
function frame(now) {
  requestAnimationFrame(frame);
  lastRaf = performance.now();
  frameTick(now, true);
}
// draw = false: the host's tab is in the background (ticked by a worker timer), so the world keeps going for the others
function frameTick(now, draw) {
  const rdt = Math.min(0.1, Math.max(0, (now - lastT) / 1000));
  lastT = now;
  fpsAcc += rdt; fpsN++;
  if (fpsAcc >= 0.5) {
    G.fps = fpsN / fpsAcc; fpsAcc = 0; fpsN = 0;
    // slow machine: render at 1 pixel per CSS pixel instead of the sharper high-DPI canvas
    if (G.state === 'play' && G.fps < 50 && DPR > 1 && !window.__lowRes) { G.slowFrames = (G.slowFrames || 0) + 1; if (G.slowFrames >= 4) { window.__lowRes = true; resize(); } } else G.slowFrames = 0;
  }
  try { update(rdt); if (draw) render(); }
  catch (e) { G.errors++; console.error(e); }
}
requestAnimationFrame(frame);
bootRoom();
</script>
